    for (const e of rounds.values()) {
      const me = meAt(e.y);
      if (me == null || !e.flag.has(me)) continue;
      const key = e.y + "|" + e.teams.slice().sort((x, z) => x - z).join(",");
      if (seen.has(key)) continue; seen.add(key);
      const three = [...e.flag.values()].filter((x) => x === 3).length;
      let r;
      if (e.teams.length === 2 && three === 1) r = e.flag.get(me) === 3 ? "준우승" : "우승";
      else if (e.teams.length === 2) r = "결승";
      else r = e.teams.length + "강";
      const foe = e.teams.length === 2 ? e.teams.find((t) => t !== me) : null;
      if (!byYear.has(e.y)) byYear.set(e.y, []);
      byYear.get(e.y).push({ r: r, teams: e.teams.length, foe: foe, foeName: foe ? nameOf(foe) : null });
    }
    const ORD = { "우승": 0, "준우승": 1, "결승": 2 };
    out.trophies = [...byYear].sort((a, c) => a[0] - c[0]).map(([y, v]) => ({
      season: seasonStr(y),
      items: v.filter((x) => ORD[x.r] != null).sort((a, c) => ORD[a.r] - ORD[c.r]),
      deepest: Math.min.apply(null, v.map((x) => x.teams)) }));
    return out.trophies.length + "시즌 · 우승 " +
      out.trophies.reduce((a, s) => a + s.items.filter((x) => x.r === "우승").length, 0);
  }, note);

  part("⑤ 컵 여정", () => {
    const rounds = cupRounds(NEED(D.cup, "컵 이력(dumps.cup)"));
    const SAME = cfg.runSame == null ? 120 : cfg.runSame;
    const GAP = cfg.runGap == null ? 15 : cfg.runGap;
    const mine = new Map(), seen = new Map();
    for (const e of rounds.values()) {
      const me = meAt(e.y);
      if (me == null || !e.flag.has(me)) continue;
      const key = e.y + "|" + e.teams.slice().sort((x, z) => x - z).join(",");
      const prior = seen.get(key);
      if (prior && prior.some((r) => Math.abs(r - e.rid) <= SAME)) continue;
      if (prior) prior.push(e.rid); else seen.set(key, [e.rid]);
      const three = [...e.flag.values()].filter((x) => x === 3).length;
      let r = null;
      if (e.teams.length === 2) r = three === 1 ? (e.flag.get(me) === 3 ? "준우승" : "우승") : "결승";
      if (!mine.has(e.y)) mine.set(e.y, []);
      mine.get(e.y).push({ rid: e.rid, n: e.teams.length, r: r,
        foe: e.teams.length === 2 ? e.teams.find((t) => t !== me) : null });
    }
    let ok = 0, bad = 0;
    out.runs = [...mine].sort((a, c) => a[0] - c[0]).map(([y, list]) => {
      list.sort((a, c) => a.rid - c.rid);
      const groups = [];
      for (const it of list) {
        const g = groups[groups.length - 1];

        const near = g && it.rid - g[g.length - 1].rid <= GAP;
        const shrinking = g && it.n <= g[g.length - 1].n;
        if (near && shrinking) g.push(it); else groups.push([it]);
      }
      for (const g of groups) {
        const ns = g.map((x) => x.n);
        ns.every((v, i) => i === 0 || v <= ns[i - 1]) ? ok++ : bad++;
      }
      return { season: seasonStr(y), runs: groups.map((g) => ({
        from: Math.max.apply(null, g.map((x) => x.n)),
        to: Math.min.apply(null, g.map((x) => x.n)),
        rid: g[0].rid,
        result: (g.find((x) => x.r) || {}).r || (Math.min.apply(null, g.map((x) => x.n)) + "강"),
        foe: (g.find((x) => x.foe) || {}).foe || null })) };
    });
    return "단조 감소 " + ok + " · 어긋남 " + bad + " (" + (100 * ok / (ok + bad)).toFixed(1) + "%)";
  }, note);

  part("⑥ 대회 이름(캡처)", () => {
    if (!CAPT.cups || !CAPT.cups.length) throw new Error("캡처 정답지가 없다");
    if (!out.runs) throw new Error("컵 여정이 없다");
    const want = new Map();
    const add = (y, comp, result) => {
      if (y < FROM || (cfg.until && y > cfg.until)) return;
      if (!want.has(y)) want.set(y, []);
      want.get(y).push({ comp: comp, result: result });
    };
    for (const c of CAPT.cups) {
      for (const y of (c.win || [])) add(c.summer ? y : y - 1, c, "우승");
      for (const y of (c.lose || [])) add(c.summer ? y : y - 1, c, "준우승");
    }
    const mine = new Map(out.runs.map((s) => [+s.season.slice(0, 4),
      s.runs.filter((r) => r.result === "우승" || r.result === "준우승" || r.result === "결승")]));
    let agree = 0, differ = 0;
    for (const y of [...new Set([...want.keys(), ...mine.keys()])].sort()) {
      ((want.get(y) || []).length === (mine.get(y) || []).length) ? agree++ : differ++;
    }
    let named = 0, unnamed = 0;
    const next = out.runs.map((s) => {
      const y = +s.season.slice(0, 4);
      const pool = (want.get(y) || []).slice();
      return { season: s.season, runs: s.runs.map((r) => {
        if (r.result !== "우승" && r.result !== "준우승" && r.result !== "결승") return r;

        const single = r.from === 2;
        let i = pool.findIndex((c) => c.result === r.result && !!c.comp.summer === single);
        if (i < 0) i = pool.findIndex((c) => !!c.comp.summer === single);
        if (i < 0) i = pool.findIndex((c) => c.result === r.result);
        if (i < 0) i = pool.length ? 0 : -1;
        if (i < 0) { unnamed++; return r; }
        const c = pool.splice(i, 1)[0];
        named++;

        return Object.assign({}, r, { comp: c.comp.name, short: c.comp.short,
          result: r.result === "결승" ? c.result : r.result, byCapture: r.result === "결승" });
      }) };
    });

    const rate = (agree + differ) ? agree / (agree + differ) : 0;
    if (rate < 0.7 || unnamed > named / 4)
      throw new Error("이 캡처 정답지는 이 세이브 것이 아니다 — 결승 수 일치 " +
        (100 * rate).toFixed(0) + "% · 이름 못 붙인 결승 " + unnamed + "개");
    capOK = true;
    out.runs = next;
    out.honours = CAPT.cups.map((c) => ({ name: c.name, short: c.short, win: c.win, lose: c.lose }));
    if (CAPT.leagues) out.leagues = CAPT.leagues;
    return "결승 수 일치 " + agree + "해 · 어긋남 " + differ + "해 · 이름 붙음 " + named + " · 못 붙임 " + unnamed;
  }, note);

  part("⑦ 월드컵", () => {
    const rid = (cfg.rounds || {}).worldcup;
    if (!rid) throw new Error("월드컵 라운드 번호가 설정에 없다");
    const rounds = cupRounds(NEED(D.cup, "컵 이력(dumps.cup)"));
    const byYear = new Map();
    for (const e of rounds.values()) {
      if (e.rid !== rid) continue;
      byYear.set(e.y, e.teams.map((t) => ({ t: t, f: e.flag.get(t) })));
    }
    out.worldcup = [...byYear].filter(([, v]) => v.length === 2).sort((a, c) => a[0] - c[0])
      .map(([y, v]) => {
        const w = v.find((x) => x.f !== 3), l = v.find((x) => x.f === 3);
        return { year: y, win: w ? w.t : null, winName: w ? (NAT[w.t] || null) : null,
          lose: l ? l.t : null, loseName: l ? (NAT[l.t] || null) : null };
      });
    return out.worldcup.map((x) => x.year + ":" + (x.winName || x.win)).join(" ");
  }, note);

  part("⑦ 아시안 컵", () => {
    const rid = (cfg.rounds || {}).asiancup;
    if (!rid) throw new Error("아시안 컵 라운드 번호가 설정에 없다");
    const c = readSection(NEED(D.asiancup || D.cup, "컵 이력(dumps.asiancup)"), SPEC.cup), H = 8, SZ = 18;
    const N = Math.floor((c.length - H) / SZ);
    const by = new Map();
    for (let i = 0; i < N; i++) {
      const o = H + i * SZ;
      if (c.readUInt32LE(o) !== rid) continue;
      const s = c.readUInt16LE(o + 4), k = c[o + 8], t = c.readUInt32LE(o + 14);
      if (!by.has(s)) by.set(s, {});
      if (k === 2) by.get(s).win = t; else if (k === 3) by.get(s).lose = t;
    }

    out.asiancup = [...by].filter(([s, v]) => s >= (cfg.asiancupFrom || FROM) && v.win)
      .sort((a, b) => a[0] - b[0])
      .map(([s, v]) => ({ season: s, year: s + 1, win: v.win, winName: NAT[v.win] || null,
        lose: v.lose, loseName: NAT[v.lose] || null }));
    return out.asiancup.map((x) => x.year + ":" + (x.winName || x.win)).join(" ");
  }, note);

  part("⑧ 감독 재임", () => {
    const b = fs.readFileSync(NEED(D.manager, "감독 기록(dumps.manager)"));
    const SIG = Buffer.from("15ffffffffffff", "hex");
    const byTeam = new Map();
    let a = -1;
    while ((a = b.indexOf(SIG, a + 1)) >= 0) {
      const id = b.readUInt32LE(a + 7);
      if (id < 1 || id > 400000) continue;
      const team = b.readUInt32LE(a + 12);
      const day = b.readUInt16LE(a + 16) & 0x1ff, y = b.readUInt16LE(a + 18);
      if (y < 2000 || y > 2060 || day < 1 || day > 366) continue;
      if (!byTeam.has(team)) byTeam.set(team, new Set());
      byTeam.get(team).add(y);
    }

    if (!byTeam.size) throw new Error("감독 기록에서 레코드를 하나도 못 찾았다 — 이 구획이 아니거나 배치가 다르다");
    out.spells = [...byTeam].map(([team, ys]) => {
      const a2 = [...ys].sort();
      return { team: team, name: NAT[team] || null, from: a2[0], to: a2[a2.length - 1], years: a2.length };
    }).sort((x, z) => x.from - z.from || z.years - x.years);
    return out.spells.length + "곳";
  }, note);

  if (CLUB == null && C && C.meta && C.meta.clubId) {
    CLUB = C.meta.clubId;
    note.ok.push("⑨-0 수상 구단 번호 — 내보내기에서 그대로 읽었다: " + CLUB);
  }
  if (cfg.club.uid == null && CLUB == null) {
    part("⑨-0 수상 구단 번호 유도", () => {
      const mp = require(path.join(AR, "save", "clubmap.js")).buildMapper(NEED(D.clubmapDir, "이름표 폴더(dumps.clubmapDir)"), cfg.clubmapYear);
      const r = mp && mp.clubOf ? mp.clubOf(ME) : null;
      if (!r || !(r.full || r.name)) throw new Error("기록표 번호 " + ME + " 에 구단 이름을 못 붙였다");
      const nm = r.full || r.name;
      const clubs = new Map(JSON.parse(fs.readFileSync(
        NEED(D.clubsJson || (D.clubmapDir + "/clubs.json"), "이름표(dumps.clubsJson)"), "utf8")));
      let hit = null;
      for (const [id, v] of clubs) if (v.full === nm || v.short === nm) { hit = id; break; }
      if (hit == null) for (const [id, v] of clubs) if (v.full.indexOf(nm) >= 0) { hit = id; break; }
      if (hit == null) throw new Error("이름표에서 \"" + nm + "\" 을 못 찾았다");
      CLUB = hit + 1;

      if (!out.club || !out.club.name) out.club = Object.assign({}, out.club, { name: nm, nameGuess: true });
      const conf = r.tot ? Math.round(100 * r.n / r.tot) : null;
      if (conf != null && conf < 40)
        note.warn.push("구단 이름 추정이 얇다 (근거 " + conf + "%) — 수상이 남의 구단 것일 수 있다");
      return ME + " → " + nm + " → 이름표 " + hit + " → 수상표 " + CLUB + (conf != null ? " (근거 " + conf + "%)" : "");
    }, note);
  }

  let PEOPLE = null, NAMEOF = null, AWARD = null;

  const MGR = new Set(cfg.managerAwards || [97, 99, 101, 103]);
  part("⑨ 사람 표 · 상 이름", () => {
    AWARD = awardNames(AR);
    const gdbs = (D.gameDb || []).map(R);
    if (!gdbs.length) throw new Error("game_db 가 설정에 없다");
    const u = peopleUnion(gdbs);
    PEOPLE = u.by;

    let NAMES = new Map(), DICT = new Map();
    try { NAMES = require(path.join(AR, "save", "names.js")).build(AR, { club: cfg.club.name }); } catch (e) {}
    try { DICT = require(path.join(AR, "save", "names.js")).dictionary(fs.readFileSync(gdbs[0])); } catch (e) {}
    NAMEOF = (u2) => {
      const p = PEOPLE.get(u2); if (!p) return null;
      const n = p.id != null ? NAMES.get(p.id) : null;
      return (n && (n.localName || n.fullName || n.name)) || p.full || DICT.get(p.sur) ||
        (p.id != null ? "사람" + p.id : null);
    };
    return "UID2→사람 " + PEOPLE.size + " (덤프 " + gdbs.length + "개 합집합 · 애매한 " + u.dropped +
      "개 버림) · 상 이름 " + Object.keys(AWARD).length + "종";
  }, note);

  part("⑨ 수상", () => {
    if (!PEOPLE) throw new Error("사람 표가 없다");

    if (CLUB == null) throw new Error("수상 표의 구단 번호를 모른다");

    const b = readSection(NEED(D.award, "수상 이력(dumps.award)"), SPEC.award), SZ = 82, H = 8;
    const N = (b.length - H) / SZ;
    const rows = [];
    for (let i = 0; i < N; i++) {
      const o = H + i * SZ, y = b.readUInt16LE(o);
      if (y < 1889 || y > 2100) continue;
      rows.push({ y: y, a: b.readUInt16LE(o + 2), who: b.readUInt32LE(o + 4),
        club: b.readUInt32LE(o + 8), age: b[o + 12] });
    }
    const mine = rows.filter((r) => r.club === CLUB && r.y >= FROM);
    const byWho = new Map();
    for (const r of mine) { if (!byWho.has(r.who)) byWho.set(r.who, []); byWho.get(r.who).push(r); }

    const players = [...byWho].map(([u2, rs]) => {
      const onlyMgr = rs.every((r) => MGR.has(r.a));
      const yrs = [...new Set(rs.map((r) => r.y))].sort();
      const t = new Map(); for (const r of rs) t.set(r.a, (t.get(r.a) || 0) + 1);
      return { uid2: u2, name: NAMEOF(u2) || (onlyMgr ? (cfg.managerName || null) : null), manager: onlyMgr,
        total: rs.length, kinds: t.size, from: yrs[0], to: yrs[yrs.length - 1],
        named: [...t].filter(([a]) => AWARD[a]).map(([a, c]) => ({ name: AWARD[a], n: c }))
          .sort((x, z) => z.n - x.n),
        perYear: yrs.map((y) => [y, rs.filter((r) => r.y === y).length]) };
    }).sort((a, c) => c.total - a.total);

    const golden = rows.filter((r) => r.a === 0 && r.y >= FROM).sort((a, c) => a.y - c.y)
      .map((r) => ({ year: r.y, name: NAMEOF(r.who) || ("UID2 " + r.who), age: r.age, mine: r.club === CLUB }));

    let lee = null;
    if (cfg.star) {
      const rs = rows.filter((r) => r.who === cfg.star && r.y >= FROM);
      lee = { name: NAMEOF(cfg.star), total: rs.length, years: [], kinds: new Set(rs.map((r) => r.a)).size };
      for (const y of [...new Set(rs.map((r) => r.y))].sort()) {
        const v = rs.filter((r) => r.y === y);
        lee.years.push({ year: y, n: v.length, age: v[0].age,
          named: [...new Set(v.map((r) => r.a))].filter((a) => AWARD[a]).map((a) => AWARD[a]) });
      }
    }
    out.awards = { players: players, golden: golden, lee: lee, total: mine.length,
      winners: byWho.size, kinds: new Set(mine.map((r) => r.a)).size,
      named: Object.keys(AWARD).length, dump: cfg.awardDumpLabel || null };

    const noName = players.filter((p) => !p.name).length;

    if (byWho.size && noName / byWho.size > 0.6)
      note.warn.push("우리 수상자 " + byWho.size + "명 중 " + noName + "명에 이름이 안 붙었다 — game_db 가 온전한지 볼 것");
    return mine.length + "회 · 수상자 " + byWho.size + " · 이름 못 붙은 수상자 " + noName + "명";
  }, note);

  part("⑨ 포디움", () => {
    if (!PEOPLE) throw new Error("사람 표가 없다");
    const b = readSection(NEED(D.award, "수상 이력(dumps.award)"), SPEC.award), SZ = 82, H = 8, SLOT = 26, BASE = 4;
    const N = (b.length - H) / SZ;
    const all = [];
    for (let i = 0; i < N; i++) {
      const o = H + i * SZ, y = b.readUInt16LE(o);
      if (y < FROM || y > 2100) continue;
      const award = b.readUInt16LE(o + 2);
      if (!AWARD[award]) continue;
      const place = [];
      for (let s = 0; s < 3; s++) {
        const p = o + BASE + SLOT * s, u = b.readUInt32LE(p);
        if (u === 0 || u === 0xffffffff) { place.push(null); continue; }
        place.push({ name: NAMEOF(u) || ("UID2 " + u), age: b[p + 8], mine: b.readUInt32LE(p + 4) === CLUB });
      }
      if (place.every((x) => !x)) continue;
      all.push({ award: award, y: y, place: place });
    }
    const byAward = new Map();
    for (const r of all) { if (!byAward.has(r.award)) byAward.set(r.award, []); byAward.get(r.award).push(r); }

    out.podium = [...byAward].map(([a, v]) => ({
      id: a, name: AWARD[a], mgr: MGR.has(a), mine: v.some((r) => r.place.some((q) => q && q.mine)),
      seasons: v.sort((x, z) => x.y - z.y).map((r) => ({ y: r.y, p: r.place })) }))
      .sort((x, z) => (z.mine - x.mine) || (z.seasons.length - x.seasons.length) || x.id - z.id);
    return "상 " + out.podium.length + "종 · 시즌카드 " + all.length + "장 · 우리가 오른 상 " +
      out.podium.filter((x) => x.mine).length + "종";
  }, note);

  part("⑩ 트로피 사진(캡처)", () => {
    if (!capOK) throw new Error("이 세이브의 캡처 정답지가 아니다 — 사진을 못 붙인다");
    out.cupPix = JSON.parse(fs.readFileSync(NEED(CAPT.cupPix, "트로피 사진(capture.cupPix)"), "utf8"));

    if (CAPT.shapes) out.shapes = CAPT.shapes;
    return Object.keys(out.cupPix).length + "개";
  }, note);
  part("⑩ 올해의 팀", () => {
    if (!capOK) throw new Error("이 세이브의 캡처 정답지가 아니다 — 올해의 팀을 못 붙인다");
    out.bestxi = JSON.parse(fs.readFileSync(NEED(CAPT.bestxi, "올해의 팀(capture.bestxi)"), "utf8"));
    return out.bestxi.length + "개";
  }, note);

  const ORDER = ["club", "generatedAt", "savedAt", "timeline", "squad", "curves",
    "trophies", "records", "rosters", "runs", "leagues", "honours",
    "worldcup", "spells", "awards", "podium", "cupPix", "shapes", "asiancup", "bestxi", "nations"];
  const tidy = {};
  for (const k of ORDER) if (k in out) tidy[k] = out[k];
  for (const k of Object.keys(out)) if (!(k in tidy)) tidy[k] = out[k];

  return { payload: tidy, note: note };
}

if (require.main === module) {
  const argv = process.argv.slice(2);
  let src = null, dest = null;
  for (let i = 0; i < argv.length; i++) {
    if (argv[i] === "--out") dest = argv[++i];
    else if (!src) src = argv[i];
  }
  if (!src) { console.log("쓰기: node payload.js <설정.json> [--out payload.json]"); process.exit(1); }
  const cfg = JSON.parse(fs.readFileSync(src, "utf8"));
  cfg.__base = path.dirname(path.resolve(src));
  const r = build(cfg, console.log);
  for (const s of r.note.ok) console.log("  " + s);
  for (const s of r.note.warn) console.log("  ⚠ " + s);
  for (const s of r.note.skip) console.log("  ⚠ " + s);
  const json = JSON.stringify(r.payload);
  const out = dest || path.join(__dirname, "payload.json");
  fs.writeFileSync(out, json);
  console.log("칸 " + Object.keys(r.payload).length + "개 · " + (json.length / 1024).toFixed(0) + "KB → " + out);
  if (r.note.skip.length) console.log("건너뛴 갈래 " + r.note.skip.length + "개 — 그 칸은 자료에 없다");
}

module.exports = { build, awardNames, cupRounds, scanPeople, peopleUnion };

});</script>
<script>
"use strict";

const REG = {};
const norm = (p) => p.replace(/^\.\//, "");

async function loadModule(file) {
  const m = window.__REG[norm(file)];
  if (!m) throw new Error("모듈을 못 찾음: " + file);
  REG[file] = m;
  return m;
}

let core = null, platform = null, render = null;

const SAVE_FILES = new Map();

const TROPHY_FILES = new Map();
let DATA = null;

async function boot() {
  await loadModule("tags.js");
  await loadModule("parse.js");
  const web = await loadModule("platform-web.js");
  core = await loadModule("core.js");
  render = await loadModule("render.js");

  try { await loadModule("spa.js"); } catch (e) { console.warn("spa.js 없음:", e.message); }
  platform = web.makePlatform(window.fzstd);
  core.configure(platform);
  return core;
}

const HEAD_BYTES = 300000;

const LOOKS_LIKE_EXPORT = /\d{4}-\d{2}/;

function classify(files) {
  const fmf = [], fm = [], loose = [], looseFm = [];
  for (const f of files) {

    const p = "/" + (f.webkitRelativePath || f.name).replace(/\\/g, "/").toLowerCase();
    if (p.endsWith(".fmf")) {
      if (p.indexOf("/exported teams/") >= 0) fmf.push(f);
      else if (LOOKS_LIKE_EXPORT.test(f.name)) loose.push(f);
    } else if (p.endsWith(".fm")) {
      if (p.indexOf("/games/") >= 0) fm.push(f);
      else looseFm.push(f);
    } else if (p.endsWith(".png") && p.indexOf("/default/") >= 0 && p.indexOf("troph") >= 0) {
      TROPHY_FILES.set(p.split("/").pop().replace(/.png$/, ""), f);
    }
  }

  if (!fmf.length) fmf.push.apply(fmf, loose);
  if (!fm.length) fm.push.apply(fm, looseFm);
  return { fmf, fm };
}

async function run(files, onProgress) {
  const { fmf, fm } = classify(files);
  if (!fmf.length) {

    const sample = files.slice(0, 3)
      .map((f) => f.webkitRelativePath || f.name).join(" / ") || "(파일 없음)";
    throw new Error(
      "내보낸 팀 파일(.fmf)을 찾지 못했습니다. 파일 " + files.length + "개를 훑었습니다.\n" +
      "예: " + sample + "\n" +
      "Football Manager 20xx 폴더나 그 안의 'exported teams' 폴더를 골라 주세요.");
  }

  const entries = [], skipped = [], managers = new Set();
  const total = fmf.length + fm.length;
  let done = 0;

  for (const f of fmf) {
    const meta = core.splitExportName(f.name);
    if (meta.manager) managers.add(meta.manager);
  }

  const AHEAD = 8;
  const readAhead = (list, slice) => {
    const q = new Map();
    const prime = (i) => {
      if (i < list.length && !q.has(i)) {
        const f = list[i];
        q.set(i, (slice ? f.slice(0, slice) : f).arrayBuffer());
      }
    };
    for (let i = 0; i < AHEAD; i++) prime(i);
    return { take: async (i) => { prime(i + AHEAD); const p = q.get(i); q.delete(i); return p; } };
  };

  const fmfQueue = readAhead(fmf, 0);
  for (let i = 0; i < fmf.length; i++) {
    const f = fmf[i];
    onProgress(done, total, f.name);
    const meta = core.splitExportName(f.name);
    try {
      const bytes = platform.from(new Uint8Array(await fmfQueue.take(i)));
      entries.push({
        file: f.name, club: meta.club, manager: meta.manager, season: meta.season,
        mtime: new Date(f.lastModified),
        data: core.readSeason(bytes, f.name, f.lastModified),
      });
    } catch (e) {
      skipped.push({ file: f.name, reason: e.message });
    }
    done++;
  }

  const fmQueue = readAhead(fm, HEAD_BYTES);
  const saves = [];
  for (let i = 0; i < fm.length; i++) {
    const f = fm[i];
    onProgress(done, total, f.name);
    const info = {
      file: f.name,
      name: f.name.replace(/\.fm$/i, "").replace(/ \(v\d+\)$/, ""),
      sizeMB: Math.round(f.size / 1048576),
      modified: new Date(f.lastModified).toISOString().slice(0, 10),
      modifiedMs: f.lastModified,
      manager: null, club: null, nation: null, version: null,
    };
    try {
      const head = platform.from(new Uint8Array(await fmQueue.take(i)));
      Object.assign(info, core.saveHeaderInfo(head, [...managers], platform));
    } catch (e) { info.error = e.message; }
    saves.push(info);
    SAVE_FILES.set(info.file, f);
    done++;
  }

  return core.assemble({ entries, saves, backup: null, options: {}, folder: null, skipped });
}

const SPA_CACHE = new Map();
let LAST_MS = 0;

function openArchive(id) {
  const pt = DATA.playthroughs.filter(function (x) { return x.id === id; })[0];
  const frame = document.getElementById("aframe");
  const nameEl = document.getElementById("aname");
  $("result").hidden = true;
  $("archive").hidden = false;

  history.pushState({ archive: id }, "", "#" + id);

  if (SPA_CACHE.has(id)) {
    frame.srcdoc = SPA_CACHE.get(id);
    nameEl.textContent = pt ? pt.name : id;
    return;
  }

  const P = makeProgress(frame, pt ? pt.name : id, LAST_MS);
  const say = (m) => { nameEl.textContent = (pt ? pt.name : id) + " — " + m; P(m); };
  say.bytes = P.bytes;
  say.indet = P.indet;
  say("시작합니다");
  const t0 = Date.now();

  buildCareer(pt, say).then(function (html) {
    LAST_MS = Date.now() - t0;
    SPA_CACHE.set(id, html);
    frame.srcdoc = html;
    nameEl.textContent = pt ? pt.name : id;
  }).catch(function (e) {
    console.error(e);

    try {
      frame.srcdoc = render.html(render.buildPayload(DATA, id));
      nameEl.textContent = (pt ? pt.name : id) + " — 예전 화면 (커리어를 못 만들었습니다: " + e.message + ")";
    } catch (e2) {
      frame.srcdoc = waitDoc(pt ? pt.name : id, "만들지 못했습니다: " + e.message);
      nameEl.textContent = pt ? pt.name : id;
    }
  });
}

function waitDoc(title, err, lastMs) {
  const css =
    "body{margin:0;display:flex;align-items:center;justify-content:center;height:100vh;" +
    'font:15px/1.7 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;' +
    "background:#16150f;color:#b6b0a2}" +
    ".box{text-align:center;max-width:34em;padding:24px;width:100%}" +
    "b{display:block;color:#f0ede4;font-size:17px;margin-bottom:14px}" +
    "p{margin:6px 0}small{color:#847e70}" +
    ".track{height:6px;border-radius:99px;background:#2a2820;overflow:hidden;margin:14px 0 8px}" +
    ".track i{display:block;height:100%;width:0;background:#c8a24a;border-radius:99px;" +
    "transition:width .18s linear}" +

    ".track.indet i{width:100%;background:repeating-linear-gradient(115deg," +
    "#c8a24a 0 10px,#6d5a2a 10px 20px);animation:flow .9s linear infinite}" +
    "@keyframes flow{to{background-position:20px 0}}" +
    ".row{display:flex;justify-content:space-between;font-size:11.5px;color:#847e70}" +
    "#step{color:#d8d2c4;font-size:13px;min-height:1.6em}";

  if (err)
    return '<!doctype html><meta charset="utf-8"><style>' + css + '</style><div class="box"><b>' +
      esc(title) + '</b><p style="color:#e0a06a">' + esc(err) + "</p></div>";

  const tick = 'var t0=Date.now();setInterval(function(){' +
    'var e=document.getElementById("el");' +
    'if(e)e.textContent=((Date.now()-t0)/1000).toFixed(0)+"초";},250);';

  const hint = lastMs
    ? "지난번에는 " + (lastMs / 1000).toFixed(0) + "초 걸렸습니다"
    : "20초쯤 걸립니다";

  return '<!doctype html><meta charset="utf-8"><style>' + css + '</style>' +
    '<div class="box"><b>' + esc(title) + "</b>" +
    '<div class="track" id="track"><i id="bar"></i></div>' +
    '<div class="row"><span id="pct"></span><span id="el">0초</span></div>' +
    '<p id="step">시작합니다</p>' +
    "<p><small>세이브에서 필요한 부분만 떠옵니다. " + hint + "<br>" +
    "한 번 만들면 다음부터는 바로 뜹니다.</small></p></div>" +
    "<scr" + "ipt>" + tick + "</scr" + "ipt>";
}

function makeProgress(frame, title, lastMs) {
  let doc = null, queue = [];
  const apply = (fn) => { if (doc) fn(doc); else queue.push(fn); };
  frame.addEventListener("load", function once() {
    frame.removeEventListener("load", once);
    try { doc = frame.contentDocument; } catch (e) { return; }
    queue.forEach((fn) => { try { fn(doc); } catch (e) {   } });
    queue = [];
  });
  frame.srcdoc = waitDoc(title, null, lastMs);

  const P = function (msg) {
    apply((d) => { const e = d.getElementById("step"); if (e) e.textContent = msg; });
  };

  P.bytes = function (done, total) {
    apply((d) => {
      const t = d.getElementById("track"), b = d.getElementById("bar"), n = d.getElementById("pct");
      if (!t || !b) return;
      t.classList.remove("indet");
      b.style.width = (total ? Math.min(100, 100 * done / total) : 0).toFixed(1) + "%";
      if (n) n.textContent = (done / 1048576).toFixed(0) + " / " + (total / 1048576).toFixed(0) + "MB";
    });
  };

  P.indet = function () {
    apply((d) => {
      const t = d.getElementById("track"), n = d.getElementById("pct"), b = d.getElementById("bar");
      if (t) t.classList.add("indet");

      if (b) b.style.width = "100%";
      if (n) n.textContent = "얼마나 남았는지는 못 잽니다";
    });
  };
  return P;
}

async function buildCareer(pt, say) {
  if (!window.NodeRun) throw new Error("깊이 읽기 부분이 안 실려 있다");
  const spa = REG["spa.js"];
  if (!spa || !spa.html) throw new Error("화면 만드는 부분(spa.js)이 안 실려 있다");
  const Bytes = REG["platform-web.js"].Bytes;
  NodeRun.clear();
  NodeRun.setBytes(Bytes);

  const journey = (pt && pt.journey) || [];
  let club = null, best = -1;
  for (const j of journey) {
    const n = (j.seasons || []).length;
    if (n > best) { best = n; club = j.club; }
  }
  if (!club) throw new Error("이 카드에 구단이 없다");

  NodeRun.put("/ar/data.json", JSON.stringify(DATA));
  if (window.__AWARDS_SRC) NodeRun.put("/ar/save/awards.js", window.__AWARDS_SRC);

  const file = pt && pt.saveFile ? SAVE_FILES.get(pt.saveFile) : null;
  const cfg = {
    __base: "/",
    club: { name: club, team: null },
    from: 2023,
    archive: "/ar",
    data: "/ar/data.json",
    squad: "/없음.json",
    dumps: {}, capture: {},
    rounds: { worldcup: 473, asiancup: 3221 },
  };

  const CAP = window.__CAPTURE;
  if (CAP) {
    if (CAP.cups) cfg.capture.cups = CAP.cups;
    if (CAP.leagues) cfg.capture.leagues = CAP.leagues;
    if (CAP.shapes) cfg.capture.shapes = CAP.shapes;
    if (CAP.nations) cfg.nations = CAP.nations;
    if (CAP.rounds) cfg.rounds = CAP.rounds;
    if (CAP.cupPix) { NodeRun.put("/cap/cups.json", JSON.stringify(CAP.cupPix)); cfg.capture.cupPix = "/cap/cups.json"; }
    if (CAP.bestxi) { NodeRun.put("/cap/bestxi.json", JSON.stringify(CAP.bestxi)); cfg.capture.bestxi = "/cap/bestxi.json"; }
  }

  if (file) {
    const at = await grabSections(file, say, journey);
    cfg.club.team = at.team;

    await nameBridge(at, club, journey, say);

    if (at.spells) cfg.spells = at.spells;
    cfg.clubmapYear = at.year;
    cfg.history = at.history;
    cfg.dumps = {
      cup: at["tc_cup_history_dt"], asiancup: at["tc_cup_history_dt"],
      stats: at["player_stats_hist_dt"], manager: at["person_record_manager"],
      award: at["award_year_hist_dt"],
      gameDb: at.gameDb ? [at.gameDb] : [],
      clubmapDir: at.gameDb ? "/save" : null,
      clubsJson: at.gameDb ? "/save/clubs.json" : null,
    };
  } else {
    say("세이브가 없어 내보내기만으로 만듭니다");
  }

  say("자료 만드는 중");
  NodeRun.put("/cfg.json", JSON.stringify(cfg));
  const r = NodeRun.run("payload.js", ["/cfg.json", "--out", "/payload.json"]);
  if (r.error) throw r.error;
  const v = r.files.get("/payload.json");
  const json = typeof v === "string" ? v : new TextDecoder().decode(v);
  NodeRun.clear();
  say("화면 만드는 중");

  const pix = await trophyPix();
  if (pix) {
    try {
      const o = JSON.parse(json);
      o.trophyPix = pix;
      return spa.html(o);
    } catch (e) {   }
  }
  return spa.html(json);
}

function shrink(file, h) {
  return new Promise(function (ok, no) {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = function () {
      const w = Math.max(1, Math.round(im.width * h / im.height));
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      c.getContext("2d").drawImage(im, 0, 0, w, h);
      URL.revokeObjectURL(url);
      try { ok(c.toDataURL("image/webp", 0.85)); } catch (e) { ok(c.toDataURL("image/png")); }
    };
    im.onerror = function () { URL.revokeObjectURL(url); no(new Error("그림을 못 읽었다")); };
    im.src = url;
  });
}

async function trophyPix() {
  if (!TROPHY_FILES.size) return null;
  const WANT = { "silver plate": "plate", "national cup 1": "cup", "national championship 1": "league" };
  const out = {};
  for (const k in WANT) {
    const f = TROPHY_FILES.get(k);
    if (!f) continue;
    try { out[WANT[k]] = await shrink(f, 96); } catch (e) {   }
  }
  return Object.keys(out).length ? out : null;
}

async function nameBridge(at, club, journey, say) {
  if (!at.gameDb || at.team == null) { say("이름 다리 건너뜀 — 이름표가 없습니다"); return null; }
  say("세이브 명단 뽑는 중");
  const r = NodeRun.run("squad.js", ["/save", "--팀", String(at.team), "/sq.json"]);
  if (r.error) { say("이름 다리 건너뜀 — 명단을 못 뽑았습니다: " + r.error.message); return null; }
  const v = r.files.get("/sq.json");
  let sq;
  try { sq = JSON.parse(typeof v === "string" ? v : new TextDecoder().decode(v)); }
  catch (e) { say("이름 다리 건너뜀 — 명단을 못 읽었습니다"); return null; }
  if (!sq || !sq.squad || !sq.squad.length) { say("이름 다리 건너뜀 — 명단이 비었습니다"); return null; }

  const d = String(sq.date || "");
  const y = +d.slice(0, 4), mo = +d.slice(5, 7);
  if (!y) { say("이름 다리 건너뜀 — 세이브 날짜를 못 읽었습니다: " + d); return null; }
  const a0 = mo >= 7 ? y : y - 1;
  const season = a0 + "-" + String(a0 + 1).slice(2);

  const mine2 = (journey || []).filter((j) => j.club === club);
  const all = [];
  for (const j of mine2) for (const t of (j.seasons || [])) all.push(t);
  const use = all.filter((t) => t <= season).sort().pop() || all.sort().pop();
  if (!use) {
    say("이름 다리 건너뜀 — 이 구단 내보내기가 없습니다");
    return null;
  }
  NodeRun.put("/ar/save-squads/bridge.json", JSON.stringify({
    archiveClub: club, season: use, savedAt: sq.date, uid: sq.uid, squad: sq.squad }));
  say("이름 다리 놓음 — 세이브 " + season + " ↔ 내보내기 " + use + " · " + sq.squad.length + "명");
  return use;
}

async function grabSections(file, say, journey) {
  const parse = REG["parse.js"];
  say("목록 읽는 중 — 파일 꼬리 4MB");
  const TAIL = 4 * 1024 * 1024;
  const tail = platform.from(new Uint8Array(await file.slice(Math.max(0, file.size - TAIL)).arrayBuffer()));
  const idx = parse.readIndexFromTail(tail, file.name);

  const at = {};

  const WANT = ["person_record_manager", "player_stats_hist_dt", "tc_league_history_dt",
                "tc_cup_history_dt", "award_year_hist_dt", "game_db"];
  let total = TAIL, done = TAIL;
  for (const n of WANT) {
    const e = idx.entries.find((x) => x.name === n);
    if (e) total += e.stored;
  }
  if (say.bytes) say.bytes(done, total);

  const grab = async (name) => {
    const e = idx.entries.find((x) => x.name === name);
    if (!e) return null;
    say("읽는 중 " + name + " — " + (e.stored / 1048576).toFixed(0) + "MB");
    const off = idx.dataStart + e.offset;

    const CH = 8 * 1024 * 1024;
    const raw8 = new Uint8Array(e.stored);
    for (let a = 0; a < e.stored; a += CH) {
      const b = Math.min(e.stored, a + CH);
      raw8.set(new Uint8Array(await file.slice(off + a, off + b).arrayBuffer()), a);
      done += b - a;
      if (say.bytes) say.bytes(done, total);
    }
    say("압축 푸는 중 " + name);
    if (say.indet) say.indet();
    const raw = platform.from(raw8);
    const out = platform.zstdDecompress(raw);
    if (say.bytes) say.bytes(done, total);
    const vp = "/save/" + name + "." + e.ext.replace(/^\./, "");
    NodeRun.put(vp, out);
    return vp;
  };
  for (const n of ["person_record_manager", "player_stats_hist_dt", "tc_league_history_dt",
                   "tc_cup_history_dt", "award_year_hist_dt"]) {
    const v = await grab(n);
    if (!v) throw new Error("세이브에 " + n + " 구획이 없다");
    at[n] = v;
  }
  at.gameDb = await grab("game_db");
  if (at.gameDb) {
    say("이름표 만드는 중");
    const c = NodeRun.run("clubs.js", [at.gameDb, "/save/clubs.json"]);
    if (c.error) { say("이름표 실패 — 이름 없이 갑니다"); at.gameDb = null; }
  }

  if (say.indet) say.indet();
  say("감독 기록 읽는 중");
  const mgr = NodeRun.run("manager.js", [at["person_record_manager"]]);
  if (mgr.error) throw mgr.error;
  const teams = (mgr.exports && mgr.exports.teams) || [];
  if (!teams.length) throw new Error("감독 기록에서 구단 번호를 못 찾았다");
  at.team = teams[0].team;
  const yr = (mgr.exports && mgr.exports.byYear) || [];
  at.year = yr.length ? yr[yr.length - 1].year : 2038;

  const spells = (mgr.exports && mgr.exports.spells) || [];
  const mine = [];
  for (const sp of spells) if (mine.indexOf(sp.team) < 0) mine.push(sp.team);

  if (mine.length <= 1) {
    say("시즌 순위 짜는 중");
    const s = NodeRun.run("season.js", ["/save", String(at.team), "/hist.json"]);
    at.history = s.error ? null : "/hist.json";
    return at;
  }

  const hist = new Map();
  for (let i = 0; i < mine.length; i++) {
    say("시즌 순위 짜는 중 — 구단 " + (i + 1) + "/" + mine.length);
    const vp = "/h-" + mine[i] + ".json";
    const r = NodeRun.run("season.js", ["/save", String(mine[i]), vp]);
    if (r.error) continue;
    const v = r.files.get(vp);
    try {
      hist.set(mine[i], JSON.parse(typeof v === "string" ? v : new TextDecoder().decode(v)));
    } catch (e) {   }
    NodeRun.drop(vp);
  }
  if (!hist.size) throw new Error("재임한 구단의 사다리를 하나도 못 짰다");

  const nameOf = new Map();
  for (const j of (journey || [])) for (const sn of (j.seasons || [])) nameOf.set(sn, j.club);

  const teamAt = (season) => {
    const mark = season.slice(0, 4) + "-08-01";
    for (const sp of spells) if (sp.from <= mark && (!sp.until || mark < sp.until)) return sp.team;
    return null;
  };

  const all = new Set();
  for (const j of hist.values()) for (const s of j.seasons) all.add(s.season);
  const rows = [];
  for (const sn of [...all].sort()) {
    const t = teamAt(sn);
    if (t == null) continue;
    const j = hist.get(t);
    const row = j && j.seasons.filter((x) => x.season === sn)[0];
    if (!row) continue;
    row.team = t;
    row.club = nameOf.get(sn) || null;
    rows.push(row);
  }
  const any = hist.values().next().value;
  NodeRun.put("/hist.json", JSON.stringify({ savedAt: any ? any.savedAt : null, seasons: rows }));
  at.history = "/hist.json";
  at.spells = spells;
  say("연표 " + rows.length + "시즌 — 구단 " + mine.length + "곳을 이었다");
  return at;
}

const WANT_DIR = /^(exported teams|games)$/i;
const MAYBE_PARENT = /^(sports interactive|football manager.*|documents|내 문서)$/i;
const WANT_FILE = /\.(fmf|fm)$/i;

function decideDir(name, depth) {
  if (WANT_DIR.test(name)) return "take";
  if (depth === 0) return "scan";
  if (MAYBE_PARENT.test(name)) return "scan";
  return "skip";
}

const setPath = (f, p) => {

  try { Object.defineProperty(f, "webkitRelativePath", { value: p }); }
  catch (e) {   }
  return f;
};

async function walkEntry(entry, out, prefix, depth, takeAll, onScan) {
  if (entry.isFile) {
    if (!WANT_FILE.test(entry.name)) return;
    const f = await new Promise((res, rej) => entry.file(res, rej));
    out.push(setPath(f, prefix + entry.name));
    onScan(out.length);
    return;
  }
  if (!entry.isDirectory) return;
  const mode = takeAll ? "take" : decideDir(entry.name, depth);
  if (mode === "skip") return;

  const reader = entry.createReader();
  let batch;
  do {
    batch = await new Promise((res, rej) => reader.readEntries(res, rej));
    for (const e of batch) {
      await walkEntry(e, out, prefix + entry.name + "/", depth + 1, mode === "take", onScan);
    }
  } while (batch.length);
}

async function walkHandle(dir, out, prefix, depth, takeAll, onScan) {
  const mode = takeAll ? "take" : decideDir(dir.name, depth);
  if (mode === "skip") return;
  for await (const [name, h] of dir.entries()) {
    if (h.kind === "file") {
      if (!WANT_FILE.test(name)) continue;
      out.push(setPath(await h.getFile(), prefix + name));
      onScan(out.length);
    } else {
      await walkHandle(h, out, prefix + name + "/", depth + 1, mode === "take", onScan);
    }
  }
}

window.addEventListener("DOMContentLoaded", async () => {
  try {
    await boot();
    $("boot").hidden = true;
    $("drop").hidden = false;
    $("pick").hidden = false;

    window.__fm = { run: run, handle: handle, core: function () { return core; },

  } catch (e) {
    $("boot").textContent = "불러오기 실패: " + e.message;
    console.error(e);
    return;
  }

  const scanning = (n) => {
    $("pick").hidden = true;
    $("progress").hidden = false;
    $("bar").style.width = "0%";
    $("ptext").textContent = "폴더를 훑는 중… 찾은 파일 " + n + "개";
  };

  async function collect(fn) {
    const out = [];
    scanning(0);
    try {
      await fn(out, scanning);
    } catch (e) {
      $("progress").hidden = true; $("pick").hidden = false;
      $("error").hidden = false; $("error").textContent = e.message;
      console.error(e); return;
    }
    handle(out);
  }

  const canPick = typeof window.showDirectoryPicker === "function";
  $("pickBtn").addEventListener("click", async () => {
    if (!canPick) { $("folder").click(); return; }
    let dir;
    try { dir = await window.showDirectoryPicker({ mode: "read" }); }
    catch (e) { return; }
    collect((out, onScan) => walkHandle(dir, out, "", 0, false, onScan));
  });
  $("folder").addEventListener("change", (e) => handle([].slice.call(e.target.files)));
  $("backBtn").addEventListener("click", closeArchive);

  window.addEventListener("popstate", function () { if (!$("archive").hidden) showList(); });
  window.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !$("archive").hidden) closeArchive();
  });
  if (!canPick) $("slowNote").hidden = false;

  const zone = $("drop");
  zone.addEventListener("dragover", (e) => { e.preventDefault(); zone.classList.add("over"); });
  zone.addEventListener("dragleave", () => zone.classList.remove("over"));
  zone.addEventListener("drop", (e) => {
    e.preventDefault();
    zone.classList.remove("over");
    const items = [].slice.call(e.dataTransfer.items)
      .map((i) => (i.webkitGetAsEntry ? i.webkitGetAsEntry() : null)).filter(Boolean);
    collect(async (out, onScan) => {
      for (const it of items) await walkEntry(it, out, "", 0, false, onScan);
    });
  });
});

const DEEP_NEED = ["person_record_manager", "player_stats_hist_dt", "tc_league_history_dt", "tc_cup_history_dt"];

async function deepRead(file, say) {
  const parse = REG["parse.js"], Bytes = REG["platform-web.js"].Bytes;
  if (!window.NodeRun) throw new Error("깊이 읽기 부분이 안 실려 있다 (한 장으로 묶은 판에서만 된다)");
  NodeRun.clear();
  NodeRun.setBytes(Bytes);

  say("목록 읽는 중 — 파일 꼬리 4MB");
  const TAIL = 4 * 1024 * 1024;
  const tail = platform.from(new Uint8Array(await file.slice(Math.max(0, file.size - TAIL)).arrayBuffer()));
  const idx = parse.readIndexFromTail(tail, file.name);

  let got = 0, mb = 0;
  for (const name of DEEP_NEED) {
    const e = idx.entries.find((x) => x.name === name);
    if (!e) continue;
    say("읽는 중 " + name + " — " + (e.stored / 1048576).toFixed(0) + "MB");
    const at = idx.dataStart + e.offset;
    const raw = platform.from(new Uint8Array(await file.slice(at, at + e.stored).arrayBuffer()));
    const out = platform.zstdDecompress(raw);
    NodeRun.put("/save/" + name + "." + e.ext.replace(/^\./, ""), out);
    got++; mb += out.length / 1048576;
  }
  if (got < DEEP_NEED.length) throw new Error("세이브에 필요한 구획이 없다 (" + got + "/" + DEEP_NEED.length + ")");

  const gdb = idx.entries.find((x) => x.name === "game_db");
  if (gdb) {
    const at = idx.dataStart + gdb.offset;
    const head = platform.from(new Uint8Array(await file.slice(at, at + Math.min(gdb.stored, 1 << 20)).arrayBuffer()));
    try { NodeRun.put("/save/game_db.dat", platform.zstdDecompress(head).slice(0, 64)); } catch (e) {}
  }

  say("감독 기록 읽는 중");
  const mgr = NodeRun.run("manager.js", ["/save/person_record_manager.dat"]);
  if (mgr.error) throw mgr.error;
  const teams = (mgr.exports && mgr.exports.teams) || [];
  if (!teams.length) throw new Error("감독 기록에서 구단 번호를 못 찾았다");

  const out = [];
  for (const t of teams.slice(0, 5)) {
    if (t.n < 3) continue;
    say("시즌 짜는 중 — 구단 " + t.team);
    const r = NodeRun.run("season.js", ["/save", String(t.team), "/out.json"]);
    if (r.error) { out.push({ team: t.team, error: r.error.message }); continue; }
    const v = r.files.get("/out.json");
    out.push(Object.assign({ team: t.team, records: t.n },
      JSON.parse(typeof v === "string" ? v : new TextDecoder().decode(v))));
  }
  NodeRun.clear();
  return { teams: teams, clubs: out, mb: Math.round(mb), byYear: (mgr.exports && mgr.exports.byYear) || [] };
}

function deepRender(res) {
  const DIV = { 7: "1부", 8: "2부", 9: "3부", 10: "4부", 150: "내셔널" };
  const parts = res.clubs.map((c) => {
    if (c.error) return '<p class="note">구단 ' + c.team + " — " + esc(c.error) + "</p>";
    const rows = (c.seasons || []).slice().reverse().map((s) => {
      const st = s.standing;
      const cups = (s.cups || []).filter((x) => x.teams === 2 && x.result === "우승").length;
      return "<tr><td>" + esc(s.season) + "</td><td>" + (DIV[s.division] || "디비전 " + s.division) + "</td>" +
        (st ? "<td><b>" + st.pos + "위</b> / " + st.teams + "</td><td>" + st.w + "-" + st.d + "-" + st.l +
              "</td><td>" + st.gf + ":" + st.ga + "</td><td>" + st.pts + "점</td>"
            : '<td colspan="4" class="dim">' + esc(s.why || "순위 없음") + "</td>") +
        "<td>" + (cups ? "🏆 " + cups : "") + "</td></tr>";
    }).join("");
    return "<h4>구단 번호 " + c.team + " <small>시즌 " + (c.seasons || []).length +
      " · 세이브 시점 " + (c.savedAt || "모름") + "</small></h4>" +
      '<div class="tblwrap"><table class="deept"><thead><tr><th>시즌</th><th>리그</th><th>순위</th><th>승-무-패</th><th>득:실</th><th>승점</th><th>컵</th></tr></thead><tbody>' +
      rows + "</tbody></table></div>";
  }).join("");
  return '<div class="deepbox"><h3>세이브에서 읽은 것 <small>' + res.mb + "MB 만 떠왔습니다</small></h3>" +
    parts + '<p class="note">구단 이름과 선수 이름은 아직 안 붙었습니다 — 그건 game_db(232MB) 가 필요합니다.</p></div>';
}

const SPA_NEED = ["person_record_manager", "player_stats_hist_dt", "tc_league_history_dt",
  "tc_cup_history_dt", "award_year_hist_dt"];

async function spaBuild(file, wantNames, say) {
  const parse = REG["parse.js"], Bytes = REG["platform-web.js"].Bytes;
  if (!window.NodeRun) throw new Error("깊이 읽기 부분이 안 실려 있다 (한 장으로 묶은 판에서만 된다)");
  NodeRun.clear();
  NodeRun.setBytes(Bytes);

  say("목록 읽는 중 — 파일 꼬리 4MB");
  const TAIL = 4 * 1024 * 1024;
  const tail = platform.from(new Uint8Array(await file.slice(Math.max(0, file.size - TAIL)).arrayBuffer()));
  const idx = parse.readIndexFromTail(tail, file.name);

  const grab = async (name) => {
    const e = idx.entries.find((x) => x.name === name);
    if (!e) return null;
    say("읽는 중 " + name + " — " + (e.stored / 1048576).toFixed(0) + "MB");
    const at = idx.dataStart + e.offset;
    const raw = platform.from(new Uint8Array(await file.slice(at, at + e.stored).arrayBuffer()));
    const out = platform.zstdDecompress(raw);
    const vp = "/save/" + name + "." + e.ext.replace(/^\./, "");
    NodeRun.put(vp, out);
    return { path: vp, mb: out.length / 1048576 };
  };

  const at = {};
  let mb = 0;
  for (const name of SPA_NEED) {
    const g = await grab(name);
    if (!g) throw new Error("세이브에 " + name + " 구획이 없다");
    at[name] = g.path; mb += g.mb;
  }

  let gdb = null;
  if (wantNames) {
    const g = await grab("game_db");
    if (g) { gdb = g.path; mb += g.mb;
      say("이름표 만드는 중");
      const r = NodeRun.run("clubs.js", [gdb, "/save/clubs.json"]);
      if (r.error) say("이름표 실패: " + r.error.message);
    }
  } else {
    const e = idx.entries.find((x) => x.name === "game_db");
    if (e) {
      const at0 = idx.dataStart + e.offset;
      const head = platform.from(new Uint8Array(await file.slice(at0, at0 + Math.min(e.stored, 1 << 20)).arrayBuffer()));
      try { NodeRun.put("/save/game_db.dat", platform.zstdDecompress(head).slice(0, 64)); } catch (e2) {}
    }
  }

  say("감독 기록 읽는 중");
  const mgr = NodeRun.run("manager.js", [at["person_record_manager"]]);
  if (mgr.error) throw mgr.error;
  const teams = (mgr.exports && mgr.exports.teams) || [];
  if (!teams.length) throw new Error("감독 기록에서 구단 번호를 못 찾았다");

  const me = teams[0].team;

  say("시즌 순위 짜는 중");
  let histPath = null;
  {
    const r2 = NodeRun.run("season.js", ["/save", String(me), "/hist.json"]);
    if (r2.error) say("연표 실패: " + r2.error.message);
    else histPath = "/hist.json";
  }

  const yr = (mgr.exports && mgr.exports.byYear) || [];
  const now = yr.length ? yr[yr.length - 1].year : 2038;

  const cfg = {
    __base: "/",
    club: { name: "", team: me },
    from: 2023,
    archive: "/ar",
    data: "/없음.json", squad: "/없음.json",
    history: histPath,
    dumps: {
      cup: at["tc_cup_history_dt"],
      asiancup: at["tc_cup_history_dt"],
      stats: at["player_stats_hist_dt"],
      manager: at["person_record_manager"],
      award: at["award_year_hist_dt"],
      gameDb: gdb ? [gdb] : [],
      clubmapDir: gdb ? "/save" : null,
      clubsJson: gdb ? "/save/clubs.json" : null,
    },
    clubmapYear: now,
    rounds: { worldcup: 473, asiancup: 3221 },
    capture: {},
  };

  if (window.__AWARDS_SRC) NodeRun.put("/ar/save/awards.js", window.__AWARDS_SRC);
  NodeRun.put("/cfg.json", JSON.stringify(cfg));

  say("자료 만드는 중 — 열 갈래");
  const r = NodeRun.run("payload.js", ["/cfg.json", "--out", "/payload.json"]);
  if (r.error) throw r.error;
  const v = r.files.get("/payload.json");
  const payload = JSON.parse(typeof v === "string" ? v : new TextDecoder().decode(v));
  const log = r.log.slice();
  NodeRun.clear();
  return { payload: payload, log: log, mb: Math.round(mb), team: me };
}

  box.querySelectorAll(".spabtn").forEach(function (b) {
    b.addEventListener("click", async function () {
      const f = SAVE_FILES.get(names[Number(b.getAttribute("data-i"))]);
      const wantNames = b.getAttribute("data-names") === "1";
      const log = $("deeplog"), outEl = $("deepout");
      outEl.innerHTML = "";
      const all = box.querySelectorAll(".deepbtn, .spabtn");
      all.forEach((x) => { x.disabled = true; });
      const t0 = Date.now();

        const r = await spaBuild(f, wantNames, (m) => { log.textContent = m; });
        const spa = REG["spa.js"];
        if (!spa || !spa.html) throw new Error("화면 만드는 부분(spa.js)이 안 실려 있다");
        document.getElementById("aframe").srcdoc = spa.html(JSON.stringify(r.payload));
        document.getElementById("aname").textContent =
          f.name + " · 구단 번호 " + r.team + " · " + r.mb + "MB 읽음" + (wantNames ? "" : " · 이름 없음");

        history.pushState({ archive: "spa" }, "", "#커리어");

        const skip = r.log.filter((x) => x.indexOf("건너뜀") >= 0);
        const warn = r.log.filter((x) => x.indexOf("⚠") >= 0 && x.indexOf("건너뜀") < 0);
        if (skip.length || warn.length)
          outEl.innerHTML = '<p class="note">' +
            (warn.length ? warn.map(esc).join("<br>") + "<br>" : "") +

        console.error(e);
      }
      all.forEach((x) => { x.disabled = false; });
    });
  });
}
