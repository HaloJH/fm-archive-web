
<title>FM 커리어 아카이브</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ctext y=%2726%27 font-size=%2726%27%3E%E2%9A%BD%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f5f2; --panel:#fffefb; --line:#e2ded4; --ink:#232019; --ink-2:#5c564a;
  --ink-3:#8b8474; --accent:#1f6f4a; --accent-soft:#e6f0e9;
  --ok:#1f6f4a; --guess:#8a6a1f; --none:#8b8474;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16150f; --panel:#1e1d16; --line:#33312a; --ink:#f0ede4; --ink-2:#b6b0a2;
    --ink-3:#847e70; --accent:#67c295; --accent-soft:#1d3129;
    --ok:#67c295; --guess:#d6ac57; --none:#847e70;
  }
}
:root[data-theme="dark"]{
  --bg:#16150f; --panel:#1e1d16; --line:#33312a; --ink:#f0ede4; --ink-2:#b6b0a2;
  --ink-3:#847e70; --accent:#67c295; --accent-soft:#1d3129;
  --ok:#67c295; --guess:#d6ac57; --none:#847e70;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); margin:0;
  font:15px/1.6 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:940px; margin:0 auto; padding:48px 24px 80px}
header.top{margin-bottom:32px}
h1{font-size:28px; letter-spacing:-.02em; margin:0 0 6px}
.sub{color:var(--ink-2); margin:0}
.privacy{
  display:inline-block; margin-top:14px; padding:5px 11px; border-radius:999px;
  background:var(--accent-soft); color:var(--accent); font-size:13px; font-weight:600;
}

#boot{color:var(--ink-3); padding:40px 0}

#drop{
  border:2px dashed var(--line); border-radius:14px; background:var(--panel);
  padding:56px 28px; text-align:center; transition:border-color .15s, background .15s;
}
#drop.over{border-color:var(--accent); background:var(--accent-soft)}
#drop p{color:var(--ink-2); margin:0 0 20px}
.btn{
  display:inline-block; background:var(--accent); color:#fff; border:0; cursor:pointer;
  padding:11px 20px; border-radius:9px; font-size:15px; font-weight:600; font-family:inherit;
}
.btn:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.hint{color:var(--ink-3); font-size:13px; margin-top:18px}
#error{
  margin-top:18px; padding:12px 14px; border-radius:9px;
  background:#fdecec; color:#a3272b; font-size:14px;
  white-space:pre-line; text-align:left;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) #error{background:#3a1d1e; color:#f0a8a8} }

#progress{padding:40px 0}
.track{height:8px; background:var(--line); border-radius:99px; overflow:hidden}
#bar{height:100%; width:0; background:var(--accent); transition:width .1s linear}
#ptext{color:var(--ink-3); font-size:13px; margin-top:10px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

#stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:14px}
.stat{background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:14px 16px}
.stat b{display:block; font-size:22px; font-variant-numeric:tabular-nums; letter-spacing:-.01em}
.stat span{color:var(--ink-3); font-size:13px}
#elapsed{color:var(--ink-3); font-size:13px; margin:0 0 28px}
#warn{
  margin:0 0 22px; padding:12px 14px; border-radius:9px; font-size:14px;
  background:#fff5e0; color:#7a5a10; white-space:pre-line;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) #warn{background:#33280f; color:#e0bd6e} }

#list{display:flex; flex-direction:column; gap:12px}
.pt{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px 18px}
.pt header{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:10px}
.pt h3{font-size:17px; margin:0; letter-spacing:-.01em}
.span{color:var(--ink-3); font-size:13px; margin-left:auto; font-variant-numeric:tabular-nums}
.span em{display:block; font-style:normal; text-align:right; opacity:.8; margin-top:2px}
.badge{font-size:12px; font-weight:600; padding:2px 8px; border-radius:999px; border:1px solid}
.b-ok{color:var(--ok); border-color:var(--ok)}
.b-guess{color:var(--guess); border-color:var(--guess)}
.b-none{color:var(--none); border-color:var(--none)}
.journey{display:flex; flex-wrap:wrap; align-items:center; gap:5px 7px; font-size:14px}
.leg{color:var(--ink)}
.leg i{color:var(--ink-3); font-style:normal; font-size:12px; font-variant-numeric:tabular-nums}
.arrow{color:var(--ink-3)}
.missing,.note{color:var(--ink-3); font-size:13px; margin-top:9px}

.pt{cursor:pointer; transition:border-color .12s, transform .12s}
.pt:hover{border-color:var(--accent)}
.pt:active{transform:translateY(1px)}
.pt:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.pt .go{margin-left:8px; color:var(--ink-3); font-size:13px}
.pt:hover .go{color:var(--accent)}

#archive{position:fixed; inset:0; display:flex; flex-direction:column; background:var(--bg)}
#archive[hidden]{display:none}   /* display:flex 가 [hidden] 을 이기므로 명시한다 */
.abar{display:flex; align-items:center; gap:12px; padding:10px 16px;
  border-bottom:1px solid var(--line); background:var(--panel); flex:none}
.abar #aname{color:var(--ink-2); font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.back{background:none; border:1px solid var(--line); color:var(--ink); cursor:pointer;
  padding:6px 12px; border-radius:8px; font-size:14px; font-family:inherit}
.back:hover{border-color:var(--accent); color:var(--accent)}
#aframe{flex:1; width:100%; border:0; background:var(--bg)}
/* ★ 111: 세이브 깊이 읽기 — 자리·생김새는 아직 결정거리다. 여기서는 읽히기만 하면 된다. */
.deepbox{margin:22px 0 0;padding:16px 18px;background:var(--panel);border:1px solid var(--line);border-radius:6px}
.deepbox h3{margin:0 0 6px;font-size:15px}
.deepbox h3 small,.deepbox h4 small{font-weight:400;color:var(--ink-3);font-size:12px;margin-left:6px}
.deepbox h4{margin:16px 0 6px;font-size:14px}
.deepbtn{margin:6px 6px 0 0;padding:7px 12px;border:1px solid var(--line);border-radius:4px;background:var(--bg);cursor:pointer;font:inherit;font-size:13px}
.deepbtn:hover:not(:disabled){border-color:var(--ink)}
.deepbtn:disabled{opacity:.5;cursor:default}
#deeplog{margin:8px 0 0;min-height:1.2em}
.tblwrap{overflow-x:auto}
table.deept{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
table.deept th{text-align:left;font-weight:500;color:var(--ink-3);padding:4px 8px;border-bottom:1px solid var(--line);font-size:12px}
table.deept td{padding:4px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.deept td.dim{color:var(--ink-3);white-space:normal}
</style>


<div class="wrap">

  <header class="top">
    <h1>FM 커리어 아카이브</h1>
    <p class="sub">내보낸 팀 파일로 지난 시즌까지 되살립니다.</p>
    <span class="privacy">파일은 이 브라우저 안에서만 처리됩니다</span>
  </header>

  <div id="boot">준비 중…</div>

  <section id="drop" hidden>
    <div id="pick" hidden>
      <p>Football Manager 폴더를 여기에 끌어다 놓으세요</p>
      <button class="btn" id="pickBtn" type="button">폴더 고르기</button>
      <input type="file" id="folder" webkitdirectory directory multiple hidden>
      <div class="hint" id="slowNote" hidden>
        이 브라우저는 폴더를 직접 훑을 수 없어, 폴더를 고르면 시간이 오래 걸릴 수 있습니다.<br>
        <b>끌어다 놓기</b>를 쓰시거나, <code>exported teams</code> 폴더만 고르세요.
      </div>
      <div class="hint">
        <code>exported teams</code> 의 <code>.fmf</code> 파일과
        <code>games</code> 의 <code>.fm</code> 세이브를 읽습니다.<br>
        세이브는 앞 300KB 만 읽습니다 — 400MB 파일이라도 통째로 열지 않습니다.
      </div>
      <div id="error" hidden></div>
    </div>

    <div id="progress" hidden>
      <div class="track"><div id="bar"></div></div>
      <div id="ptext"></div>
    </div>
  </section>

  <section id="result" hidden>
    <div id="stats"></div>
    <p id="elapsed"></p>
    <div id="warn" hidden></div>
    <div id="list"></div>
    <!-- ★ 111: 세이브 깊이 읽기. 내보내기가 없어도 여기까지는 나온다.
         ⚠ 자리와 생김새는 아직 정하지 않았다 — 결정거리(BACKLOG) -->
    <div id="deep"></div>
  </section>

</div>

<!-- 아카이브는 iframe 에 띄운다.
     render.js 가 만드는 문서는 자기 <style> 과 <script> 를 품고 있어서,
     innerHTML 로 밀어 넣으면 스크립트가 안 돌고 CSS 가 목록 화면과 부딪힌다. -->
<div id="archive" hidden>
  <div class="abar">
    <button class="back" id="backBtn" type="button">← 세이브 목록</button>
    <span id="aname"></span>
    <button class="back" id="oldBtn" type="button" hidden title="같은 자료를 옛 화면(spa.js)으로 본다">옛 화면</button>
  </div>
  <iframe id="aframe" title="커리어 아카이브"></iframe>
</div>

`;

const APP = String.raw`
var D = window.__ARCHIVE__;
var $ = function(s, r){ return (r||document).querySelector(s); };
var $$ = function(s, r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };
var esc = function(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); };
var sc = function(v){ return Math.round(v/5); };            // 1~100 → 화면 1~20
var byTag = {};
D.dict.attrs.forEach(function(a){ byTag[a.tag] = a; });

/* ── 테마 토글 ── */
$(".themeBtn").addEventListener("click", function(){
  var cur = document.documentElement.getAttribute("data-theme");
  var dark = cur ? cur === "dark"
    : window.matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
});

/* ── 성장 곡선 ──
 * 기본은 1군만. 유스(U21·U18)가 섞이면 평균이 크게 내려가 실제 전력과 달라진다.
 * (실제로 잰 한 시즌: 1군만 182 / 전체 129)
 */
var growthScope = "first";     // "first" | "total"

// 띠 폭에 안 들어가는 구단 이름을 줄인다. "맨체스터 유나이티드" → "맨체스터…"
function shorten(s, n){ s = String(s||""); return s.length <= n ? s : s.slice(0, Math.max(1,n-1)) + "…"; }

function growth(){
  var S = D.seasons, W = 860, L = 44, R = 16, B = 36;
  // 구단이 둘 이상이면 위에 구단 띠를 얹는다. 그만큼 그림 높이를 늘린다.
  var BAND = S.some(function(s){ return s.club !== S[0].club; });
  var T = BAND ? 44 : 16, H = BAND ? 296 : 268;
  var stat = function(s){ return s.summary[growthScope] || s.summary; };
  var pts = S.map(function(s,i){ return { i:i, s:s, v:stat(s) }; })
             .filter(function(p){ return p.v && p.v.avgCA != null; });
  if (!pts.length){ $("#growth").innerHTML = '<p class="muted">표시할 값이 없습니다.</p>'; return; }

  var xs = function(i){ return L + (S.length < 2 ? 0 : i*(W-L-R)/(S.length-1)); };
  var vals = [];
  pts.forEach(function(p){ vals.push(p.v.avgCA, p.v.maxCA); });
  var lo = Math.floor(Math.min.apply(null, vals)/20)*20;
  var hi = Math.ceil(Math.max.apply(null, vals)/20)*20;
  if (hi === lo) hi = lo + 20;
  var ys = function(v){ return T + (H-T-B) * (1 - (v-lo)/(hi-lo)); };

  var g = "";
  for (var t = lo; t <= hi; t += 20){
    g += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+ys(t)+'" y2="'+ys(t)+'"/>';
    g += '<text x="'+(L-8)+'" y="'+(ys(t)+3.5)+'" text-anchor="end" class="axl">'+t+'</text>';
  }
  var mk = function(key, color){
    var d = pts.map(function(p,k){ return (k?"L":"M")+xs(p.i).toFixed(1)+" "+ys(p.v[key]).toFixed(1); }).join(" ");
    var dots = pts.map(function(p){
      return '<circle cx="'+xs(p.i).toFixed(1)+'" cy="'+ys(p.v[key]).toFixed(1)+'" r="4" fill="'+color+'" stroke="var(--surface)" stroke-width="2"/>';
    }).join("");
    return '<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linejoin="round"/>'+dots;
  };
  var xlab = S.map(function(s,i){
    return '<text x="'+xs(i).toFixed(1)+'" y="'+(H-B+18)+'" text-anchor="middle" class="axl">'+s.season.slice(2)+'</text>';
  }).join("");

  // 구단이 바뀐 지점을 곡선 위 "띠"로 그린다.
  //   글자를 곡선 위에 얹으면 구단이 11개인 세이브에서 서로 겹쳐 읽을 수가 없다.
  //   띠는 각 구간이 제 폭을 가지므로 겹칠 수가 없고, 좁으면 이름만 생략하면 된다.
  var moves = "", band = "";
  if (BAND) {
    var half = (W-L-R)/Math.max(1,S.length-1)/2;
    var segs = [], cur = null;
    S.forEach(function(s,i){
      if (cur && cur.club === s.club) { cur.last = i; return; }
      cur = { club: s.club, first: i, last: i }; segs.push(cur);
    });
    segs.forEach(function(g,k){
      var x0 = Math.max(L, xs(g.first) - half), x1 = Math.min(W-R, xs(g.last) + half);
      var w = x1 - x0;
      band += '<rect x="'+x0.toFixed(1)+'" y="0" width="'+w.toFixed(1)+'" height="20" rx="4" '+
        'fill="'+(k%2 ? "var(--sunken)" : "var(--surface-2)")+'"/>';
      // 이름이 안 들어가는 좁은 구간은 비워 둔다. 잘린 글자보다 빈 칸이 낫다(툴팁에 나온다).
      if (w > 46) {
        band += '<text x="'+((x0+x1)/2).toFixed(1)+'" y="14" text-anchor="middle" class="axl" '+
          'style="fill:var(--ink-2);font-weight:600">'+esc(shorten(g.club, Math.floor(w/11)))+'</text>';
      }
      if (k) moves += '<line x1="'+x0.toFixed(1)+'" x2="'+x0.toFixed(1)+'" y1="'+T+'" y2="'+(H-B)+'" '+
        'stroke="var(--line-strong)" stroke-width="1" stroke-dasharray="3 3"/>';
    });
  }
  var lastP = pts[pts.length-1];
  var ann = ""; var _unusedAnn = '<text x="'+(xs(lastP.i)-6)+'" y="'+(ys(lastP.v.avgCA)-12)+'" text-anchor="end" '+
    'style="font-size:12px;font-weight:650;fill:var(--s1)">평균 '+lastP.v.avgCA+'</text>';

  // 툴팁을 위한 투명 히트존 + 세로 기준선
  var hit = S.map(function(s,i){
    var w = (W-L-R)/Math.max(1,S.length-1);
    return '<rect class="hz" data-i="'+i+'" x="'+(xs(i)-w/2).toFixed(1)+'" y="'+T+'" width="'+w.toFixed(1)+
      '" height="'+(H-T-B)+'" fill="transparent"/>';
  }).join("");

  $("#growth").innerHTML =
    '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="시즌별 평균·최고 능력 추이">'+
    '<style>.axl{font-family:"IBM Plex Mono",monospace;font-size:10px;fill:var(--ink-3)}</style>'+
    '<g class="grid" stroke="var(--line)">'+g+'</g>'+
    '<line id="ghair" x1="0" x2="0" y1="'+T+'" y2="'+(H-B)+'" stroke="var(--line-strong)" stroke-width="1" opacity="0"/>'+
    band + moves + mk("maxCA","var(--s2)") + mk("avgCA","var(--s1)") + xlab + ann + hit +
    '</svg>';

  $("#growthDelta").textContent = pts[0].v.avgCA + " → " + lastP.v.avgCA;

  // 호버 툴팁 — tip 은 차트 바깥에 있어 다시 그려도 살아남는다
  var tip = $("#gtip"), hair = $("#ghair"), host = $("#growth");
  $$("#growth .hz").forEach(function(r){
    r.onmouseenter = function(){
      var i = +r.getAttribute("data-i"), s = S[i], v = stat(s);
      if (!v || v.avgCA == null) return;
      hair.setAttribute("x1", xs(i)); hair.setAttribute("x2", xs(i)); hair.setAttribute("opacity","1");
      tip.innerHTML = '<b>'+s.season+'</b>'+
        '<span>평균 <em>'+v.avgCA+'</em></span>'+
        '<span>최고 <em>'+v.maxCA+'</em></span>'+
        '<span>인원 <em>'+v.squad+'</em>명</span>'+
        '<span class="tipsub">'+esc(s.club)+(s.stadium ? " · "+esc(s.stadium) : "")+'</span>';
      tip.hidden = false;
      var box = host.getBoundingClientRect();
      tip.style.left = Math.min(box.width-180, Math.max(0, xs(i)/W*box.width - 80)) + "px";
    };
  });
  // onmouseleave 로 대입하면 다시 그려도 리스너가 겹치지 않는다
  host.onmouseleave = function(){ tip.hidden = true; hair.setAttribute("opacity","0"); };
}

function growthTabs(){
  $$("#growthScope .tab").forEach(function(b){
    b.setAttribute("aria-pressed", b.getAttribute("data-k") === growthScope);
    b.onclick = function(){ growthScope = b.getAttribute("data-k"); growthTabs(); growth(); };
  });
}

/* ── 재직 간트 ── */
function gantt(){
  var S = D.seasons, N = S.length;
  var rows = D.tenure.filter(function(t){ return t.last - t.first >= 1; }).slice(0, 26);
  var col = { GK:"var(--s1)", DF:"var(--s3)", MF:"var(--s4)", FW:"var(--s2)", "—":"var(--ink-3)" };
  var html = rows.map(function(t){
    var left = t.first/N*100, width = (t.last-t.first+1)/N*100;
    return '<div class="gname" data-key="'+esc(t.key)+'" role="button" tabindex="0">'+esc(t.name)+'</div>'+
      '<div class="track"><div class="span" style="left:'+left.toFixed(2)+'%;width:'+width.toFixed(2)+'%;background:'+col[t.group]+'" title="'+esc(t.name)+' · '+S[t.first].season+'~'+S[t.last].season+'"></div></div>'+
      '<div class="gyr">'+(t.last-t.first+1)+'시즌</div>';
  }).join("");
  $("#gantt").innerHTML = html;
  $("#gticks").innerHTML = S.map(function(s){ return "<span>"+s.season.slice(2,5)+"</span>"; }).join("");
  $$("#gantt .gname").forEach(function(el){
    var open = function(){ openByKey(el.getAttribute("data-key")); };
    el.addEventListener("click", open);
    el.addEventListener("keydown", function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); open(); } });
  });
}

/* ── 이적 흐름 ── */
function flow(){
  // 구단 이동 줄은 최댓값 계산에서 뺀다. 스쿼드 전체가 바뀐 값이라
  // 그걸 기준으로 삼으면 진짜 이적이 있었던 해의 막대가 전부 눌려 보인다.
  var normal = D.flow.filter(function(f){ return !f.clubChange; });
  var max = Math.max.apply(null, (normal.length ? normal : D.flow)
    .map(function(f){ return Math.max(f.in, f.out); })) || 1;
  $("#flow").innerHTML = D.flow.map(function(f){
    var w = function(n){ return Math.min(100, n/max*100).toFixed(1)+"%"; };
    return '<div class="flowrow'+(f.clubChange ? " moved" : "")+'">'+
      '<div class="num" style="font-size:12px;color:var(--ink-2)">'+f.season+
      (f.clubChange ? '<div class="muted" style="font-size:10.5px">'+esc(f.club)+' 부임</div>'
        : f.gap ? '<div class="muted" style="font-size:10.5px">공백 후</div>' : '')+'</div>'+
      '<div class="flowbars">'+
        '<div class="fb"><span class="num" style="width:26px;color:var(--s1)">+'+f.in+'</span>'+
          '<span class="fbar" style="width:'+w(f.in)+';background:var(--s1)"></span>'+
          '<span class="flist">'+esc(f.inTop.join(" · "))+'</span></div>'+
        '<div class="fb"><span class="num" style="width:26px;color:var(--s2)">-'+f.out+'</span>'+
          '<span class="fbar" style="width:'+w(f.out)+';background:var(--s2)"></span>'+
          '<span class="flist">'+esc(f.outTop.join(" · "))+'</span></div>'+
        (f.clubChange ? '<div class="movenote">'+esc(f.fromClub)+' → '+esc(f.club)+
          ' · 구단을 옮긴 해라 스쿼드가 통째로 바뀝니다. 이적이 아닙니다.</div>' : '')+
        (f.nameWeak ? '<div class="movenote">세이브에서 뽑은 시즌이 끼어 있습니다. 그 시즌은 이름이 성(姓)뿐이라 영입·방출을 셀 수 없습니다.</div>' : '')+
      '</div></div>';
  }).join("");
}

/* ── 시즌 탐색 ── */
var seasonIdx = D.seasons.length - 1;
var rankKey = "PCAB";

function seasonTabs(){
  $("#seasonTabs").innerHTML = D.seasons.map(function(s,i){
    return '<button class="tab" data-i="'+i+'" aria-pressed="'+(i===seasonIdx)+'">'+s.season+'</button>';
  }).join("");
  $$("#seasonTabs .tab").forEach(function(b){
    b.addEventListener("click", function(){ seasonIdx = +b.getAttribute("data-i"); seasonTabs(); depth(); contracts(); podium(); });
  });
}

/* ── 포지션 뎁스 히트맵 ── */
function depth(){
  var S = D.seasons, P = D.dict.positions;
  var counts = S.map(function(s){
    return P.map(function(p){ return s.players.filter(function(pl){ return (pl.positions[p.tag]||0) >= 15; }).length; });
  });
  /* ⚠ 색 진하기의 기준(max)은 **내보내기 시즌에서만** 잡는다.
   *   세이브 시즌은 스쿼드가 유스까지 다 들어 있어 인원이 두 배 넘는다(74명 vs 166명).
   *   그 값이 max 가 되면 내보내기 열 전체가 옅어져 **없던 변화가 보인다.**
   *   세이브 열은 기준을 넘으면 가장 진한 칸으로 눌러 담는다. */
  var exIdx = S.map(function(s,i){ return s.fromSave ? -1 : i; }).filter(function(i){ return i >= 0; });
  var base = exIdx.length ? exIdx : S.map(function(_,i){ return i; });
  var max = Math.max.apply(null, base.map(function(i){ return Math.max.apply(null, counts[i]); })) || 1;
  var hasSave = S.some(function(s){ return s.fromSave; });
  var ramp = ["#cde2fb","#9ec5f4","#6da7ec","#3987e5","#256abf","#184f95"];
  var head = "<tr><th>포지션</th>" + S.map(function(s,i){
    /* 세이브에서 뽑은 열에는 ˢ 를 붙인다. 숨기지 않고 밝힌다(위 주석 참고). */
    return '<th style="text-align:right'+(i===seasonIdx?';color:var(--accent)':'')+'"'+
      (s.fromSave?' title="세이브에서 뽑은 시즌 — 유스까지 다 들어 있어 인원이 다르다"':'')+'>'+
      s.season.slice(2)+(s.fromSave?'<span style="color:var(--ink-3)">ˢ</span>':'')+"</th>"; }).join("") + "</tr>";
  var body = P.map(function(p, pi){
    return "<tr><td>"+esc(p.label)+"</td>" + S.map(function(s, si){
      var n = counts[si][pi];
      var step = n === 0 ? -1 : Math.min(ramp.length-1, Math.floor(n/max*ramp.length));
      var bg = step < 0 ? "transparent" : ramp[step];
      var fg = step >= 3 ? "#fff" : "var(--ink)";
      return '<td class="n"><span class="cell" style="background:'+bg+';color:'+(step<0?"var(--ink-3)":fg)+'">'+(n||"·")+"</span></td>";
    }).join("") + "</tr>";
  }).join("");
  /* 세이브 열은 인원 자체가 달라서 옆 열과 견줄 수 없다. 표 밑에 그렇다고 적는다. */
  var note = hasSave ? '<div class="movenote">ˢ 는 세이브에서 뽑은 시즌입니다. '+
    '내보내기는 등록 선수만 담기지만 세이브는 유스까지 전부 담겨 인원이 두 배 넘습니다. '+
    '그 열의 숫자는 옆 시즌과 나란히 견줄 수 없습니다.</div>' : '';
  $("#depth").innerHTML = "<table>"+head+body+"</table>"+note;
}

/* ── 계약 만료 ── */
function contracts(){
  var s = D.seasons[seasonIdx];
  var byYear = {};
  s.players.forEach(function(p){ if(!p.until) return; var y = p.until.slice(0,4); byYear[y] = (byYear[y]||0)+1; });
  var years = Object.keys(byYear).sort();
  if (!years.length){ $("#contracts").innerHTML = '<p class="muted">계약 정보가 없습니다.</p>'; return; }
  var max = Math.max.apply(null, years.map(function(y){ return byYear[y]; }));
  $("#contracts").innerHTML = '<div style="display:flex;flex-direction:column;gap:7px">' +
    years.map(function(y){
      var n = byYear[y], cliff = n / s.players.length >= 0.3;
      return '<div style="display:grid;grid-template-columns:52px 1fr 34px;gap:10px;align-items:center;font-size:12.5px">'+
        '<span class="num" style="color:var(--ink-2)">'+y+'</span>'+
        '<span style="height:11px;border-radius:4px;background:'+(cliff?"var(--s2)":"var(--s1)")+';width:'+(n/max*100).toFixed(1)+'%"></span>'+
        '<span class="num" style="text-align:right'+(cliff?';color:var(--s2);font-weight:600':'')+'">'+n+'</span></div>';
    }).join("") + "</div>";
  var worst = years.reduce(function(a,b){ return byYear[b] > byYear[a] ? b : a; });
  $("#cliffNote").textContent = worst + "년에 " + byYear[worst] + "명이 한꺼번에 끝납니다 (스쿼드 " + s.players.length + "명 중).";
}

/* ── TOP 3 ── */
function podium(){
  var s = D.seasons[seasonIdx];
  var gkOnly = D.dict.rankable["골키퍼"].indexOf(rankKey) >= 0;
  var pool = s.players.filter(function(p){
    var isGK = (p.positions.Pgoa||0) >= 15;
    return gkOnly ? isGK : !isGK;
  });
  var val = function(p){ return rankKey === "PCAB" ? p.ca : rankKey === "PPAB" ? p.pa : (p.attrs[rankKey] || 0); };
  var top = pool.filter(function(p){ return val(p) > 0; }).sort(function(a,b){ return val(b)-val(a); }).slice(0,3);
  var raw = rankKey === "PCAB" || rankKey === "PPAB";
  var meta = byTag[rankKey];
  $("#podiumLabel").textContent = raw ? (rankKey === "PCAB" ? "현재 능력" : "잠재 능력")
    : (meta ? meta.label + (meta.sure ? "" : "?") : rankKey);
  $("#podium").innerHTML = top.map(function(p,i){
    return '<button class="pcard" data-key="'+esc(p.key)+'" data-uid="'+p.uid+'" data-season="'+seasonIdx+'">'+
      '<div class="rank">'+(i+1)+'위</div>'+
      '<div class="pn">'+esc(p.name)+'</div>'+
      '<div class="pm">'+esc(p.pos.join(" · ") || "—")+' · '+(p.h||"?")+'cm</div>'+
      '<div class="pv">'+(raw ? val(p) : sc(val(p)))+'</div></button>';
  }).join("") || '<p class="muted">해당 조건의 선수가 없습니다.</p>';
  $$("#podium .pcard").forEach(function(b){
    b.addEventListener("click", function(){
      openByKey(b.getAttribute("data-key"), +b.getAttribute("data-season"), +b.getAttribute("data-uid")); });
  });
}

function rankTabs(){
  var groups = D.dict.rankable, html = "";
  Object.keys(groups).forEach(function(g){
    groups[g].forEach(function(t){
      var m = byTag[t];
      var label = t === "PCAB" ? "CA" : t === "PPAB" ? "PA" : (m ? m.label + (m.sure ? "" : "?") : t);
      html += '<button class="tab" data-k="'+t+'" aria-pressed="'+(t===rankKey)+'">'+esc(label)+'</button>';
    });
  });
  $("#rankTabs").innerHTML = html;
  $$("#rankTabs .tab").forEach(function(b){
    b.addEventListener("click", function(){ rankKey = b.getAttribute("data-k"); rankTabs(); podium(); });
  });
}

/* ── 선수 카드 ── */
/* uid 를 주면 **그 선수**를 연다. 안 주면 예전처럼 이름표로 찾는다(재직 기간 쪽은 이름표뿐이다).
 * 이름표로 찾으면 동명이인 중 첫 사람이 열린다 — 그래서 포디움은 uid 를 준다. */
function openByKey(key, si, uid){
  var idx = si == null ? seasonIdx : si;
  var p = (uid != null && !isNaN(uid)) ? D.seasons[idx].players[uid] : null;
  if (p && key && p.key !== key) p = null;            // 시즌이 바뀌어 번호가 어긋나면 버린다
  if (!p) p = D.seasons[idx].players.filter(function(x){ return x.key === key; })[0];
  if (!p){
    for (var i = D.seasons.length-1; i >= 0; i--){
      var f = D.seasons[i].players.filter(function(x){ return x.key === key; })[0];
      if (f){ p = f; idx = i; break; }
    }
  }
  if (!p) return;

  var hist = [];
  D.seasons.forEach(function(s,i){
    var m = s.players.filter(function(x){ return x.key === key; })[0];
    if (m) hist.push({ i: i, season: s.season, ca: m.ca });
  });

  var spark = "";
  if (hist.length > 1){
    var W = 300, H = 56, lo = Math.min.apply(null, hist.map(function(h){ return h.ca; }));
    var hi = Math.max.apply(null, hist.map(function(h){ return h.ca; }));
    var pad = Math.max(4, (hi-lo)*0.15);
    var xs = function(k){ return 4 + k*(W-8)/(hist.length-1); };
    var ys = function(v){ return H-6 - (v-(lo-pad))/((hi+pad)-(lo-pad))*(H-14); };
    var d = hist.map(function(h,k){ return (k?"L":"M")+xs(k).toFixed(1)+" "+ys(h.ca).toFixed(1); }).join(" ");
    spark = '<div class="agroup"><h4>이 구단에서의 현재 능력 추이 &middot; '+hist[0].season+' ~ '+hist[hist.length-1].season+'</h4>'+
      '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="width:100%;height:'+H+'px" role="img" aria-label="시즌별 능력 추이">'+
      '<path d="'+d+'" fill="none" stroke="var(--s1)" stroke-width="2" vector-effect="non-scaling-stroke"/>'+
      hist.map(function(h,k){ return '<circle cx="'+xs(k).toFixed(1)+'" cy="'+ys(h.ca).toFixed(1)+'" r="3" fill="var(--s1)"/>'; }).join("")+
      '</svg><div class="num" style="font-size:11px;color:var(--ink-3);display:flex;justify-content:space-between">'+
      '<span>'+hist[0].ca+'</span><span>'+hist[hist.length-1].ca+'</span></div></div>';
  }

  /* 월별 능력치 곡선 (NOTES 4-26 ⑲).
   * 세이브에서 뽑은 시즌의 **일부 선수만** 갖고 있다 — 우리가 키운 어린 선수 위주다.
   * 한 점이 한 달이고, 마지막 점이 그 세이브 시점이다.
   * ⚠ 골키퍼 11칸은 필드 선수에게 5·10·15 로 박혀 있어 평균에서 뺐다(squad.js 에서 묶음별로 나눠 담는다). */
  var hspark = "";
  if (p.hist && p.hist.tech && p.hist.tech.length > 5){
    var HH = p.hist, n = HH.tech.length, W2 = 260, H2 = 56;
    var series = [["기술", HH.tech, "var(--s1)"], ["정신", HH.ment, "var(--s2)"], ["신체", HH.phys, "var(--s3)"]];
    var all = HH.tech.concat(HH.ment, HH.phys);
    var lo2 = Math.min.apply(null, all), hi2 = Math.max.apply(null, all);
    if (hi2 - lo2 < 8){ var mid = (hi2+lo2)/2; lo2 = mid-4; hi2 = mid+4; }   // 평평한 선수는 눈금을 벌려 준다
    var pad2 = (hi2-lo2)*0.15;
    var X = function(k){ return 4 + k*(W2-8)/(n-1); };
    var Y = function(v){ return H2-6 - (v-(lo2-pad2))/((hi2+pad2)-(lo2-pad2))*(H2-14); };
    var to = (function(){ var f = HH.from.split("-"); var d = new Date(Date.UTC(+f[0], +f[1]-1+n-1, 1));
      return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0"); })();
    hspark = '<div class="agroup"><h4>능력치가 자란 길 &middot; '+esc(HH.from)+' ~ '+esc(to)+' &middot; '+n+'개월</h4>'+
      '<svg viewBox="0 0 '+W2+' '+H2+'" preserveAspectRatio="none" style="width:100%;height:'+H2+'px" role="img" aria-label="월별 능력치 추이">'+
      series.map(function(s){
        var d = s[1].map(function(v,k){ return (k?"L":"M")+X(k).toFixed(1)+" "+Y(v).toFixed(1); }).join(" ");
        return '<path d="'+d+'" fill="none" stroke="'+s[2]+'" stroke-width="1.6" vector-effect="non-scaling-stroke"/>';
      }).join("")+'</svg>'+
      '<div class="num" style="font-size:11px;color:var(--ink-3);display:flex;gap:10px;flex-wrap:wrap">'+
      series.map(function(s){ return '<span><span style="color:'+s[2]+'">&#9632;</span> '+s[0]+' '+s[1][0]+' &rarr; '+s[1][n-1]+'</span>'; }).join("")+
      '</div><div class="snote" style="margin-top:6px">한 점이 한 달입니다. 세이브에서 뽑은 시즌의 일부 선수만 이 기록을 갖고 있습니다.</div></div>';
  }
  var groups = {};
  D.dict.attrs.forEach(function(a){
    if (p.attrs[a.tag] === undefined) return;
    (groups[a.group] = groups[a.group] || []).push(a);
  });
  var isGK = (p.positions.Pgoa||0) >= 15;
  var order = isGK ? ["GK","기술","정신","신체","주발","숨은 값"] : ["기술","정신","신체","주발","숨은 값"];
  var attrHtml = order.filter(function(g){ return groups[g]; }).map(function(g){
    return '<div class="agroup"><h4>'+esc(g)+'</h4><div class="attrs">'+
      groups[g].map(function(a){
        return '<div class="attr"><span class="an'+(a.sure?"":" unsure")+'">'+esc(a.label)+(a.sure?"":"?")+
          '</span><span class="av">'+sc(p.attrs[a.tag])+'</span></div>';
      }).join("")+'</div></div>';
  }).join("");

  $("#dlgBody").innerHTML =
    '<div class="kv">'+
      '<div><div class="k">CA / PA</div><div class="v">'+(p.ca != null ? p.ca : "—")+' / '+(p.pa != null ? p.pa : "—")+'</div></div>'+
      '<div><div class="k">등번호</div><div class="v">'+(p.no != null ? p.no : "—")+'</div></div>'+
      '<div><div class="k">신체</div><div class="v">'+(p.h||"?")+'cm '+(p.w||"?")+'kg</div></div>'+
      '<div><div class="k">주급</div><div class="v">'+(p.wage != null ? p.wage.toLocaleString() : "—")+'</div></div>'+
      '<div><div class="k">합류</div><div class="v">'+(p.joined||"—")+'</div></div>'+
      '<div><div class="k">계약 만료</div><div class="v">'+(p.until||"—")+'</div></div>'+
      /* 통산 기록은 **세이브에서 뽑은 시즌에만** 있다 (4-26 ⑯). 내보내기에는 없다.
       * 없는 것과 0 을 구별해야 해서 null 이면 — 로 둔다. */
      '<div><div class="k">통산 리그</div><div class="v">'+(p.cApp != null ? p.cApp+"경기 "+p.cGoal+"골" : "—")+'</div></div>'+
      '<div><div class="k">통산 전대회</div><div class="v">'+(p.cAppAll != null ? p.cAppAll+"경기 "+p.cGoalAll+"골" : "—")+'</div></div>'+
    '</div>' + spark + hspark + attrHtml;
  $("#dlgName").textContent = p.name;
  $("#dlgMeta").textContent = (p.full && p.full !== p.name ? p.full + " · " : "") +
    (p.pos.join(" · ") || "포지션 정보 없음") + " · " + D.seasons[idx].season;
  $("#dlg").showModal();
}

$("#dlgClose").addEventListener("click", function(){ $("#dlg").close(); });
$("#dlg").addEventListener("click", function(e){ if (e.target === $("#dlg")) $("#dlg").close(); });

growthTabs(); growth(); gantt(); flow(); seasonTabs(); depth(); contracts(); rankTabs(); podium();
`;

  const totalPlayers = payload.tenure.length;
  const saves = payload.saves;

  const fact = (k, v) => `<span><b>${v}</b> ${k}</span>`;

  const maxSeasons = Math.max.apply(null, payload.playthroughs.map((p) => p.seasons));
  const chron = payload.playthroughs.map((p) => {
    const w = Math.max(4, p.seasons / maxSeasons * 100);

    const where = p.clubs.length > 1
      ? p.clubs[0] + " 외 " + (p.clubs.length - 1) + "곳"
      : (p.clubs[0] || "—");
    return `<div class="crow${p.current ? " now" : ""}">
      <div class="cname">${p.name}${p.named ? "" : ' <span class="muted">· 세이브 없음</span>'}</div>
      <div><div class="bar" style="width:${w.toFixed(1)}%"></div></div>
      <div class="cclub num">${p.from || "?"}~${(p.to || "?").slice(2)}</div>
      <div class="cclub">${where}</div>
    </div>`;
  }).join("");

  return `<title>${c.name} 커리어 아카이브</title>

if (require.main === module) {
  const fs = require("fs");
  const path = require("path");
  const argv = process.argv.slice(2);
  const opt = {};
  for (let i = 0; i < argv.length; i++) {
    if (argv[i] === "--save" || argv[i] === "--club") opt.save = argv[++i];
    else if (argv[i] === "--in") opt.in = argv[++i];
    else if (argv[i] === "--out") opt.out = argv[++i];
  }
  const src = opt.in || path.join(__dirname, "data.json");
  if (!fs.existsSync(src)) throw new Error("먼저 build.js 를 실행해 주세요: " + src);

  const data = JSON.parse(fs.readFileSync(src, "utf8"));
  const payload = buildPayload(data, opt.save);
  const out = opt.out || path.join(__dirname, "archive.html");
  fs.writeFileSync(out, html(payload));

  console.log("세이브    " + payload.save.name + "  (" + payload.seasons.length + "시즌 · 구단 " + payload.save.clubCount + "개)");
  console.log("선수      " + payload.tenure.length + "명");
  console.log("출력      " + out + "  (" + (fs.statSync(out).size / 1048576).toFixed(2) + "MB)");
}

.pos{display:inline-block; min-width:26px; padding:1px 6px; border-radius:5px;
  font-family:"IBM Plex Mono",monospace; font-size:12px; font-weight:600; text-align:center}
.pos.gold{background:var(--accent); color:#fff}
.pos.top{background:var(--accent-soft); color:var(--accent)}
.pos.plain{background:var(--sunken); color:var(--ink-2)}

/* 막대 하나 (표 안) */
.bar{display:inline-flex; align-items:center; gap:7px; justify-content:flex-end}
.bar i{display:block; height:7px; border-radius:0 3px 3px 0; background:var(--s1)}
.bar.g i{background:var(--s3)} .bar.o i{background:var(--s2)} .bar.y i{background:var(--s4)}

/* CA/PA 게이지 */
.gauge{position:relative; width:96px; height:9px; background:var(--sunken); border-radius:4px; display:inline-block; vertical-align:middle}
.gauge b{position:absolute; left:0; top:0; bottom:0; background:var(--s1); border-radius:4px 2px 2px 4px}
.gauge u{position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--s2)}

.legend{display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:var(--ink-2); margin:12px 0 0}
.legend span{display:inline-flex; align-items:center; gap:6px}
.sw{width:11px; height:11px; border-radius:3px; display:inline-block}

.note{font-size:12px; color:var(--ink-3); margin:11px 0 0; max-width:80ch}
.note b{color:var(--ink-2); font-weight:600}
.warn{border-left:3px solid var(--s4); padding:9px 0 9px 12px; background:var(--surface-2);
  border-radius:0 7px 7px 0; margin:14px 0 0; font-size:12.5px; color:var(--ink-2)}

/* 트로피 진열대 */
.troph{display:grid; grid-template-columns:auto 1fr; gap:0}
.troph .yr{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--ink-2);
  padding:9px 14px; border-bottom:1px solid var(--line); white-space:nowrap; background:var(--surface-2)}
.troph .cs{padding:7px 14px; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.troph .yr:last-of-type,.troph .cs:last-of-type{border-bottom:none}
.chip{font-size:12px; padding:2px 10px; border-radius:20px; border:1px solid var(--line-strong);
  color:var(--ink-2); display:inline-flex; gap:6px; align-items:center; white-space:nowrap}
.chip.win{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
.chip.lose{border-color:var(--crit); color:var(--crit)}
.chip .foe{opacity:.8; font-size:11px}
.troph .none{color:var(--ink-3); font-size:12px; font-style:italic}
/* 진열대 — 선반 */
.shelf{display:grid; grid-template-columns:78px 1fr; align-items:stretch}
.shelf > .yr{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-2);
  padding:12px 0 12px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center}
.shelf > .goods{padding:8px 16px 10px; border-bottom:1px solid var(--line);

.shelf > *:nth-last-child(-n+2){border-bottom:none}
.shelf .season-row{cursor:pointer}
.shelf .season-row:hover{background:var(--accent-soft)}
.shelf .season-row.on{background:var(--accent-soft); box-shadow:inset 3px 0 0 var(--accent)}
.good{display:flex; flex-direction:column; align-items:center; gap:2px; width:46px}
.good .cap.nm{color:var(--ink-2); font-weight:600; font-size:9.5px}
.hof{display:grid; grid-template-columns:repeat(auto-fit,minmax(232px,1fr)); gap:0; background:var(--surface)}
.hof > div{background:var(--surface); padding:14px 16px; display:flex; gap:13px; align-items:flex-start;
  border-right:1px solid var(--line); border-bottom:1px solid var(--line)}
.hof .txt{min-width:0; flex:1}
.hof .t{font-size:13px; font-weight:600; line-height:1.3; margin-bottom:3px; word-break:keep-all; text-wrap:balance}
.hof .n{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-3); line-height:1.5;
  word-break:keep-all}
.hof .cnt{font-family:"IBM Plex Mono",monospace; font-size:19px; font-weight:600; color:var(--s4)}
.good .cap{font-size:9.5px; color:var(--ink-3); font-family:"IBM Plex Mono",monospace; line-height:1.2; text-align:center}
.empty{color:var(--ink-3); font-size:12px; font-style:italic; align-self:center}

/* 시즌 상세 패널 */
.panel{display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:1px; background:var(--line)}
.panel > div{background:var(--surface); padding:16px 18px}
.panel h3{margin:0 0 10px; font-size:12px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-weight:600}
.kv{display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:13px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0; text-align:right; font-family:"IBM Plex Mono",monospace;
  font-variant-numeric:tabular-nums}
.panel .big{font-family:"IBM Plex Mono",monospace; font-size:30px; font-weight:600; line-height:1.1;
  letter-spacing:-.02em}
.panel .cabinet{display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end; min-height:70px}
.plist{list-style:none; margin:0; padding:0; font-size:13px}
.plist li{display:flex; justify-content:space-between; gap:10px; padding:3px 0;
  border-bottom:1px solid var(--line)}
.plist li:last-child{border-bottom:none}
/* 다섯 칸이 4열 격자에 들어가면 마지막 하나가 혼자 남아 빈 자리가 크게 생긴다 —
   마지막 칸을 남은 열 전체로 펴고, 목록을 여러 단으로 흘린다 */
.panel > div:nth-child(5){grid-column:1 / -1}
.panel > div:nth-child(5) .plist{columns:2; column-gap:28px}
@media (max-width:560px){ .panel > div:nth-child(5) .plist{columns:1} }
/* 패널 안 트로피는 크게 — 여기가 진열대의 주인공이다 */
.panel .cabinet svg{width:48px; height:59px}
.panel .cabinet .good{width:62px}
.plist .nm{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.plist .fl{color:var(--ink-3); font-size:11px}
svg{display:block; max-width:100%}
svg text{font-family:"IBM Plex Mono",monospace; fill:var(--ink-3)}
.tip{position:fixed; pointer-events:none; z-index:50; background:var(--surface);
  border:1px solid var(--line-strong); border-radius:8px; padding:8px 11px; font-size:12px;
  box-shadow:var(--shadow); max-width:270px; opacity:0; transition:opacity .1s}
.tip.on{opacity:1}
.tip b{display:block; font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-3);
  letter-spacing:.06em; margin-bottom:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>`;

function trophySVG(run, kind) {

  const col = kind === "win" ? GOLD : kind === "lose" ? SILV : GHOST;
  const fill = kind === "win" ? GOLD : "none";
  const op = kind === "final" ? 0.7 : 1;
  const W = 34, H = 42;
  const g = mk("svg", { viewBox: "0 0 " + W + " " + H, width: W, height: H, role: "img" });
  g.setAttribute("aria-label", (kind === "win" ? "우승" : kind === "lose" ? "준우승" : "결승 진출") + " 트로피");
  const add = (t, a) => g.appendChild(mk(t, Object.assign({ stroke: col, "stroke-width": 1.6,
    fill: "none", "stroke-linejoin": "round", "stroke-linecap": "round", opacity: op }, a)));
  trophyPath(shapeOf(run), col, fill, op, add);
  return g;
}

const SHAPE = (n) => n <= 2 ? "단판" : n <= 8 ? String(n) + "팀" : String(n) + "팀";

function goods(run) {
  const kind = run.result === "우승" ? "win" : run.result === "준우승" ? "lose"
    : run.result === "결승" ? "final" : null;
  if (!kind) return null;
  const d = el("div", { class: "good" });
  const pic = cupPic(run);
  if (pic) {

    d.appendChild(el("img", { class: "cuppic " + kind, src: pic, loading: "lazy",
      alt: (run.comp || run.short || "대회") + " " + run.result + " 트로피" }));
  } else d.appendChild(trophySVG(run, kind));
  d.appendChild(el("div", { class: "cap nm" }, run.short || (run.from + "팀")));
  d.appendChild(el("div", { class: "cap" }, run.result));
  const foe = FOEOF(run.foe);
  bindTip(d, "<b>" + (run.comp || "대회 미상") + " · " + run.result + "</b>" +
    run.from + "팀에서 시작 · " +
    (run.from === run.to ? "단판 대회다 (실드·슈퍼컵류)" : run.from + "강부터 " + (run.to === 2 ? "결승" : run.to + "강") + "까지") +
    (foe ? "<br>상대 추정 <b>" + foe.name + "</b> (근거 " + Math.round(foe.conf * 100) + "%)" : "") +
    (run.byCapture ? "<br><span class=\\"dim\\">결과는 명예의전당 캡처가 알려줬다</span>" : "") +
    "<br><span class=\\"dim\\">이름: 명예의전당 캡처 · 트로피: 세이브의 컵 이력</span>");
  return d;
}

const LEAGUE_OF = (function () {
  const m = {};
  for (const c of (D.honours || [])) {
    if (c.kind !== "league" || !c.win) continue;
    for (const y of c.win) {
      const start = c.summer ? y : y - 1;
      const key = start + "-" + String((start + 1) % 100).padStart(2, "0");
      (m[key] = m[key] || []).push(c);
    }
  }
  return m;
})();

const FOEMAP = new Map();
if (D.trophies) for (const s of D.trophies) for (const it of s.items)
  if (it.foe && it.foeName) FOEMAP.set(it.foe, it.foeName);
const FOEOF = (t) => { const v = t ? FOEMAP.get(t) : null; return v && v.conf >= FOE_MIN ? v : null; };

(function cabinet() {
  const rail = $('ssrail'), sel = $('sspick');
  if (!rail || !D.runs) return;

  const LINE = new Map();
  for (const t of (D.timeline || [])) LINE.set(t.season, t);
  for (const s2 of D.runs) {
    const line = LINE.get(s2.season);
    const c = el('button', { class: 'ss-card', type: 'button', 'data-s': s2.season });
    c.appendChild(el('div', { class: 'ss-y' }, s2.season));
    c.appendChild(el('div', { class: 'ss-div' }, (line && line.divName) || '디비전 모름'));
    const st = line && line.standing;
    const pos = el('div', { class: 'ss-pos' + (st && st.pos === 1 ? ' win' : '') },
      st ? st.pos + '위' : '—');
    c.appendChild(pos);

    const cups = el('div', { class: 'ss-cups' });
    let n = 0;

    for (const lg of (LEAGUE_OF[s2.season] || [])) {
      n++;
      const G2 = D.trophyPix || null;
      const lpic = (D.cupPix || {})[lg.name] || (G2 ? (G2.league || G2.cup) : null);
      if (lpic) cups.appendChild(el('img', { class: 'win', src: lpic, loading: 'lazy',
        alt: (lg.name || ('대회 ' + lg.comp)) + ' 우승' }));
      else cups.appendChild(trophySVG({ from: 20, short: null }, 'win'));
    }
    for (const run of s2.runs) {
      const kind = run.result === '우승' ? 'win' : run.result === '준우승' ? 'lose'
        : run.result === '결승' ? 'final' : null;
      if (!kind) continue;
      n++;
      const pic = cupPic(run);
      if (pic) cups.appendChild(el('img', { class: kind, src: pic, loading: 'lazy',
        alt: (run.comp || run.short || '대회') + ' ' + run.result }));
      else cups.appendChild(trophySVG(run, kind));
    }
    if (!n) cups.appendChild(el('span', { class: 'none' }, '결승 없음'));
    c.appendChild(cups);
    const wins = s2.runs.filter(function (r) { return r.result === '우승'; }).length
      + (LEAGUE_OF[s2.season] || []).length;
    c.appendChild(el('div', { class: 'ss-n' }, wins ? '우승 ' + wins + '개' : (n ? '결승 ' + n + '회' : ' ')));
    c.addEventListener('click', function () { pickSeason(s2.season); });
    rail.appendChild(c);
    sel.appendChild(el('option', { value: s2.season }, s2.season));
  }
  sel.addEventListener('change', function () { pickSeason(sel.value); });
  const step = (d) => { const ss = D.runs.map(function (x) { return x.season; });
    const i = ss.indexOf(sel.value); const j = Math.min(ss.length - 1, Math.max(0, i + d));
    if (j !== i) pickSeason(ss[j]); };
  const pv = $('ssprev'), nx = $('ssnext');
  if (pv) pv.addEventListener('click', function () { step(-1); });
  if (nx) nx.addEventListener('click', function () { step(1); });
})();

const BYSEASON = {
  line: new Map(D.timeline.map((s) => [s.season, s])),
  run: new Map((D.runs || []).map((s) => [s.season, s])),
  rec: new Map((D.records || []).map((s) => [s.season, s])),
  ros: new Map((D.rosters || []).map((s) => [s.season, s]))
};
function pickSeason(season) {
  const t = BYSEASON.line.get(season), r = BYSEASON.run.get(season),
    rc = BYSEASON.rec.get(season), ro = BYSEASON.ros.get(season);
  $("panelTitle").textContent = season + " 시즌";
  const p = $("panel");
  p.innerHTML = "";

  document.querySelectorAll(".ss-card.on").forEach((n) => n.classList.remove("on"));
  const card = document.querySelector('.ss-card[data-s="' + season + '"]');
  if (card) { card.classList.add("on");
    card.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" }); }
  const sel = document.getElementById("sspick");
  if (sel && sel.value !== season) sel.value = season;

  const c1 = el("div");
  c1.appendChild(el("h3", null, "리그"));
  if (t && t.standing) {
    const st = t.standing;
    c1.appendChild(el("div", { class: "big" }, st.pos + "위"));
    c1.appendChild(el("div", { class: "dim", style: "font-size:12px;margin-bottom:10px" },
      t.divName + " · " + st.teams + "팀"));
    const dl = el("dl", { class: "kv" });
    dl.innerHTML = "<dt>경기</dt><dd>" + st.played + "</dd>" +
      "<dt>승 · 무 · 패</dt><dd>" + st.w + " · " + st.d + " · " + st.l + "</dd>" +
      "<dt>득점 · 실점</dt><dd>" + st.gf + " · " + st.ga + "</dd>" +
      "<dt>승점</dt><dd><b>" + st.pts + "</b></dd>";
    c1.appendChild(dl);
  } else {
    c1.appendChild(el("div", { class: "miss" }, (t && t.why) || "순위를 못 찾았다"));
    if (t) c1.appendChild(el("div", { class: "dim", style: "font-size:12px;margin-top:6px" },
      t.divName + "에 있었다는 것은 안다"));
  }
  p.appendChild(c1);

  const c2 = el("div");
  c2.appendChild(el("h3", null, "그 해의 진열대"));
  const cab = el("div", { class: "cabinet" });
  const its = r ? r.runs.map(goods).filter(Boolean) : [];
  if (its.length) for (const it of its) cab.appendChild(it);
  else cab.appendChild(el("span", { class: "empty" }, "결승에 간 대회가 없다"));
  c2.appendChild(cab);
  p.appendChild(c2);

  if (D.transfers && D.transfers.length) {
    const 그해 = D.transfers.filter((x) => x.season === season);
    if (그해.length) {
      const c2b = el("div");
      c2b.appendChild(el("h3", null, "이적"));
      const 돈 = (v) => v >= 1e6 ? "£" + (v / 1e6).toFixed(v >= 1e7 ? 0 : 1) + "M"
                     : v >= 1e3 ? "£" + Math.round(v / 1e3) + "K" : "£" + v;
      const 줄짓기 = (dir, 라벨) => {
        const v = 그해.filter((x) => x.dir === dir);
        if (!v.length) return null;
        const 합 = v.reduce((s, x) => s + x.fee, 0);
        const box = el("div", { style: "margin-bottom:10px" });
        box.appendChild(el("div", { class: "dim", style: "font-size:12px;margin-bottom:4px" },
          라벨 + " " + v.length + "명" + (합 ? " · " + 돈(합) : "")));
        const dl = el("dl", { class: "kv" });
        dl.innerHTML = v.sort((a, b) => b.fee - a.fee).map((x) =>
          "<dt>" + (x.name || ("UID2 " + x.uid2)) + "</dt><dd>" +
          (x.otherName ? '<span class="dim">' + x.otherName + "</span> " : "") +

          (x.kind === "loan" ? '<span class="dim">임대</span>'
            : x.fee ? "<b>" + 돈(x.fee) + "</b>" : '<span class="dim">무료</span>') + "</dd>").join("");
        box.appendChild(dl);
        return box;
      };
      const 안 = 줄짓기("in", "영입"), 밖 = 줄짓기("out", "방출");
      if (안) c2b.appendChild(안);
      if (밖) c2b.appendChild(밖);
      p.appendChild(c2b);
    }
  }

  const c3 = el("div");
  c3.appendChild(el("h3", null, "경기력"));
  if (t && t.stats) {
    const x = t.stats, dl = el("dl", { class: "kv" });
    dl.innerHTML = "<dt>평균 평점</dt><dd><b>" + x.avgRating + "</b></dd>" +
      "<dt>기대득점 / 경기</dt><dd>" + x.xG + "</dd>" +
      "<dt>슈팅 / 경기</dt><dd>" + x.shots + "</dd>" +
      "<dt>유효 슈팅</dt><dd>" + x.onTargetPct + "%</dd>" +
      "<dt>패스 성공</dt><dd>" + x.passPct + "%</dd>" +
      "<dt>태클 성공</dt><dd>" + x.tacklePct + "%</dd>" +
      "<dt>클린시트</dt><dd>" + (x.cleanSheets == null ? "—" : x.cleanSheets) + "</dd>" +
      "<dt>기대실점 방어</dt><dd>" + (x.xGPrevented == null ? "—" : (x.xGPrevented > 0 ? "+" : "") + x.xGPrevented) + "</dd>";
    c3.appendChild(dl);
  } else c3.appendChild(el("div", { class: "miss" }, "이 시즌은 상세 기록이 없다"));
  p.appendChild(c3);

  const c4 = el("div");
  c4.appendChild(el("h3", null, "그 해의 최고 기록"));
  if (rc) {
    const dl = el("dl", { class: "kv" });
    dl.innerHTML = "<dt>최다 출장</dt><dd>" + rc.app + "</dd>" +
      "<dt>최다 득점</dt><dd><b>" + rc.goal + "</b></dd>" +
      "<dt>최다 도움</dt><dd>" + rc.assist + "</dd>" +
      "<dt>최다 MVP</dt><dd>" + rc.motm + "</dd>" +
      "<dt>최고 평점</dt><dd>" + (rc.rate || "—") + "</dd>" +
      "<dt>등록 인원</dt><dd>" + rc.rows + "</dd>";
    c4.appendChild(dl);
    c4.appendChild(el("p", { class: "note", style: "margin-top:9px" },
      "값은 정확한데 <b>누구인지는 모릅니다</b> — 이력 표에 사람 칸이 없습니다."));
  } else c4.appendChild(el("div", { class: "miss" }, "이 시즌 기록이 없다"));
  p.appendChild(c4);

  const c5 = el("div");
  c5.appendChild(el("h3", null, "그 해의 얼굴들"));
  if (ro) {
    const ul = el("ul", { class: "plist" });
    for (const q of ro.top) {
      const li = el("li");
      li.innerHTML = '<span class="nm">' + q.name +
        (q.full && q.full !== q.name ? ' <span class="fl">' + q.full + "</span>" : "") + "</span>" +
        '<span class="num">' + q.ca + "</span>";
      ul.appendChild(li);
    }
    c5.appendChild(ul);
    c5.appendChild(el("p", { class: "note", style: "margin-top:9px" },
      "능력치 상위 다섯 · 그 해 등록 <b>" + ro.n + "명</b>"));
  } else {
    c5.appendChild(el("div", { class: "miss" }, "이 해는 명단이 없습니다"));
    c5.appendChild(el("p", { class: "note", style: "margin-top:9px" },
      "내보내기 파일이 없는 해입니다. <b>순위와 성적은 세이브에서 옵니다</b> — 그래서 빈칸이 아니라 반쪽입니다."));
  }
  p.appendChild(c5);
}

(function first() {
  if (!D.runs || !D.runs.length) return;
  let best = D.runs[0], n = -1;
  for (const s of D.runs) {
    const w = s.runs.filter((r) => r.result === "우승").length;
    if (w > n) { n = w; best = s; }
  }
  pickSeason(best.season);
})();

(function perf() {
  const rows = D.timeline.filter((s) => s.stats || s.standing);
  const rated = rows.filter((s) => s.stats);
  const maxRate = Math.max.apply(null, rated.map((s) => s.stats.avgRating || 0));
  const maxXg = Math.max.apply(null, rated.map((s) => s.stats.xG || 0));
  const cols = ["시즌", "디비전", "순위", "경기", "승-무-패", "득실", "승점", "평균평점",
    "xG (PK 제외)", "실점방어", "슛", "유효%", "패스%", "태클%", "클린시트"];
  const t = $("perf");
  const hr = el("tr");
  cols.forEach((c, i) => hr.appendChild(el("th", { class: i < 2 ? "l" : "" }, c)));
  t.appendChild(el("thead")).appendChild(hr);

  const bar = (v, max, cls) => v == null ? MISS
    : '<span class="bar ' + cls + '"><span class="num">' + v.toFixed(2) + "</span>" +
      '<i style="width:' + Math.max(3, 46 * v / max) + 'px"></i></span>';

  const tb = el("tbody");
  for (const s of rows) {
    const st = s.standing, x = s.stats, r = el("tr");
    const xgp = x && x.xGPrevented != null
      ? '<span class="num" style="color:' + (x.xGPrevented >= 0 ? "var(--good)" : "var(--crit)") + '">' +
        (x.xGPrevented > 0 ? "+" : "") + x.xGPrevented.toFixed(1) + "</span>"
      : MISS;
    r.innerHTML =
      '<td class="l num">' + s.season + "</td>" +
      '<td class="l dim">' + s.divName + "</td>" +
      "<td>" + (st ? '<span class="pos ' + (st.pos === 1 ? "gold" : st.pos <= 3 ? "top" : "plain") +
        '">' + st.pos + "</span>" : '<span class="miss">진행 중</span>') + "</td>" +
      "<td>" + (st ? N(st.played) : MISS) + "</td>" +
      '<td class="num">' + (st ? st.w + "-" + st.d + "-" + st.l : MISS) + "</td>" +
      '<td class="num">' + (st ? st.gf + ":" + st.ga : MISS) + "</td>" +
      "<td>" + (st ? "<b>" + N(st.pts) + "</b>" : MISS) + "</td>" +
      "<td>" + (x ? bar(x.avgRating, maxRate, "") : MISS) + "</td>" +
      "<td>" + (x ? bar(x.xG, maxXg, "o") + ' <span class="dim num">(' + x.xGNoPen.toFixed(2) + ")</span>" : MISS) + "</td>" +
      "<td>" + xgp + "</td>" +
      "<td>" + (x ? N(x.shots, 1) : MISS) + "</td>" +
      "<td>" + (x ? N(x.onTargetPct, 1) : MISS) + "</td>" +
      "<td>" + (x ? N(x.passPct, 1) : MISS) + "</td>" +
      "<td>" + (x ? N(x.tacklePct, 1) : MISS) + "</td>" +
      "<td>" + (x ? N(x.cleanSheets) : MISS) + "</td>";
    tb.appendChild(r);
  }
  t.appendChild(tb);
})();

const AWARD_OF = (function () {
  const m = new Map();
  for (const a of (D.awards.players || [])) if (a.name) m.set(a.name, a);
  return m;
})();
const PODIUM_OF = (function () {
  const m = new Map();

  for (const c of (D.podium || []).filter(function (x) { return !x.mgr; }))
    for (const s of (c.seasons || []))
      (s.p || []).forEach(function (q, i) {
        if (!q || !q.name) return;
        if (!m.has(q.name)) m.set(q.name, []);
        m.get(q.name).push({ award: c.name, year: s.y, place: i + 1 });
      });
  return m;
})();

const keysOf = (p) => (p.local ? [p.local, p.full].filter(Boolean) : []);
const awardsFor = (p) => { for (const k of keysOf(p)) if (AWARD_OF.has(k)) return AWARD_OF.get(k); return null; };
const podiumFor = (p) => { for (const k of keysOf(p)) if (PODIUM_OF.has(k)) return PODIUM_OF.get(k); return null; };

const MEDAL = { 1: ['#d8a33a', '금'], 2: ['#a8adb4', '은'], 3: ['#b07a4e', '동'] };
function medalSvg(place) {
  const c = (MEDAL[place] || MEDAL[3])[0];
  return '<svg class="med" viewBox="0 0 20 24" width="15" height="18" aria-hidden="true">' +
    '<path d="M5 1 L8 9 L12 9 L15 1" stroke="' + c + '" stroke-width="2" fill="none"/>' +
    '<circle cx="10" cy="15" r="6.5" fill="' + c + '" opacity=".85"/>' +
    '<circle cx="10" cy="15" r="3" fill="none" stroke="rgba(0,0,0,.25)"/></svg>';
}

  const s = document.createElement('style');
  s.textContent = [

    'font-size:10.5px;font-weight:600;letter-spacing:.02em;',

    '#pcard h3{margin:0 0 2px;font-size:19px}',

    '#pcard .awrow .ct{font-weight:600;font-variant-numeric:tabular-nums}',
    '#pcard .yr{font-variant-numeric:tabular-nums;color:var(--ink-3);width:3.4em}',

  ].join('');
  document.head.appendChild(s);
  const w = document.createElement('div');
  w.id = 'pcwrap';
  w.innerHTML = '<div id="pcard"></div>';
  w.addEventListener('click', function (e) { if (e.target === w) closePlayerCard(); });
  document.body.appendChild(w);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closePlayerCard(); });
})();
function closePlayerCard() { const w = document.getElementById('pcwrap'); if (w) w.classList.remove('on'); }
function openPlayerCard(p, aw, pod) {
  const c = document.getElementById('pcard');
  const bits = [N(p.age) + '세'];
  if (p.pos && p.pos.length) bits.push(p.pos.map((k) => POS[k] || k).join(' '));
  if (p.ca) bits.push('현재능력 ' + p.ca);
  let h = '<button id="pcclose" type="button">닫기</button>' +
    '<h3>' + who(p) + '</h3><div class="sub">' + bits.join(' · ') + '</div>';

  if (aw) {
    h += '<h4>받은 상 — ' + aw.total + '회 · ' + aw.kinds + '종 (' + aw.from + '~' + aw.to + ')</h4>';

    const named = aw.named || [];
    named.forEach(function (x, i) {
      const twin = (i > 0 && named[i - 1].name === x.name) || (i + 1 < named.length && named[i + 1].name === x.name);
      h += '<div class="awrow">' + medalSvg(1) + '<span class="nm">' + x.name +
        '</span><span class="ct">' + x.n + '회</span></div>';
      if (twin && (i + 1 >= named.length || named[i + 1].name !== x.name))
        h += '<div class="twin">이름이 같은 상이 둘입니다 — 게임에도 둘로 나옵니다</div>';
    });
    const un = aw.total - (aw.named || []).reduce((a, x) => a + x.n, 0);
    if (un > 0) h += '<div class="awrow"><span class="nm miss">이름을 모르는 상</span>' +
      '<span class="ct">' + un + '회</span></div>';
  }

  if (pod && pod.length) {
    const rows = pod.slice().sort((a, b) => b.year - a.year || a.place - b.place);
    h += '<h4>해마다 — ' + rows.length + '번 단상에 올랐습니다</h4>';
    for (const r of rows)
      h += '<div class="awrow"><span class="yr">' + r.year + '</span>' + medalSvg(r.place) +
        '<span class="nm">' + r.award + '</span><span class="ct">' +
        (MEDAL[r.place] || MEDAL[3])[1] + '</span></div>';
  }
  if (!aw && (!pod || !pod.length)) {

    h += p.local
      ? '<p class="miss">이 구단에서 받은 개인 수상 기록이 없습니다.</p>'
      : '<p class="miss">이 선수는 <b>성만</b> 알고 있어서 수상표와 잇지 못했습니다 —' +
        ' 이름을 알려면 그 시즌의 내보낸 팀 파일이 있어야 합니다.<br>' +
        '성으로 맞추면 같은 성을 쓰는 다른 사람의 상이 붙을 수 있어 잇지 않습니다.</p>';
  }

  c.innerHTML = h;
  c.querySelector('#pcclose').addEventListener('click', closePlayerCard);
  document.getElementById('pcwrap').classList.add('on');
  c.scrollTop = 0;
}

(function squadTable() {
  const q = D.squad.slice().sort((a, b) => (b.ca || 0) - (a.ca || 0));
  const t = $("squad");
  const cols = [["#", ""], ["이름", "l"], ["나이", ""], ["포지션", "l"], ["등급", "l"],
    ["현재능력 / 잠재능력", "l"], ["주급", ""], ["계약 만료", ""], ["리그 통산", ""], ["전 대회 통산", ""]];
  const hr = el("tr");
  cols.forEach((c) => hr.appendChild(el("th", { class: c[1] }, c[0])));
  t.appendChild(el("thead")).appendChild(hr);

  const tb = el("tbody");
  for (const p of q) {
    const pa = paOf(p.pa), r = el("tr");
    const gauge = '<span class="gauge"><b style="width:' + (100 * (p.ca || 0) / 200) + '%"></b>' +
      (pa ? '<u style="left:calc(' + (100 * pa / 200) + '% - 1px)"></u>' : "") + "</span>";
    r.innerHTML =
      '<td class="num dim">' + (p.num || "") + "</td>" +
      '<td class="l"><b>' + whoHtml(p) + "</b></td>" +
      "<td>" + N(p.age) + "</td>" +
      '<td class="l dim">' + (p.pos.map((k) => POS[k] || k).join(" ") || MISS) + "</td>" +
      '<td class="l dim">' + (p.grade || MISS) + "</td>" +
      '<td class="l">' + gauge + ' <span class="num">' + (p.ca || "—") + "</span>" +
        '<span class="dim num"> / ' + (pa || "—") + "</span></td>" +
      "<td>" + N(p.wage) + "</td>" +
      '<td class="num dim">' + (p.to || "—") + "</td>" +
      '<td class="num">' + (p.lgApp != null ? p.lgApp + " / " + p.lgGoal : MISS) + "</td>" +
      '<td class="num">' + (p.acApp != null ? p.acApp + " / " + p.acGoal : MISS) + "</td>";
    bindTip(r, "<b>" + who(p) + "</b>생일 " + (p.dob || "—") + " · 합류 " + (p.joined || "—") +
      (pa ? "<br>잠재까지 " + (pa - p.ca) + " 남음" : "<br>잠재능력이 아직 안 정해진 선수"));

    const aw = awardsFor(p), pod = podiumFor(p);
    if (aw || (pod && pod.length)) {
      const n = aw ? aw.total : pod.length;
      r.children[1].insertAdjacentHTML("beforeend", ' <span class="awmark">수상 ' + n + "</span>");
    }
    r.classList.add("hasaw");
    r.addEventListener("click", function () { openPlayerCard(p, aw, pod); });
    tb.appendChild(r);
  }
  t.appendChild(tb);
})();

(function hof() {
  const has = D.squad.filter((p) => p.acApp != null);
  const draw = (id, key, label, cls) => {
    const t = $(id), q = has.slice().sort((a, b) => b[key] - a[key]).slice(0, 12);
    const max = q.length ? q[0][key] : 1;
    const hr = el("tr");
    hr.appendChild(el("th", { class: "l", colspan: 3 },
      label + ' <span style="text-transform:none;font-weight:400">— 커리어 통산 (이 구단 기록이 아님)</span>'));
    t.appendChild(el("thead")).appendChild(hr);
    const tb = el("tbody");
    q.forEach((p, i) => {
      const r = el("tr");
      r.innerHTML = '<td class="l dim num" style="width:26px">' + (i + 1) + "</td>" +
        '<td class="l"><b>' + whoHtml(p) + '</b> <span class="dim num">' + p.age + "</span></td>" +
        '<td><span class="bar ' + cls + '"><span class="num">' + p[key].toLocaleString("ko-KR") +
          '</span><i style="width:' + Math.max(3, 70 * p[key] / max) + 'px"></i></span></td>';

        p.acApp + "경기 " + p.acGoal + "골");
      tb.appendChild(r);
    });
    t.appendChild(tb);
  };
  draw("hofApp", "acApp", "출장", "g");
  draw("hofGoal", "acGoal", "득점", "o");
})();

(function curves() {

.panel h3{margin:0 0 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:var(--mono);font-weight:500;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.panel h3 small{letter-spacing:0;text-transform:none}
.panel h3.mt{margin-top:16px}
svg{display:block;width:100%;height:auto;overflow:visible}
.ax{fill:var(--muted);font-family:var(--mono);font-size:10px}
.gl{stroke:var(--line);stroke-dasharray:2 3}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13px}
th{text-align:left;font-size:11px;color:var(--muted);font-weight:500;padding:5px 6px 5px 0;border-bottom:1px solid var(--line);font-family:var(--mono)}
td{padding:6px 6px 6px 0;border-bottom:1px solid var(--line)}
td.n,th.n{text-align:right;font-family:var(--mono)}
tr.us td{color:var(--claret);font-weight:600}
.who{color:var(--claret);text-decoration:none;border-bottom:1px dotted var(--claret)}
.dim{color:var(--muted);font-size:12px}
.mono{font-family:var(--mono)}
.legend{display:flex;gap:12px;font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.cab{display:flex;gap:16px;flex-wrap:wrap}
.cab .t{width:92px;text-align:center;font-size:11px;color:var(--muted);line-height:1.3}
.cab .t img{width:64px;height:64px;object-fit:contain;display:block;margin:0 auto 6px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.2))}
.cab .t .g{width:64px;height:64px;margin:0 auto 6px;border-radius:50%;border:1px dashed var(--gold);display:grid;place-items:center;color:var(--gold);font-family:var(--display);font-size:20px}
.cab .t em{display:block;font-style:normal;font-weight:700;color:var(--text);font-size:12px}
.cab .t.lost .g{border-color:var(--line);color:var(--muted)}
.tip{position:fixed;pointer-events:none;background:var(--text);color:var(--bg);font-size:12px;font-family:var(--mono);padding:6px 9px;border-radius:6px;transform:translate(-50%,calc(-100% - 10px));white-space:nowrap;z-index:60;opacity:0;transition:opacity .12s}
.tip.on{opacity:1}
.stub{max-width:700px;margin:0 auto;padding-block:60px}
.stub h2{font-family:var(--display);font-weight:400;font-size:44px;margin:0 0 8px}
.empty{color:var(--muted);font-size:13px}
/* 가로 막대 줄 (능력치 · 성격 · 명예의 전당) */
.hrow{display:grid;grid-template-columns:150px 1fr 34px;gap:10px;align-items:center;font-size:12px;margin-bottom:6px}
.hrow .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .t{height:9px;background:var(--bg);border-radius:4px;overflow:hidden}
.hrow .t i{display:block;height:100%;background:var(--claret);border-radius:4px}
.hrow .c{font-family:var(--mono);text-align:right;color:var(--muted)}
/* 3층 연도별 표: 우리 명단에 있던 시즌은 시즌 글자를 클라렛으로. 1위는 클라렛 칩, 발롱도르는 금 칩, 올해의 팀은 점선 칩 */
table.yrs td{vertical-align:top}table.yrs th,table.yrs td:first-child,table.yrs td.n{white-space:nowrap}table.yrs td:nth-child(2){min-width:190px}table.yrs td.aw{min-width:260px}table.yrs sup{font-size:9px;margin-left:2px}
table.yrs tr.us td:first-child{color:var(--claret);font-weight:700}
table.yrs td.cx{white-space:nowrap;font-size:12px}table.yrs td.cx span{display:block}
.pill.win{border-color:var(--claret);color:var(--claret);font-weight:700}
.pill.gold{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:700}
.pill.xi{border-style:dashed;color:var(--muted)}
/* 하이라이트 단상: 카드 한 장에 아이콘 + 시즌 + 상 이름 + 골 수. 발롱도르는 금, 득점은 클라렛 */
.hlwrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.hlcard{display:flex;gap:10px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.hlcard.ball{border-color:var(--gold);color:var(--gold)}
.hlcard.boot{border-color:var(--claret);color:var(--claret)}
.hlicon{flex:0 0 auto;line-height:0}
.hlbody{min-width:0;display:flex;flex-direction:column;gap:1px}
.hlbody b{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:500}
.hlbody span{font-size:13px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hlbody em{font-style:normal;font-family:var(--display);font-size:18px;line-height:1.1}
.attrs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px 22px}
.attrs h4{margin:0 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--claret);font-family:var(--mono);font-weight:500}
.extra{max-width:1000px;margin:0 auto;padding-block:0 70px}
.extra .panels{margin-top:12px}
.extra h2{font-family:var(--display);font-weight:400;font-size:30px;margin:26px 0 4px;line-height:1}
.spell{display:inline-block;font-size:13px;padding:4px 12px;border-radius:999px;background:var(--bg);border:1px solid var(--line);margin:0 6px 6px 0}
.spell.nat{border-color:var(--claret);color:var(--claret)}
.hon-yrs{font-family:var(--mono);font-size:11px;color:var(--muted)}
table.sq td.name a{color:var(--claret);text-decoration:none;border-bottom:1px dotted var(--claret)}
.gauge{display:inline-block;width:70px;height:7px;background:var(--bg);border-radius:4px;vertical-align:middle;position:relative;overflow:hidden}
.gauge b{display:block;height:100%;background:var(--claret);border-radius:4px}
.gauge u{position:absolute;top:0;bottom:0;width:2px;background:var(--gold)}
@media (prefers-reduced-motion:no-preference){.ln{stroke-dasharray:1600;stroke-dashoffset:1600;animation:draw 1.4s ease-out forwards}}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.card.pending{opacity:1;transform:none}.scroll-hint i{animation:none}.cover{transition:none}.detail{animation:none}html{scroll-behavior:auto}}
</style>`;
