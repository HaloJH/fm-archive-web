<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>FM 커리어 아카이브</title>
</head>
<body>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ctext y=%2726%27 font-size=%2726%27%3E%E2%9A%BD%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f5f2; --panel:#fffefb; --line:#e2ded4; --ink:#232019; --ink-2:#5c564a;
  --ink-3:#8b8474; --accent:#1f6f4a; --accent-soft:#e6f0e9;
  --ok:#1f6f4a; --guess:#8a6a1f; --none:#8b8474;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16150f; --panel:#1e1d16; --line:#33312a; --ink:#f0ede4; --ink-2:#b6b0a2;
    --ink-3:#847e70; --accent:#67c295; --accent-soft:#1d3129;
    --ok:#67c295; --guess:#d6ac57; --none:#847e70;
  }
}
:root[data-theme="dark"]{
  --bg:#16150f; --panel:#1e1d16; --line:#33312a; --ink:#f0ede4; --ink-2:#b6b0a2;
  --ink-3:#847e70; --accent:#67c295; --accent-soft:#1d3129;
  --ok:#67c295; --guess:#d6ac57; --none:#847e70;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); margin:0;
  font:15px/1.6 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:940px; margin:0 auto; padding:48px 24px 80px}
header.top{margin-bottom:32px}
h1{font-size:28px; letter-spacing:-.02em; margin:0 0 6px}
.sub{color:var(--ink-2); margin:0}
.privacy{
  display:inline-block; margin-top:14px; padding:5px 11px; border-radius:999px;
  background:var(--accent-soft); color:var(--accent); font-size:13px; font-weight:600;
}

#boot{color:var(--ink-3); padding:40px 0}

#drop{
  border:2px dashed var(--line); border-radius:14px; background:var(--panel);
  padding:56px 28px; text-align:center; transition:border-color .15s, background .15s;
}
#drop.over{border-color:var(--accent); background:var(--accent-soft)}
#drop p{color:var(--ink-2); margin:0 0 20px}
.btn{
  display:inline-block; background:var(--accent); color:#fff; border:0; cursor:pointer;
  padding:11px 20px; border-radius:9px; font-size:15px; font-weight:600; font-family:inherit;
}
.btn:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.hint{color:var(--ink-3); font-size:13px; margin-top:18px}
#error{
  margin-top:18px; padding:12px 14px; border-radius:9px;
  background:#fdecec; color:#a3272b; font-size:14px;
  white-space:pre-line; text-align:left;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) #error{background:#3a1d1e; color:#f0a8a8} }

#progress{padding:40px 0}
.track{height:8px; background:var(--line); border-radius:99px; overflow:hidden}
#bar{height:100%; width:0; background:var(--accent); transition:width .1s linear}
#ptext{color:var(--ink-3); font-size:13px; margin-top:10px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

#stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:14px}
.stat{background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:14px 16px}
.stat b{display:block; font-size:22px; font-variant-numeric:tabular-nums; letter-spacing:-.01em}
.stat span{color:var(--ink-3); font-size:13px}
#elapsed{color:var(--ink-3); font-size:13px; margin:0 0 28px}
#warn{
  margin:0 0 22px; padding:12px 14px; border-radius:9px; font-size:14px;
  background:#fff5e0; color:#7a5a10; white-space:pre-line;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) #warn{background:#33280f; color:#e0bd6e} }

#list{display:flex; flex-direction:column; gap:12px}
.pt{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px 18px}
.pt header{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:10px}
.pt h3{font-size:17px; margin:0; letter-spacing:-.01em}
.span{color:var(--ink-3); font-size:13px; margin-left:auto; font-variant-numeric:tabular-nums}
.span em{display:block; font-style:normal; text-align:right; opacity:.8; margin-top:2px}
.badge{font-size:12px; font-weight:600; padding:2px 8px; border-radius:999px; border:1px solid}
.b-ok{color:var(--ok); border-color:var(--ok)}
.b-guess{color:var(--guess); border-color:var(--guess)}
.b-none{color:var(--none); border-color:var(--none)}
.journey{display:flex; flex-wrap:wrap; align-items:center; gap:5px 7px; font-size:14px}
.leg{color:var(--ink)}
.leg i{color:var(--ink-3); font-style:normal; font-size:12px; font-variant-numeric:tabular-nums}
.arrow{color:var(--ink-3)}
.missing,.note{color:var(--ink-3); font-size:13px; margin-top:9px}

.pt{cursor:pointer; transition:border-color .12s, transform .12s}
.pt:hover{border-color:var(--accent)}
.pt:active{transform:translateY(1px)}
.pt:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.pt .go{margin-left:8px; color:var(--ink-3); font-size:13px}
.pt:hover .go{color:var(--accent)}

#archive{position:fixed; inset:0; display:flex; flex-direction:column; background:var(--bg)}
#archive[hidden]{display:none}   /* display:flex 가 [hidden] 을 이기므로 명시한다 */
.abar{display:flex; align-items:center; gap:12px; padding:10px 16px;
  border-bottom:1px solid var(--line); background:var(--panel); flex:none}
.abar #aname{color:var(--ink-2); font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.back{background:none; border:1px solid var(--line); color:var(--ink); cursor:pointer;
  padding:6px 12px; border-radius:8px; font-size:14px; font-family:inherit}
.back:hover{border-color:var(--accent); color:var(--accent)}
#aframe{flex:1; width:100%; border:0; background:var(--bg)}
/* ★ 111: 세이브 깊이 읽기 — 자리·생김새는 아직 결정거리다. 여기서는 읽히기만 하면 된다. */
.deepbox{margin:22px 0 0;padding:16px 18px;background:var(--panel);border:1px solid var(--line);border-radius:6px}
.deepbox h3{margin:0 0 6px;font-size:15px}
.deepbox h3 small,.deepbox h4 small{font-weight:400;color:var(--ink-3);font-size:12px;margin-left:6px}
.deepbox h4{margin:16px 0 6px;font-size:14px}
.deepbtn{margin:6px 6px 0 0;padding:7px 12px;border:1px solid var(--line);border-radius:4px;background:var(--bg);cursor:pointer;font:inherit;font-size:13px}
.deepbtn:hover:not(:disabled){border-color:var(--ink)}
.deepbtn:disabled{opacity:.5;cursor:default}
#deeplog{margin:8px 0 0;min-height:1.2em}
.tblwrap{overflow-x:auto}
table.deept{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
table.deept th{text-align:left;font-weight:500;color:var(--ink-3);padding:4px 8px;border-bottom:1px solid var(--line);font-size:12px}
table.deept td{padding:4px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.deept td.dim{color:var(--ink-3);white-space:normal}
</style>


<div class="wrap">

  <header class="top">
    <h1>FM 커리어 아카이브</h1>
    <p class="sub">내보낸 팀 파일로 지난 시즌까지 되살립니다.</p>
    <span class="privacy">파일은 이 브라우저 안에서만 처리됩니다</span>
  </header>

  <div id="boot">준비 중…</div>

  <section id="drop" hidden>
    <div id="pick" hidden>
      <p>Football Manager 폴더를 여기에 끌어다 놓으세요</p>
      <button class="btn" id="pickBtn" type="button">폴더 고르기</button>
      <input type="file" id="folder" webkitdirectory directory multiple hidden>
      <div class="hint" id="slowNote" hidden>
        이 브라우저는 폴더를 직접 훑을 수 없어, 폴더를 고르면 시간이 오래 걸릴 수 있습니다.<br>
        <b>끌어다 놓기</b>를 쓰시거나, <code>exported teams</code> 폴더만 고르세요.
      </div>
      <div class="hint">
        <code>exported teams</code> 의 <code>.fmf</code> 파일과
        <code>games</code> 의 <code>.fm</code> 세이브를 읽습니다.<br>
        세이브는 앞 300KB 만 읽습니다 — 400MB 파일이라도 통째로 열지 않습니다.
      </div>
      <div id="error" hidden></div>
    </div>

    <div id="progress" hidden>
      <div class="track"><div id="bar"></div></div>
      <div id="ptext"></div>
    </div>
  </section>

  <section id="result" hidden>
    <div id="stats"></div>
    <p id="elapsed"></p>
    <div id="warn" hidden></div>
    <div id="list"></div>
    <!-- ★ 111: 세이브 깊이 읽기. 내보내기가 없어도 여기까지는 나온다.
         ⚠ 자리와 생김새는 아직 정하지 않았다 — 결정거리(BACKLOG) -->
    <div id="deep"></div>
  </section>

</div>

<!-- 아카이브는 iframe 에 띄운다.
     render.js 가 만드는 문서는 자기 <style> 과 <script> 를 품고 있어서,
     innerHTML 로 밀어 넣으면 스크립트가 안 돌고 CSS 가 목록 화면과 부딪힌다. -->
<div id="archive" hidden>
  <div class="abar">
    <button class="back" id="backBtn" type="button">← 세이브 목록</button>
    <span id="aname"></span>
  </div>
  <iframe id="aframe" title="커리어 아카이브"></iframe>
</div>

const MIN_COMMON = 15;
const AGREE = 0.9;
const DAY = 86400000;

const runStartDate = (season) => {

  return y ? y + "-07-01" : "0000-00-00";
};

function joinedMap(season, cutoff) {
  const m = new Map();
  for (const p of season.players) {
    const k = p.fullName || p.name;
    if (k && p.joined && p.joined > cutoff) m.set(k, p.joined);
  }
  return m;
}

function joinedAgreement(a, b, cutoff) {
  const A = joinedMap(a, cutoff), B = joinedMap(b, cutoff);
  let same = 0, n = 0;
  for (const [k, v] of A) if (B.has(k)) { n++; if (v === B.get(k)) same++; }
  return n < MIN_COMMON ? null : same / n;
}

function detectRuns(entries) {
  const sorted = entries.filter((e) => e.mtime && e.season).sort((a, b) => a.mtime - b.mtime);
  const runs = [];
  let cur = null;
  for (const e of sorted) {
    let fresh = !cur || e.season <= cur.lastSeason;

    if (fresh && cur && cur.lastEntry && e.club === cur.lastClub) {
      const agr = joinedAgreement(cur.lastEntry.data, e.data, runStartDate(cur.firstSeason));
      if (agr !== null && agr >= AGREE) { fresh = false; e.reexport = true; }

    cur.entries.push(e);
    if (!e.reexport) { cur.lastSeason = e.season; cur.lastClub = e.club; cur.lastEntry = e; }
  }

}

function groupByClub(entries) {
  const by = new Map();
  for (const e of entries) {
    if (!by.has(e.club)) by.set(e.club, { entries: [], lastSeason: null, lastClub: e.club, lastEntry: null });
    by.get(e.club).entries.push(e);

  for (const r of by.values()) r.entries.sort((a, b) => String(a.season).localeCompare(String(b.season)));

    const a = run.entries[i - 1], b = run.entries[i];
    if (a.club !== b.club) { skip++; continue; }
    const agr = joinedAgreement(a.data, b.data, cutoff);
    if (agr === null) skip++;

  return { ok, bad, skip };

function labelRuns(runs, saveFiles) {
  for (const run of runs) {
    const last = run.entries[run.entries.length - 1];
    const cands = saveFiles
      .filter((s) => s.club && s.club === last.club && s.modifiedMs >= last.mtime.getTime())
      .sort((a, b) => a.modifiedMs - b.modifiedMs);
    if (!cands.length) { run.save = null; continue; }

    const near = cands.filter((s) => s.modifiedMs <= cands[0].modifiedMs + 7 * DAY);
    run.save = near[near.length - 1];
  }

  const claimed = new Map();
  for (const run of runs) {
    if (!run.save) continue;
    const end = run.entries[run.entries.length - 1].mtime.getTime();
    const prev = claimed.get(run.save.name);
    if (!prev || end > prev.end) { if (prev) prev.run.save = null; claimed.set(run.save.name, { run, end }); }
    else run.save = null;

const seasonYear = (s) => (s ? +s.slice(0, 4) : null);

function toPlaythrough(run, index, timeAxisReliable) {
  const es = run.entries;
  const journey = [];
  for (const e of es) {
    const tail = journey[journey.length - 1];

    if (tail && tail.club === e.club) { tail.to = e.season; tail.seasons.push(e.season); }
    else journey.push({ club: e.club, from: e.season, to: e.season, seasons: [e.season] });
  }

  const have = new Set(es.map((e) => e.season));
  const missing = [];
  for (let y = seasonYear(es[0].season); y <= seasonYear(es[es.length - 1].season); y++)
    if (!have.has(seasonOf(y))) missing.push(seasonOf(y));

  const v = verifyRun(run);
  const mainClub = journey.slice().sort((a, b) => b.seasons.length - a.seasons.length)[0].club;
  const start = es[0].mtime;
  const fallbackName = mainClub + " · " + start.getFullYear() + "년 " + (start.getMonth() + 1) + "월";

  return {
    id: "pt" + (index + 1),
    name: !timeAxisReliable ? mainClub : (run.save ? run.save.name : fallbackName),
    named: !!run.save && timeAxisReliable,
    saveFile: run.save ? run.save.file : null,
    confidence: !timeAxisReliable ? "추정"
      : v.bad > 0 ? "추정"
      : run.save ? "확인" : "세이브 없음",
    note: !timeAxisReliable ? "파일 수정시각이 남아 있지 않아 세이브를 구분하지 못했습니다. 구단별로만 묶었습니다"
      : v.bad > 0 ? "합류일 검산에서 " + v.bad + "개 구간이 어긋납니다"
      : run.save ? null : "대응하는 .fm 세이브 파일이 없습니다",
    verify: v,
    span: { from: es[0].season, to: es[es.length - 1].season },
    exported: { from: es[0].mtime.toISOString().slice(0, 10), to: es[es.length - 1].mtime.toISOString().slice(0, 10) },
    seasonCount: es.length,
    missing,
    journey: journey.map((j) => ({ club: j.club, from: j.from, to: j.to, seasons: j.seasons })),
    files: es.map((e) => e.file),

}

function readSeason(bytes, filename, mtime) {

  "PDld", "PDdt", "PDbl", "PDbr", "PDcy", "PDag", "PDal", "PDim", "PDij", "PDvt",

function saveSquadPlayer(p) {

    number: p.number ?? null, squad: p.squad ?? null, ca: p.ca ?? null, pa: p.pa ?? null,
    height: p.height ?? null, weight: p.weight ?? null, wage: p.wage ?? null, morale: null,

    first: stat(senior),
    u21: stat(players.filter((p) => p.squad === "U21")),

function readClubMeta(bytes, label) {

  if (!entry || !entry.buffer) return {};
  const want = new Set(Object.keys(tags.CLUB));
  const got = {};
  parse.walkRecords(entry.buffer, (tag, type, value) => {
    if (want.has(tag) && got[tag] === undefined) got[tag] = value;

    fullName: got.TCns || null,
    shortName: got.TCsn || null,
    nickname: got.TCnn || null,
    clubId: got.TCoi ?? null,
    reputation: got.TCrp ?? null,
    stadium: got.Snam || null,
    capacity: got.Scpy ?? null,
    attendance: got.Catd ?? null,

const OK_STRING = /^[가-힣ぁ-んァ-ヶ一-龥A-Za-z0-9 .,''()\/&\-]{2,}$/;

    if (n < 2 || n > 120 || p + 4 + n > all.length) continue;
    const s = all.slice(p + 4, p + 4 + n).toString("utf8");
    if (OK_STRING.test(s) && s.indexOf("\uFFFD") < 0) { ss.push(s); p += 3 + n; }
  }

  const out = { version: ss.find((s) => /^\d+\.\d+\.\d+$/.test(s)) || null,
                manager: null, club: null, nation: null };

  let at = -1;
  for (const m of knownManagers) { at = ss.indexOf(m); if (at >= 0) { out.manager = m; break; } }
  if (at >= 0 && ss[at + 1]) {
    out.club = ss[at + 1].split(" / ")[0].trim();

function assemble({ entries, saves: rawSaves, backup, saveSquads, saveHistory, options, folder, skipped }) {
  options = options || {};
  skipped = skipped || [];
  const clubs = {};
  const managers = new Set();

  for (const e of entries) {
    if (e.manager) managers.add(e.manager);
    if (options.club && !e.club.includes(options.club)) continue;
    const club = (clubs[e.club] = clubs[e.club] || {
      name: e.club, manager: e.manager, meta: null, seasons: [],
    });
    club.seasons.push(e.data);
  }

  if (backup) {
    for (const [clubName, snapshots] of Object.entries(backup.clubs || {})) {
      if (options.club && !clubName.includes(options.club)) continue;
      if (clubs[clubName]) continue;
      const club = (clubs[clubName] = {
        name: clubName, manager: null, meta: null, seasons: [], fromBackup: true,
      });
      for (const snap of snapshots) {
        const meta = splitExportName(snap.file);
        club.manager = club.manager || meta.manager;
        const players = snap.people.filter((p) => p._isPlayer).map(slimPlayer);

        players.forEach((p) => { p.squad = (p.number >= 1 && p.number <= 40) ? "1군" : null; });
        const senior = players.filter((p) => p.squad === "1군");

        club.seasons.push({
          file: snap.file, season: meta.season, exportedAt: null,
          club: null,
          squadApprox: true,
          players,

          staff: snap.people.filter((p) => !p._isPlayer && p._hasData)
            .map((p) => ({ name: [p.Pfna, p.Psna].filter(Boolean).join(" "), born: parse.decodeDate(p.Pdob) })),
          summary: Object.assign(stat(senior.length ? senior : players), {
            total: stat(players),
            first: stat(senior),
            u21: stat([]), u18: stat([]),
            injected: players.filter((p) => p.injected).length,

        });

    }
  }

  for (const h of saveHistory || []) {
    const club = clubs[h.archiveClub];
    const label = "save-history/" + h.archiveClub;
    if (!club) { skipped.push({ file: label, reason: "아카이브에 없는 구단이다" }); continue; }
    if (club.history) { skipped.push({ file: label, reason: "이 구단은 이미 연표가 있다" }); continue; }
    club.history = { savedAt: h.savedAt || null, clubNumber: h.club, seasons: h.seasons || [] };
  }

  for (const sq of saveSquads || []) {
    if (options.club && !String(sq.archiveClub).includes(options.club)) continue;
    const club = clubs[sq.archiveClub];
    const label = "save-squads/" + sq.archiveClub + "_" + sq.season;
    if (!club) { skipped.push({ file: label, reason: "아카이브에 없는 구단이다" }); continue; }

    if (club.seasons.some((s) => s.season === sq.season)) {
      skipped.push({ file: label, reason: "내보내기로 이미 있는 시즌이라 넣지 않았다" }); continue;
    }
    const players = (sq.squad || []).map(saveSquadPlayer);
    club.seasons.push({
      file: label, season: sq.season, exportedAt: null, club: null,
      fromSave: true, savedAt: sq.savedAt,
      players, staff: [],
      summary: Object.assign(stat(players), {
        total: stat(players),

        first: stat([]), u21: stat([]), u18: stat([]),
        injected: 0,
      }),
    });
  }

  for (const club of Object.values(clubs)) {
    club.seasons.sort((a, b) => String(a.season).localeCompare(String(b.season)));

    for (let i = club.seasons.length - 1; i >= 0; i--) {
      if (club.seasons[i].club && club.seasons[i].club.fullName) { club.meta = club.seasons[i].club; break; }
    }
    if (!club.meta) club.meta = {};

    const seen = {};
    for (const s of club.seasons) { seen[s.season] = (seen[s.season] || 0) + 1; }
    club.duplicateSeasons = Object.entries(seen).filter(([, n]) => n > 1).map(([s]) => s);
  }

  const bestByName = new Map();
  for (const s of rawSaves || []) {
    const prev = bestByName.get(s.name);
    if (!prev || s.modifiedMs > prev.modifiedMs) bestByName.set(s.name, s);
  }
  const saves = [...bestByName.values()].sort((a, b) => b.modifiedMs - a.modifiedMs);

  const saveClubs = new Set(saves.map((s) => s.club).filter(Boolean));
  for (const club of Object.values(clubs)) club.saveExists = saveClubs.has(club.name);

  const exportDays = new Set(entries.map((e) => new Date(e.mtime).toISOString().slice(0, 10)));
  const timeAxisReliable = entries.length < 4 || exportDays.size >= 3;

  const runs = timeAxisReliable ? detectRuns(entries) : groupByClub(entries);
  labelRuns(runs, saves);
  if (!timeAxisReliable) for (const r of runs) r.save = null;
  const playthroughs = runs.map((r, i) => toPlaythrough(r, i, timeAxisReliable));

  for (const club of Object.values(clubs)) {
    if (!club.fromBackup || !club.seasons.length) continue;
    const ss = club.seasons.map((x) => x.season).filter(Boolean).sort();
    playthroughs.push({
      id: "pt" + (playthroughs.length + 1),
      name: club.name, named: false, saveFile: null,
      confidence: "추정",
      note: "원본 내보내기 파일이 없어 백업에서 되살린 기록입니다",
      verify: { ok: 0, bad: 0, skip: 0 },
      span: { from: ss[0], to: ss[ss.length - 1] },
      exported: null, seasonCount: club.seasons.length, missing: [],
      journey: [{ club: club.name, from: ss[0], to: ss[ss.length - 1], seasons: ss }],
      files: club.seasons.map((x) => x.file),
    });
  }

  for (const club of Object.values(clubs)) {
    const mine = club.seasons.filter((x) => x.fromSave);
    if (!mine.length) continue;
    const cands = playthroughs.filter((p) => p.journey.some((j) => j.club === club.name));
    for (const s2 of mine) {

      const near = (p) => Math.min(Math.abs(+String(p.span.to).slice(0, 4) - +String(s2.season).slice(0, 4)),
                                   Math.abs(+String(p.span.from).slice(0, 4) - +String(s2.season).slice(0, 4)));
      let pt = null;
      for (const p of cands) if (!pt || near(p) < near(pt)) pt = p;
      if (!pt) { skipped.push({ file: s2.file, reason: "붙일 런을 찾지 못했다" }); continue; }
      pt.files.push(s2.file);
      pt.seasonCount = pt.files.length;
      if (String(s2.season) > String(pt.span.to)) pt.span.to = s2.season;
      if (String(s2.season) < String(pt.span.from)) pt.span.from = s2.season;
      const j = pt.journey.find((x) => x.club === club.name);
      if (j) {
        if (String(s2.season) > String(j.to)) j.to = s2.season;
        if (String(s2.season) < String(j.from)) j.from = s2.season;
        if (j.seasons && j.seasons.indexOf(s2.season) < 0) { j.seasons.push(s2.season); j.seasons.sort(); }
      }

      if (Array.isArray(pt.missing)) pt.missing = pt.missing.filter((m) => m !== s2.season);
    }
  }

  return {
    generatedAt: new Date().toISOString(),
    folder: folder || null,
    managers: [...managers],
    clubs: Object.values(clubs).sort((a, b) => b.seasons.length - a.seasons.length),
    playthroughs,
    timeAxisReliable,
    saves,
    skipped,
  };
}

module.exports = {
  configure, assemble,
  splitExportName, slimPlayer, readSeason, readClubMeta, saveHeaderInfo,
  stat, squadSummary,

  SAVE_ATTR_ORDER,

  detectRuns, groupByClub, labelRuns, joinedAgreement, toPlaythrough,
};

        t = { key: k, name: displayName(p), group: primaryGroup(p), first: i, last: i,
              seasons: [], joined: p.joined, peakCA: 0, clubs: [] };
        tenure.set(k, t);
      }
      t.last = i;
      t.seasons.push({ i, ca: p.ca });
      if (t.clubs.indexOf(s.clubName) < 0) t.clubs.push(s.clubName);
      if (p.ca > t.peakCA) { t.peakCA = p.ca; t.group = primaryGroup(p); }
    }
  });

  const flow = [];
  for (let i = 1; i < seasons.length; i++) {

    const nameWeak = !!(seasons[i].fromSave || seasons[i - 1].fromSave);
    const prev = new Set(seasons[i - 1].players.map(nameKey));
    const cur = new Set(seasons[i].players.map(nameKey));
    const inNames = seasons[i].players.filter((p) => !prev.has(nameKey(p)));
    const outNames = seasons[i - 1].players.filter((p) => !cur.has(nameKey(p)));
    flow.push({
      season: seasons[i].season,
      gap: timeline[i].gapBefore > 0,
      clubChange: timeline[i].clubChange,
      club: seasons[i].clubName,
      fromClub: seasons[i - 1].clubName,
      nameWeak,
      in: nameWeak ? 0 : inNames.length, out: nameWeak ? 0 : outNames.length,
      inTop: nameWeak ? [] : inNames.sort((a, b) => b.ca - a.ca).slice(0, 4).map((p) => displayName(p) + " " + p.ca),
      outTop: nameWeak ? [] : outNames.sort((a, b) => b.ca - a.ca).slice(0, 4).map((p) => displayName(p) + " " + p.ca),
    });
  }

  const journey = [];
  for (const s of seasons) {
    const meta = s.club || {};
    const last = journey[journey.length - 1];
    if (last && last.club === s.clubName && last.name === (meta.stadium || null)
        && last.capacity === (meta.capacity ?? null)) { last.to = s.season; continue; }
    journey.push({ club: s.clubName, name: meta.stadium || null,
                   capacity: meta.capacity ?? null, from: s.season, to: s.season });
  }

  const slim = seasons.map((s) => ({
    season: s.season,
    club: s.clubName,
    exportedAt: s.exportedAt,
    summary: s.summary,
    squadApprox: !!s.squadApprox,
    fromSave: !!s.fromSave,
    savedAt: s.savedAt || null,
    stadium: s.club ? s.club.stadium : null,
    staff: s.staff,

    players: s.players.map((p, i) => ({
      key: nameKey(p),
      uid: i,
      name: displayName(p),
      alt: p.name && p.localName && p.name !== p.localName ? p.name : null,
      full: p.fullName,
      no: p.number, ca: p.ca, pa: p.pa,
      h: p.height, w: p.weight, wage: p.wage,
      joined: p.joined, until: p.contractTo,
      sq: p.squad,
      grp: primaryGroup(p),
      pos: positionLabels(p),
      positions: p.positions,
      attrs: p.attrs,
      cApp: p.careerApp, cGoal: p.careerGoal, cAppAll: p.careerAppAll, cGoalAll: p.careerGoalAll,
      hist: p.attrHist,
    })),
  }));

  let meta = {};
  for (let i = seasons.length - 1; i >= 0; i--) {
    if (seasons[i].club && seasons[i].club.fullName) { meta = seasons[i].club; break; }
  }
  const lastClub = seasons[seasons.length - 1].clubName;

  return {
    save: {
      id: pt.id,
      name: pt.name,
      named: pt.named,
      confidence: pt.confidence,
      note: pt.note,
      manager: (seasons[0].clubRef && seasons[0].clubRef.manager) || null,
      lastClub,
      clubCount: pt.journey.length,
      missing: pt.missing,
      exported: pt.exported,
      meta,
      fromBackup: !!(seasons[0].clubRef && seasons[0].clubRef.fromBackup),
    },
    timeline,
    journey,
    seasons: slim,
    flow,
    tenure: [...tenure.values()].sort((a, b) => (b.last - b.first) - (a.last - a.first) || b.peakCA - a.peakCA),

    playthroughs: (data.playthroughs || []).slice()
      .sort((a, b) => recency(b).localeCompare(recency(a)) || b.seasonCount - a.seasonCount)
      .map((p) => ({
        id: p.id, name: p.name, named: p.named, confidence: p.confidence,
        seasons: p.seasonCount, from: p.span.from, to: p.span.to,
        clubs: p.journey.map((j) => j.club),
        exportedTo: p.exported ? p.exported.to : null,
        current: p.id === pt.id,
      })),
    saves: data.saves.map((s) => ({ name: s.name, club: s.club, modified: s.modified, sizeMB: s.sizeMB, version: s.version })),
    dict: {
      positions: tags.POSITION_ORDER.map((t) => ({ tag: t, label: tags.POSITION[t].label })),
      attrs: Object.entries(Object.assign({}, tags.ATTRIBUTE, tags.HIDDEN)).map(([tag, e]) => ({
        tag, label: e.label, group: e.group || "숨은 값", sure: e.confidence === tags.C.CONFIRMED,
      })),
      rankable: tags.RANKABLE,
    },
    generatedAt: data.generatedAt,
  };
}

  }).join("");

  // 구단이 바뀐 지점을 곡선 위 "띠"로 그린다.
  //   글자를 곡선 위에 얹으면 구단이 11개인 세이브에서 서로 겹쳐 읽을 수가 없다.
  //   띠는 각 구간이 제 폭을 가지므로 겹칠 수가 없고, 좁으면 이름만 생략하면 된다.
  var moves = "", band = "";
  if (BAND) {
    var half = (W-L-R)/Math.max(1,S.length-1)/2;
    var segs = [], cur = null;
    S.forEach(function(s,i){
      if (cur && cur.club === s.club) { cur.last = i; return; }
      cur = { club: s.club, first: i, last: i }; segs.push(cur);
    });
    segs.forEach(function(g,k){
      var x0 = Math.max(L, xs(g.first) - half), x1 = Math.min(W-R, xs(g.last) + half);
      var w = x1 - x0;
      band += '<rect x="'+x0.toFixed(1)+'" y="0" width="'+w.toFixed(1)+'" height="20" rx="4" '+
        'fill="'+(k%2 ? "var(--sunken)" : "var(--surface-2)")+'"/>';
      // 이름이 안 들어가는 좁은 구간은 비워 둔다. 잘린 글자보다 빈 칸이 낫다(툴팁에 나온다).
      if (w > 46) {
        band += '<text x="'+((x0+x1)/2).toFixed(1)+'" y="14" text-anchor="middle" class="axl" '+
          'style="fill:var(--ink-2);font-weight:600">'+esc(shorten(g.club, Math.floor(w/11)))+'</text>';
      }
      if (k) moves += '<line x1="'+x0.toFixed(1)+'" x2="'+x0.toFixed(1)+'" y1="'+T+'" y2="'+(H-B)+'" '+
        'stroke="var(--line-strong)" stroke-width="1" stroke-dasharray="3 3"/>';
    });
  }
  var lastP = pts[pts.length-1];
  var ann = ""; var _unusedAnn = '<text x="'+(xs(lastP.i)-6)+'" y="'+(ys(lastP.v.avgCA)-12)+'" text-anchor="end" '+
    'style="font-size:12px;font-weight:650;fill:var(--s1)">평균 '+lastP.v.avgCA+'</text>';

  // 툴팁을 위한 투명 히트존 + 세로 기준선
  var hit = S.map(function(s,i){
    var w = (W-L-R)/Math.max(1,S.length-1);
    return '<rect class="hz" data-i="'+i+'" x="'+(xs(i)-w/2).toFixed(1)+'" y="'+T+'" width="'+w.toFixed(1)+
      '" height="'+(H-T-B)+'" fill="transparent"/>';
  }).join("");

  $("#growth").innerHTML =
    '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="시즌별 평균·최고 능력 추이">'+
    '<style>.axl{font-family:"IBM Plex Mono",monospace;font-size:10px;fill:var(--ink-3)}</style>'+
    '<g class="grid" stroke="var(--line)">'+g+'</g>'+
    '<line id="ghair" x1="0" x2="0" y1="'+T+'" y2="'+(H-B)+'" stroke="var(--line-strong)" stroke-width="1" opacity="0"/>'+
    band + moves + mk("maxCA","var(--s2)") + mk("avgCA","var(--s1)") + xlab + ann + hit +
    '</svg>';

  $("#growthDelta").textContent = pts[0].v.avgCA + " → " + lastP.v.avgCA;

  // 호버 툴팁 — tip 은 차트 바깥에 있어 다시 그려도 살아남는다
  var tip = $("#gtip"), hair = $("#ghair"), host = $("#growth");
  $$("#growth .hz").forEach(function(r){
    r.onmouseenter = function(){
      var i = +r.getAttribute("data-i"), s = S[i], v = stat(s);
      if (!v || v.avgCA == null) return;
      hair.setAttribute("x1", xs(i)); hair.setAttribute("x2", xs(i)); hair.setAttribute("opacity","1");
      tip.innerHTML = '<b>'+s.season+'</b>'+
        '<span>평균 <em>'+v.avgCA+'</em></span>'+
        '<span>최고 <em>'+v.maxCA+'</em></span>'+
        '<span>인원 <em>'+v.squad+'</em>명</span>'+
        '<span class="tipsub">'+esc(s.club)+(s.stadium ? " · "+esc(s.stadium) : "")+'</span>';
      tip.hidden = false;
      var box = host.getBoundingClientRect();
      tip.style.left = Math.min(box.width-180, Math.max(0, xs(i)/W*box.width - 80)) + "px";
    };
  });
  // onmouseleave 로 대입하면 다시 그려도 리스너가 겹치지 않는다
  host.onmouseleave = function(){ tip.hidden = true; hair.setAttribute("opacity","0"); };
}

function growthTabs(){
  $$("#growthScope .tab").forEach(function(b){
    b.setAttribute("aria-pressed", b.getAttribute("data-k") === growthScope);
    b.onclick = function(){ growthScope = b.getAttribute("data-k"); growthTabs(); growth(); };
  });
}

/* ── 재직 간트 ── */
function gantt(){
  var S = D.seasons, N = S.length;
  var rows = D.tenure.filter(function(t){ return t.last - t.first >= 1; }).slice(0, 26);
  var col = { GK:"var(--s1)", DF:"var(--s3)", MF:"var(--s4)", FW:"var(--s2)", "—":"var(--ink-3)" };
  var html = rows.map(function(t){
    var left = t.first/N*100, width = (t.last-t.first+1)/N*100;
    return '<div class="gname" data-key="'+esc(t.key)+'" role="button" tabindex="0">'+esc(t.name)+'</div>'+
      '<div class="track"><div class="span" style="left:'+left.toFixed(2)+'%;width:'+width.toFixed(2)+'%;background:'+col[t.group]+'" title="'+esc(t.name)+' · '+S[t.first].season+'~'+S[t.last].season+'"></div></div>'+
      '<div class="gyr">'+(t.last-t.first+1)+'시즌</div>';
  }).join("");
  $("#gantt").innerHTML = html;
  $("#gticks").innerHTML = S.map(function(s){ return "<span>"+s.season.slice(2,5)+"</span>"; }).join("");
  $$("#gantt .gname").forEach(function(el){
    var open = function(){ openByKey(el.getAttribute("data-key")); };
    el.addEventListener("click", open);
    el.addEventListener("keydown", function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); open(); } });
  });
}

/* ── 이적 흐름 ── */
function flow(){
  // 구단 이동 줄은 최댓값 계산에서 뺀다. 스쿼드 전체가 바뀐 값이라
  // 그걸 기준으로 삼으면 진짜 이적이 있었던 해의 막대가 전부 눌려 보인다.
  var normal = D.flow.filter(function(f){ return !f.clubChange; });
  var max = Math.max.apply(null, (normal.length ? normal : D.flow)
    .map(function(f){ return Math.max(f.in, f.out); })) || 1;
  $("#flow").innerHTML = D.flow.map(function(f){
    var w = function(n){ return Math.min(100, n/max*100).toFixed(1)+"%"; };
    return '<div class="flowrow'+(f.clubChange ? " moved" : "")+'">'+
      '<div class="num" style="font-size:12px;color:var(--ink-2)">'+f.season+
      (f.clubChange ? '<div class="muted" style="font-size:10.5px">'+esc(f.club)+' 부임</div>'
        : f.gap ? '<div class="muted" style="font-size:10.5px">공백 후</div>' : '')+'</div>'+
      '<div class="flowbars">'+
        '<div class="fb"><span class="num" style="width:26px;color:var(--s1)">+'+f.in+'</span>'+
          '<span class="fbar" style="width:'+w(f.in)+';background:var(--s1)"></span>'+
          '<span class="flist">'+esc(f.inTop.join(" · "))+'</span></div>'+
        '<div class="fb"><span class="num" style="width:26px;color:var(--s2)">-'+f.out+'</span>'+
          '<span class="fbar" style="width:'+w(f.out)+';background:var(--s2)"></span>'+
          '<span class="flist">'+esc(f.outTop.join(" · "))+'</span></div>'+
        (f.clubChange ? '<div class="movenote">'+esc(f.fromClub)+' → '+esc(f.club)+
          ' · 구단을 옮긴 해라 스쿼드가 통째로 바뀝니다. 이적이 아닙니다.</div>' : '')+
        (f.nameWeak ? '<div class="movenote">세이브에서 뽑은 시즌이 끼어 있습니다. 그 시즌은 이름이 성(姓)뿐이라 영입·방출을 셀 수 없습니다.</div>' : '')+
      '</div></div>';
  }).join("");
}

var seasonIdx = D.seasons.length - 1;
var rankKey = "PCAB";

function seasonTabs(){
  $("#seasonTabs").innerHTML = D.seasons.map(function(s,i){

  }).join("");

  });

/* ── 포지션 뎁스 히트맵 ── */
function depth(){
  var S = D.seasons, P = D.dict.positions;
  var counts = S.map(function(s){
    return P.map(function(p){ return s.players.filter(function(pl){ return (pl.positions[p.tag]||0) >= 15; }).length; });
  });
  /* ⚠ 색 진하기의 기준(max)은 **내보내기 시즌에서만** 잡는다.
   *   세이브 시즌은 스쿼드가 유스까지 다 들어 있어 인원이 두 배 넘는다(74명 vs 166명).
   *   그 값이 max 가 되면 내보내기 열 전체가 옅어져 **없던 변화가 보인다.**
   *   세이브 열은 기준을 넘으면 가장 진한 칸으로 눌러 담는다. */
  var exIdx = S.map(function(s,i){ return s.fromSave ? -1 : i; }).filter(function(i){ return i >= 0; });
  var base = exIdx.length ? exIdx : S.map(function(_,i){ return i; });
  var max = Math.max.apply(null, base.map(function(i){ return Math.max.apply(null, counts[i]); })) || 1;
  var hasSave = S.some(function(s){ return s.fromSave; });
  var ramp = ["#cde2fb","#9ec5f4","#6da7ec","#3987e5","#256abf","#184f95"];
  var head = "<tr><th>포지션</th>" + S.map(function(s,i){
    /* 세이브에서 뽑은 열에는 ˢ 를 붙인다. 숨기지 않고 밝힌다(위 주석 참고). */
    return '<th style="text-align:right'+(i===seasonIdx?';color:var(--accent)':'')+'"'+
      (s.fromSave?' title="세이브에서 뽑은 시즌 — 유스까지 다 들어 있어 인원이 다르다"':'')+'>'+
      s.season.slice(2)+(s.fromSave?'<span style="color:var(--ink-3)">ˢ</span>':'')+"</th>"; }).join("") + "</tr>";
  var body = P.map(function(p, pi){
    return "<tr><td>"+esc(p.label)+"</td>" + S.map(function(s, si){
      var n = counts[si][pi];
      var step = n === 0 ? -1 : Math.min(ramp.length-1, Math.floor(n/max*ramp.length));
      var bg = step < 0 ? "transparent" : ramp[step];
      var fg = step >= 3 ? "#fff" : "var(--ink)";
      return '<td class="n"><span class="cell" style="background:'+bg+';color:'+(step<0?"var(--ink-3)":fg)+'">'+(n||"·")+"</span></td>";
    }).join("") + "</tr>";
  }).join("");
  /* 세이브 열은 인원 자체가 달라서 옆 열과 견줄 수 없다. 표 밑에 그렇다고 적는다. */
  var note = hasSave ? '<div class="movenote">ˢ 는 세이브에서 뽑은 시즌입니다. '+
    '내보내기는 등록 선수만 담기지만 세이브는 유스까지 전부 담겨 인원이 두 배 넘습니다. '+
    '그 열의 숫자는 옆 시즌과 나란히 견줄 수 없습니다.</div>' : '';
  $("#depth").innerHTML = "<table>"+head+body+"</table>"+note;
}

/* ── 계약 만료 ── */
function contracts(){
  var s = D.seasons[seasonIdx];
  var byYear = {};
  s.players.forEach(function(p){ if(!p.until) return; var y = p.until.slice(0,4); byYear[y] = (byYear[y]||0)+1; });
  var years = Object.keys(byYear).sort();
  if (!years.length){ $("#contracts").innerHTML = '<p class="muted">계약 정보가 없습니다.</p>'; return; }
  var max = Math.max.apply(null, years.map(function(y){ return byYear[y]; }));
  $("#contracts").innerHTML = '<div style="display:flex;flex-direction:column;gap:7px">' +
    years.map(function(y){
      var n = byYear[y], cliff = n / s.players.length >= 0.3;
      return '<div style="display:grid;grid-template-columns:52px 1fr 34px;gap:10px;align-items:center;font-size:12.5px">'+
        '<span class="num" style="color:var(--ink-2)">'+y+'</span>'+
        '<span style="height:11px;border-radius:4px;background:'+(cliff?"var(--s2)":"var(--s1)")+';width:'+(n/max*100).toFixed(1)+'%"></span>'+
        '<span class="num" style="text-align:right'+(cliff?';color:var(--s2);font-weight:600':'')+'">'+n+'</span></div>';
    }).join("") + "</div>";
  var worst = years.reduce(function(a,b){ return byYear[b] > byYear[a] ? b : a; });
  $("#cliffNote").textContent = worst + "년에 " + byYear[worst] + "명이 한꺼번에 끝납니다 (스쿼드 " + s.players.length + "명 중).";
}

/* ── TOP 3 ── */
function podium(){
  var s = D.seasons[seasonIdx];
  var gkOnly = D.dict.rankable["골키퍼"].indexOf(rankKey) >= 0;
  var pool = s.players.filter(function(p){
    var isGK = (p.positions.Pgoa||0) >= 15;
    return gkOnly ? isGK : !isGK;
  });
  var val = function(p){ return rankKey === "PCAB" ? p.ca : rankKey === "PPAB" ? p.pa : (p.attrs[rankKey] || 0); };
  var top = pool.filter(function(p){ return val(p) > 0; }).sort(function(a,b){ return val(b)-val(a); }).slice(0,3);
  var raw = rankKey === "PCAB" || rankKey === "PPAB";
  var meta = byTag[rankKey];
  $("#podiumLabel").textContent = raw ? (rankKey === "PCAB" ? "현재 능력" : "잠재 능력")
    : (meta ? meta.label + (meta.sure ? "" : "?") : rankKey);
  $("#podium").innerHTML = top.map(function(p,i){
    return '<button class="pcard" data-key="'+esc(p.key)+'" data-uid="'+p.uid+'" data-season="'+seasonIdx+'">'+
      '<div class="rank">'+(i+1)+'위</div>'+
      '<div class="pn">'+esc(p.name)+'</div>'+
      '<div class="pm">'+esc(p.pos.join(" · ") || "—")+' · '+(p.h||"?")+'cm</div>'+
      '<div class="pv">'+(raw ? val(p) : sc(val(p)))+'</div></button>';
  }).join("") || '<p class="muted">해당 조건의 선수가 없습니다.</p>';
  $$("#podium .pcard").forEach(function(b){
    b.addEventListener("click", function(){
      openByKey(b.getAttribute("data-key"), +b.getAttribute("data-season"), +b.getAttribute("data-uid")); });
  });
}

function rankTabs(){
  var groups = D.dict.rankable, html = "";
  Object.keys(groups).forEach(function(g){
    groups[g].forEach(function(t){
      var m = byTag[t];
      var label = t === "PCAB" ? "CA" : t === "PPAB" ? "PA" : (m ? m.label + (m.sure ? "" : "?") : t);
      html += '<button class="tab" data-k="'+t+'" aria-pressed="'+(t===rankKey)+'">'+esc(label)+'</button>';
    });
  });
  $("#rankTabs").innerHTML = html;
  $$("#rankTabs .tab").forEach(function(b){
    b.addEventListener("click", function(){ rankKey = b.getAttribute("data-k"); rankTabs(); podium(); });
  });
}

/* ── 선수 카드 ── */
/* uid 를 주면 **그 선수**를 연다. 안 주면 예전처럼 이름표로 찾는다(재직 기간 쪽은 이름표뿐이다).
 * 이름표로 찾으면 동명이인 중 첫 사람이 열린다 — 그래서 포디움은 uid 를 준다. */
function openByKey(key, si, uid){
  var idx = si == null ? seasonIdx : si;
  var p = (uid != null && !isNaN(uid)) ? D.seasons[idx].players[uid] : null;
  if (p && key && p.key !== key) p = null;            // 시즌이 바뀌어 번호가 어긋나면 버린다
  if (!p) p = D.seasons[idx].players.filter(function(x){ return x.key === key; })[0];
  if (!p){
    for (var i = D.seasons.length-1; i >= 0; i--){
      var f = D.seasons[i].players.filter(function(x){ return x.key === key; })[0];
      if (f){ p = f; idx = i; break; }
    }
  }
  if (!p) return;

  var hist = [];
  D.seasons.forEach(function(s,i){
    var m = s.players.filter(function(x){ return x.key === key; })[0];
    if (m) hist.push({ i: i, season: s.season, ca: m.ca });
  });

  var spark = "";
  if (hist.length > 1){
    var W = 300, H = 56, lo = Math.min.apply(null, hist.map(function(h){ return h.ca; }));
    var hi = Math.max.apply(null, hist.map(function(h){ return h.ca; }));
    var pad = Math.max(4, (hi-lo)*0.15);
    var xs = function(k){ return 4 + k*(W-8)/(hist.length-1); };
    var ys = function(v){ return H-6 - (v-(lo-pad))/((hi+pad)-(lo-pad))*(H-14); };
    var d = hist.map(function(h,k){ return (k?"L":"M")+xs(k).toFixed(1)+" "+ys(h.ca).toFixed(1); }).join(" ");
    spark = '<div class="agroup"><h4>이 구단에서의 현재 능력 추이 &middot; '+hist[0].season+' ~ '+hist[hist.length-1].season+'</h4>'+
      '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="width:100%;height:'+H+'px" role="img" aria-label="시즌별 능력 추이">'+
      '<path d="'+d+'" fill="none" stroke="var(--s1)" stroke-width="2" vector-effect="non-scaling-stroke"/>'+
      hist.map(function(h,k){ return '<circle cx="'+xs(k).toFixed(1)+'" cy="'+ys(h.ca).toFixed(1)+'" r="3" fill="var(--s1)"/>'; }).join("")+
      '</svg><div class="num" style="font-size:11px;color:var(--ink-3);display:flex;justify-content:space-between">'+
      '<span>'+hist[0].ca+'</span><span>'+hist[hist.length-1].ca+'</span></div></div>';
  }

  /* 월별 능력치 곡선 (NOTES 4-26 ⑲).
   * 세이브에서 뽑은 시즌의 **일부 선수만** 갖고 있다 — 우리가 키운 어린 선수 위주다.
   * 한 점이 한 달이고, 마지막 점이 그 세이브 시점이다.
   * ⚠ 골키퍼 11칸은 필드 선수에게 5·10·15 로 박혀 있어 평균에서 뺐다(squad.js 에서 묶음별로 나눠 담는다). */
  var hspark = "";
  if (p.hist && p.hist.tech && p.hist.tech.length > 5){
    var HH = p.hist, n = HH.tech.length, W2 = 260, H2 = 56;
    var series = [["기술", HH.tech, "var(--s1)"], ["정신", HH.ment, "var(--s2)"], ["신체", HH.phys, "var(--s3)"]];
    var all = HH.tech.concat(HH.ment, HH.phys);
    var lo2 = Math.min.apply(null, all), hi2 = Math.max.apply(null, all);
    if (hi2 - lo2 < 8){ var mid = (hi2+lo2)/2; lo2 = mid-4; hi2 = mid+4; }   // 평평한 선수는 눈금을 벌려 준다
    var pad2 = (hi2-lo2)*0.15;
    var X = function(k){ return 4 + k*(W2-8)/(n-1); };
    var Y = function(v){ return H2-6 - (v-(lo2-pad2))/((hi2+pad2)-(lo2-pad2))*(H2-14); };
    var to = (function(){ var f = HH.from.split("-"); var d = new Date(Date.UTC(+f[0], +f[1]-1+n-1, 1));
      return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0"); })();
    hspark = '<div class="agroup"><h4>능력치가 자란 길 &middot; '+esc(HH.from)+' ~ '+esc(to)+' &middot; '+n+'개월</h4>'+
      '<svg viewBox="0 0 '+W2+' '+H2+'" preserveAspectRatio="none" style="width:100%;height:'+H2+'px" role="img" aria-label="월별 능력치 추이">'+
      series.map(function(s){
        var d = s[1].map(function(v,k){ return (k?"L":"M")+X(k).toFixed(1)+" "+Y(v).toFixed(1); }).join(" ");
        return '<path d="'+d+'" fill="none" stroke="'+s[2]+'" stroke-width="1.6" vector-effect="non-scaling-stroke"/>';
      }).join("")+'</svg>'+
      '<div class="num" style="font-size:11px;color:var(--ink-3);display:flex;gap:10px;flex-wrap:wrap">'+
      series.map(function(s){ return '<span><span style="color:'+s[2]+'">&#9632;</span> '+s[0]+' '+s[1][0]+' &rarr; '+s[1][n-1]+'</span>'; }).join("")+

<script>
"use strict";

const REG = {};
const norm = (p) => p.replace(/^\.\//, "");

async function loadModule(file) {
  const m = window.__REG[norm(file)];
  if (!m) throw new Error("모듈을 못 찾음: " + file);
  REG[file] = m;
  return m;
}

let core = null, platform = null, render = null;

const SAVE_FILES = new Map();
let DATA = null;

async function boot() {
  await loadModule("tags.js");
  await loadModule("parse.js");
  const web = await loadModule("platform-web.js");
  core = await loadModule("core.js");
  render = await loadModule("render.js");
  platform = web.makePlatform(window.fzstd);
  core.configure(platform);
  return core;
}

const HEAD_BYTES = 300000;

const LOOKS_LIKE_EXPORT = /\d{4}-\d{2}/;

function classify(files) {
  const fmf = [], fm = [], loose = [], looseFm = [];
  for (const f of files) {

    const p = "/" + (f.webkitRelativePath || f.name).replace(/\\/g, "/").toLowerCase();
    if (p.endsWith(".fmf")) {
      if (p.indexOf("/exported teams/") >= 0) fmf.push(f);
      else if (LOOKS_LIKE_EXPORT.test(f.name)) loose.push(f);
    } else if (p.endsWith(".fm")) {
      if (p.indexOf("/games/") >= 0) fm.push(f);
      else looseFm.push(f);
    }
  }

  if (!fmf.length) fmf.push.apply(fmf, loose);
  if (!fm.length) fm.push.apply(fm, looseFm);
  return { fmf, fm };
}

async function run(files, onProgress) {
  const { fmf, fm } = classify(files);
  if (!fmf.length) {

    const sample = files.slice(0, 3)
      .map((f) => f.webkitRelativePath || f.name).join(" / ") || "(파일 없음)";
    throw new Error(
      "내보낸 팀 파일(.fmf)을 찾지 못했습니다. 파일 " + files.length + "개를 훑었습니다.\n" +
      "예: " + sample + "\n" +
      "Football Manager 20xx 폴더나 그 안의 'exported teams' 폴더를 골라 주세요.");
  }

  const entries = [], skipped = [], managers = new Set();
  const total = fmf.length + fm.length;
  let done = 0;

  for (const f of fmf) {
    const meta = core.splitExportName(f.name);
    if (meta.manager) managers.add(meta.manager);
  }

  const AHEAD = 8;
  const readAhead = (list, slice) => {
    const q = new Map();
    const prime = (i) => {
      if (i < list.length && !q.has(i)) {
        const f = list[i];
        q.set(i, (slice ? f.slice(0, slice) : f).arrayBuffer());
      }
    };
    for (let i = 0; i < AHEAD; i++) prime(i);
    return { take: async (i) => { prime(i + AHEAD); const p = q.get(i); q.delete(i); return p; } };
  };

  const fmfQueue = readAhead(fmf, 0);
  for (let i = 0; i < fmf.length; i++) {
    const f = fmf[i];
    onProgress(done, total, f.name);
    const meta = core.splitExportName(f.name);
    try {
      const bytes = platform.from(new Uint8Array(await fmfQueue.take(i)));
      entries.push({
        file: f.name, club: meta.club, manager: meta.manager, season: meta.season,
        mtime: new Date(f.lastModified),
        data: core.readSeason(bytes, f.name, f.lastModified),
      });
    } catch (e) {
      skipped.push({ file: f.name, reason: e.message });
    }
    done++;
  }

  const fmQueue = readAhead(fm, HEAD_BYTES);
  const saves = [];
  for (let i = 0; i < fm.length; i++) {
    const f = fm[i];
    onProgress(done, total, f.name);
    const info = {
      file: f.name,
      name: f.name.replace(/\.fm$/i, "").replace(/ \(v\d+\)$/, ""),
      sizeMB: Math.round(f.size / 1048576),
      modified: new Date(f.lastModified).toISOString().slice(0, 10),
      modifiedMs: f.lastModified,
      manager: null, club: null, nation: null, version: null,
    };
    try {
      const head = platform.from(new Uint8Array(await fmQueue.take(i)));
      Object.assign(info, core.saveHeaderInfo(head, [...managers], platform));
    } catch (e) { info.error = e.message; }
    saves.push(info);
    SAVE_FILES.set(info.file, f);
    done++;
  }

  return core.assemble({ entries, saves, backup: null, options: {}, folder: null, skipped });
}

const $ = (id) => document.getElementById(id);

  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    });
  });

  DATA = data;
  window.__data = data;
  deepPanel();
}

const WANT_DIR = /^(exported teams|games)$/i;

    if (!WANT_FILE.test(entry.name)) return;
    const f = await new Promise((res, rej) => entry.file(res, rej));
    out.push(setPath(f, prefix + entry.name));
    onScan(out.length);
    return;
  }
  if (!entry.isDirectory) return;
  const mode = takeAll ? "take" : decideDir(entry.name, depth);
  if (mode === "skip") return;

  const reader = entry.createReader();
  let batch;
  do {
    batch = await new Promise((res, rej) => reader.readEntries(res, rej));
    for (const e of batch) {
      await walkEntry(e, out, prefix + entry.name + "/", depth + 1, mode === "take", onScan);
    }
  } while (batch.length);
}

async function walkHandle(dir, out, prefix, depth, takeAll, onScan) {
  const mode = takeAll ? "take" : decideDir(dir.name, depth);
  if (mode === "skip") return;
  for await (const [name, h] of dir.entries()) {
    if (h.kind === "file") {
      if (!WANT_FILE.test(name)) continue;
      out.push(setPath(await h.getFile(), prefix + name));
      onScan(out.length);
    } else {
      await walkHandle(h, out, prefix + name + "/", depth + 1, mode === "take", onScan);
    }
  }
}

window.addEventListener("DOMContentLoaded", async () => {
  try {
    await boot();
    $("boot").hidden = true;
    $("drop").hidden = false;
    $("pick").hidden = false;

    window.__fm = { run: run, handle: handle, core: function () { return core; },
                    platform: function () { return platform; },
                    walkHandle: walkHandle, walkEntry: walkEntry, decideDir: decideDir };
  } catch (e) {
    $("boot").textContent = "불러오기 실패: " + e.message;
    console.error(e);
    return;
  }

  const scanning = (n) => {
    $("pick").hidden = true;
    $("progress").hidden = false;
    $("bar").style.width = "0%";
    $("ptext").textContent = "폴더를 훑는 중… 찾은 파일 " + n + "개";
  };

  async function collect(fn) {
    const out = [];
    scanning(0);
    try {
      await fn(out, scanning);
    } catch (e) {
      $("progress").hidden = true; $("pick").hidden = false;
      $("error").hidden = false; $("error").textContent = e.message;
      console.error(e); return;
    }
    handle(out);
  }

  const canPick = typeof window.showDirectoryPicker === "function";
  $("pickBtn").addEventListener("click", async () => {
    if (!canPick) { $("folder").click(); return; }
    let dir;
    try { dir = await window.showDirectoryPicker({ mode: "read" }); }
    catch (e) { return; }
    collect((out, onScan) => walkHandle(dir, out, "", 0, false, onScan));
  });
  $("folder").addEventListener("change", (e) => handle([].slice.call(e.target.files)));
  $("backBtn").addEventListener("click", closeArchive);

  window.addEventListener("popstate", function () { if (!$("archive").hidden) showList(); });
  window.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !$("archive").hidden) closeArchive();
  });
  if (!canPick) $("slowNote").hidden = false;

  const zone = $("drop");
  zone.addEventListener("dragover", (e) => { e.preventDefault(); zone.classList.add("over"); });
  zone.addEventListener("dragleave", () => zone.classList.remove("over"));
  zone.addEventListener("drop", (e) => {
    e.preventDefault();
    zone.classList.remove("over");
    const items = [].slice.call(e.dataTransfer.items)
      .map((i) => (i.webkitGetAsEntry ? i.webkitGetAsEntry() : null)).filter(Boolean);
    collect(async (out, onScan) => {
      for (const it of items) await walkEntry(it, out, "", 0, false, onScan);
    });
  });
});

const DEEP_NEED = ["person_record_manager", "player_stats_hist_dt", "tc_league_history_dt", "tc_cup_history_dt"];

async function deepRead(file, say) {
  const parse = REG["parse.js"], Bytes = REG["platform-web.js"].Bytes;
  if (!window.NodeRun) throw new Error("깊이 읽기 부분이 안 실려 있다 (한 장으로 묶은 판에서만 된다)");
  NodeRun.clear();
  NodeRun.setBytes(Bytes);

  say("목록 읽는 중 — 파일 꼬리 4MB");
  const TAIL = 4 * 1024 * 1024;
  const tail = platform.from(new Uint8Array(await file.slice(Math.max(0, file.size - TAIL)).arrayBuffer()));
  const idx = parse.readIndexFromTail(tail, file.name);

  let got = 0, mb = 0;
  for (const name of DEEP_NEED) {
    const e = idx.entries.find((x) => x.name === name);
    if (!e) continue;
    say("읽는 중 " + name + " — " + (e.stored / 1048576).toFixed(0) + "MB");
    const at = idx.dataStart + e.offset;
    const raw = platform.from(new Uint8Array(await file.slice(at, at + e.stored).arrayBuffer()));
    const out = platform.zstdDecompress(raw);
    NodeRun.put("/save/" + name + "." + e.ext.replace(/^\./, ""), out);
    got++; mb += out.length / 1048576;
  }
  if (got < DEEP_NEED.length) throw new Error("세이브에 필요한 구획이 없다 (" + got + "/" + DEEP_NEED.length + ")");

  const gdb = idx.entries.find((x) => x.name === "game_db");
  if (gdb) {
    const at = idx.dataStart + gdb.offset;
    const head = platform.from(new Uint8Array(await file.slice(at, at + Math.min(gdb.stored, 1 << 20)).arrayBuffer()));
    try { NodeRun.put("/save/game_db.dat", platform.zstdDecompress(head).slice(0, 64)); } catch (e) {}
  }

  say("감독 기록 읽는 중");
  const mgr = NodeRun.run("manager.js", ["/save/person_record_manager.dat"]);
  if (mgr.error) throw mgr.error;
  const teams = (mgr.exports && mgr.exports.teams) || [];
  if (!teams.length) throw new Error("감독 기록에서 구단 번호를 못 찾았다");

  const out = [];
  for (const t of teams.slice(0, 5)) {
    if (t.n < 3) continue;
    say("시즌 짜는 중 — 구단 " + t.team);
    const r = NodeRun.run("season.js", ["/save", String(t.team), "/out.json"]);
    if (r.error) { out.push({ team: t.team, error: r.error.message }); continue; }
    const v = r.files.get("/out.json");
    out.push(Object.assign({ team: t.team, records: t.n },
      JSON.parse(typeof v === "string" ? v : new TextDecoder().decode(v))));
  }
  NodeRun.clear();
  return { teams: teams, clubs: out, mb: Math.round(mb), byYear: (mgr.exports && mgr.exports.byYear) || [] };
}

function deepRender(res) {
  const DIV = { 7: "1부", 8: "2부", 9: "3부", 10: "4부", 150: "내셔널" };
  const parts = res.clubs.map((c) => {
    if (c.error) return '<p class="note">구단 ' + c.team + " — " + esc(c.error) + "</p>";
    const rows = (c.seasons || []).slice().reverse().map((s) => {
      const st = s.standing;
      const cups = (s.cups || []).filter((x) => x.teams === 2 && x.result === "우승").length;
      return "<tr><td>" + esc(s.season) + "</td><td>" + (DIV[s.division] || "디비전 " + s.division) + "</td>" +
        (st ? "<td><b>" + st.pos + "위</b> / " + st.teams + "</td><td>" + st.w + "-" + st.d + "-" + st.l +
              "</td><td>" + st.gf + ":" + st.ga + "</td><td>" + st.pts + "점</td>"
            : '<td colspan="4" class="dim">' + esc(s.why || "순위 없음") + "</td>") +
        "<td>" + (cups ? "🏆 " + cups : "") + "</td></tr>";
    }).join("");
    return "<h4>구단 번호 " + c.team + " <small>시즌 " + (c.seasons || []).length +
      " · 세이브 시점 " + (c.savedAt || "모름") + "</small></h4>" +
      '<div class="tblwrap"><table class="deept"><thead><tr><th>시즌</th><th>리그</th><th>순위</th><th>승-무-패</th><th>득:실</th><th>승점</th><th>컵</th></tr></thead><tbody>' +
      rows + "</tbody></table></div>";
  }).join("");
  return '<div class="deepbox"><h3>세이브에서 읽은 것 <small>' + res.mb + "MB 만 떠왔습니다</small></h3>" +
    parts + '<p class="note">구단 이름과 선수 이름은 아직 안 붙었습니다 — 그건 game_db(232MB) 가 필요합니다.</p></div>';
}

function deepPanel() {
  const box = $("deep");
  if (!box) return;
  if (!SAVE_FILES.size || !window.NodeRun) { box.innerHTML = ""; return; }
  box.innerHTML = '<div class="deepbox"><h3>세이브 깊이 읽기</h3>' +
    '<p class="note">내보내기가 없어도 세이브만으로 시즌·순위·컵을 읽습니다. 필요한 부분만 떠오므로 파일 전체를 열지 않습니다.</p>' +
    [...SAVE_FILES.keys()].map((n, i) =>
      '<button type="button" class="deepbtn" data-i="' + i + '">' + esc(n) + " 읽기</button>").join(" ") +
    '<div id="deeplog" class="note"></div><div id="deepout"></div></div>';
  const names = [...SAVE_FILES.keys()];
  box.querySelectorAll(".deepbtn").forEach(function (b) {
    b.addEventListener("click", async function () {
      const f = SAVE_FILES.get(names[Number(b.getAttribute("data-i"))]);
      const log = $("deeplog"), outEl = $("deepout");
      outEl.innerHTML = "";
      box.querySelectorAll(".deepbtn").forEach((x) => { x.disabled = true; });
      const t0 = Date.now();
      try {
        const res = await deepRead(f, (m) => { log.textContent = m; });
        log.textContent = ((Date.now() - t0) / 1000).toFixed(1) + "초 걸렸습니다";
        outEl.innerHTML = deepRender(res);
      } catch (e) {
        log.textContent = "읽지 못했습니다: " + e.message;
        console.error(e);
      }
      box.querySelectorAll(".deepbtn").forEach((x) => { x.disabled = false; });
    });
  });
}
