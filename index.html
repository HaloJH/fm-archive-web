const path = require("path");

const seasonStr = (y) => y + "-" + String((y + 1) % 100).padStart(2, "0");

const DIV = { 7: "프리미어 리그", 8: "챔피언십", 9: "리그 1", 10: "리그 2",
  150: "내셔널 리그", 195: "내셔널 리그 노스", 196: "내셔널 리그 사우스" };

function part(label, fn, note) {
  try {
    const t = Date.now();
    const msg = fn();
    note.ok.push(label + (msg ? " — " + msg : "") + "  (" + (Date.now() - t) + "ms)");
  } catch (e) {
    note.skip.push(label + " — 건너뜀: " + e.message);
  }
}

const resolver = (base) => (p) => (!p ? null : path.isAbsolute(p) ? p : path.join(base, p));

const needs = (R) => (p, what) => {
  const v = R(p);
  if (!v) throw new Error(what + " 경로가 설정에 없다");
  return v;
};

function awardNames(archiveDir) {
  const SRC = fs.readFileSync(path.join(archiveDir, "save", "awards.js"), "utf8");
  const a0 = SRC.indexOf("const AWARD_NAME = {");
  const a1 = SRC.indexOf("\n};", a0);
  if (a0 < 0 || a1 < a0) throw new Error("save/awards.js 에서 AWARD_NAME 을 못 찾았다");
  const blk = SRC.slice(a0, a1 + 3).replace(/\/\*[\s\S]*?\*\//g, "").replace(/\/\/[^\n]*/g, "");
  const M = {};
  let m; const re = /(\d+)\s*:\s*"([^"]*)"/g;
  while ((m = re.exec(blk))) M[+m[1]] = m[2];
  if (!Object.keys(M).length) throw new Error("AWARD_NAME 이 비었다");
  return M;
}

const SPEC = {
  cup:   { size: 18,  H: 8, yoff: 4,  name: "컵 이력" },
  award: { size: 82,  H: 8, yoff: 0,  name: "수상 이력" },
  stats: { size: 152, H: 8, yoff: 11, name: "시즌 기록표" },
};
const YEAR_LO = 1850, YEAR_HI = 2100, YEAR_MIN = 0.90;

function readSection(file, spec) {
  const b = fs.readFileSync(file);
  if (b.length < spec.H + spec.size)
    throw new Error(spec.name + "이(가) 너무 짧다 — 레코드 하나도 안 들어간다");
  if ((b.length - spec.H) % spec.size !== 0)
    throw new Error(spec.name + "이(가) " + spec.size + "바이트로 안 나눠떨어진다 — 이 구획이 아니거나 배치가 다르다");
  const n = (b.length - spec.H) / spec.size;
  let ok = 0;
  for (let i = 0; i < n; i++) {
    const y = b.readUInt16LE(spec.H + i * spec.size + spec.yoff);
    if (y >= YEAR_LO && y <= YEAR_HI) ok++;
  }
  const rate = ok / n;
  if (rate < YEAR_MIN)
    throw new Error(spec.name + "의 연도 칸이 말이 안 된다 (" + (100 * rate).toFixed(1) +
      "% 만 " + YEAR_LO + "~" + YEAR_HI + " · 진짜 자료는 100%) — 다른 구획이거나 다른 버전이다");
  return b;
}

function cupRounds(file) {
  const b = readSection(file, SPEC.cup), SZ = 18, H = 8;
  const N = Math.floor((b.length - H) / SZ);
  const rounds = new Map();
  for (let i = 0; i < N; i++) {
    const o = H + i * SZ;
    if (b[o + 8] === 0) continue;
    const y = b.readUInt16LE(o + 4), rid = b.readUInt32LE(o);
    const k = y + "|" + rid;
    let e = rounds.get(k);
    if (!e) { e = { y: y, rid: rid, teams: [], flag: new Map() }; rounds.set(k, e); }
    const t = b.readUInt32LE(o + 14);
    e.teams.push(t); e.flag.set(t, b[o + 8]);
  }
  return rounds;
}

const PSIG = Buffer.from("01006c0701006c07", "hex");

function scanPeople(file) {
  const g = fs.readFileSync(file);
  const m = new Map();
  for (let q = 0; q + 9 <= g.length; q++) {

    if (!(g[q] === 0x01 && g[q + 1] === 0x00 && g[q + 2] === 0x6c && g[q + 3] === 0x07)) continue;
    const u2 = g.readUInt32LE(q + 5);
    if (!u2 || u2 === 0xffffffff || u2 > 2000000) continue;
    const at = g.indexOf(PSIG, q);
    if (at < 0 || at - q > 1200) continue;
    const raw = g.readUInt32LE(at + 8);
    const id = (raw >= 1 && raw <= 400000) ? raw : null;
    const len = g.readUInt32LE(at + 44); if (len > 120) continue;
    const born = g.readUInt16LE(at + 48 + len + 2); if (born < 1850 || born > 2200) continue;
    let full = "";
    if (len) { full = g.slice(at + 48, at + 48 + len).toString("utf8"); if (/[\x00-\x1f]/.test(full)) continue; }
    if (!m.has(u2)) m.set(u2, []);

    m.get(u2).push({ id: id, born: born, full: full, fn: g.readUInt32LE(at + 29),
                     sur: g.readUInt32LE(at + 34), loc: g.readUInt32LE(at + 39) });
  }
  return m;
}
function peopleUnion(files) {
  const bad = new Set(), by = new Map();
  for (const f of files) {
    const m = scanPeople(f);
    for (const [u, v] of m) { if (v.length > 1) bad.add(u); else if (!by.has(u)) by.set(u, v[0]); }
  }
  for (const u of bad) by.delete(u);
  return { by: by, dropped: bad.size };
}

function build(cfg, log) {
  const say = log || (() => {});
  const R = resolver(cfg.__base || ".");
  const NEED = needs(R);
  const AR = R(cfg.archive);

  let CLUB = cfg.club.uid;
  const ME = cfg.club.team, FROM = cfg.from || 2023;

  const SPELLS = cfg.spells || [];
  const MANY = new Set(SPELLS.map((s) => s.team)).size > 1;
  const meAt = (y) => {
    if (!MANY) return ME;
    const mark = y + "-08-01";
    for (const s of SPELLS) if (s.from <= mark && (!s.until || mark < s.until)) return s.team;
    return null;
  };

  const NAT = Object.assign({}, (function () {
    try {

      const ch = (cfg.dumps || {}).compHistory;
      if (!ch) return {};
      const m = require("./save/nations.js").nations(R(ch)).map;
      const o = {}; for (const [k, v] of m) o[k] = v; return o;
    } catch (e) { console.error("⚠ 나라 이름 세우기 실패: " + e.message); return {}; }
  })(), cfg.nations || {});
  const D = cfg.dumps || {};
  const CAPT = cfg.capture || {};

  let _mp = null, _mpDone = false;
  const MAPPER = () => {
    if (_mpDone) return _mp;
    _mpDone = true;
    try { _mp = require(path.join(AR, "save", "clubmap.js")).buildMapper(R(D.clubmapDir), cfg.clubmapYear); }
    catch (e) { say("  구단 이름표 실패: " + e.message); _mp = null; }
    return _mp;
  };

  let capOK = false;
  const note = { ok: [], skip: [], warn: [] };
  const out = {};

  out.club = { name: cfg.club.name };

  if (Object.keys(NAT).length) out.nations = NAT;

  let ARC = null, C = null, SQ = null;
  try {
    ARC = JSON.parse(fs.readFileSync(NEED(cfg.data, "내보내기(data)"), "utf8"));
    C = (ARC.clubs || []).find((x) => x.name.indexOf(cfg.club.name) >= 0) || null;
    if (!C) throw new Error("아카이브에 구단 " + cfg.club.name + " 이 없다");
  } catch (e) { say("  ⚠ 내보내기 없음 (" + e.message + ") — 내보내기가 필요한 칸은 안 만든다"); ARC = C = null; }
  try { SQ = JSON.parse(fs.readFileSync(R(cfg.squad), "utf8")); } catch (e) { SQ = null; }

  let COMP = null;
  part("⓪ 대회 이름표", () => {
    const g = (D.gameDb || [])[0];
    if (!g) throw new Error("game_db 가 없다");
    COMP = require(path.join(AR, "save", "comps.js")).readComps(R(g));

    const nd0 = (D.news || []).map((p) => R(p)).filter((p) => p && fs.existsSync(p));
    let 더함 = 0;
    if (nd0.length) {
      try {
        for (const [k, v] of require(path.join(AR, "save", "compnames.js")).readAll(nd0).map) {
          if (!COMP.has(k) && v && v.name) { COMP.set(k, v.name); 더함++; }
        }
      } catch (e) { say("  뉴스 쪽 대회 이름 합치기 실패: " + e.message); }
    }
    if (!COMP.size) { COMP = null; throw new Error("이름이 붙은 대회를 하나도 못 찾았다"); }
    return COMP.size + "개 (game_db " + (COMP.size - 더함) + " + 뉴스 " + 더함 + ") — " +
      [...COMP].slice(0, 3).map(([k, v]) => k + " " + v).join(" · ");
  }, note);

  let HIST = C ? C.history : null;
  if (!HIST && cfg.history) {
    try {
      HIST = JSON.parse(fs.readFileSync(R(cfg.history), "utf8"));
      say("  연표는 세이브에서 왔다 (" + (HIST.seasons || []).length + "시즌)");
    } catch (e) { say("  연표 파일을 못 읽었다: " + e.message); HIST = null; }
  }

  const bridge = (pick) => {
    const m = new Map();
    if (!C) return m;
    for (const s of C.seasons) for (const p of s.players) {
      const k = (p.fullName || p.name).split(" ").slice(-1)[0] + "|" + p.joined;
      if (!m.has(k)) m.set(k, new Set());
      m.get(k).add(pick(p));
    }
    return m;
  };

  part("① 연표·선수단·곡선", () => {
    if (!HIST) throw new Error("연표가 없다 (내보내기도, 세이브에서 짠 연표도 없다)");
    if (C) {
      out.club = Object.assign({ name: C.name }, C.meta, { manager: C.manager });
      out.generatedAt = ARC.generatedAt;
    }
    out.savedAt = HIST.savedAt;

    const exSeason = new Map(C ? C.seasons.map((s) => [s.season, s]) : []);
    out.timeline = HIST.seasons.map((h) => {

      const fin = h.cups.filter((c) => c.teams === 2);
      const win = fin.filter((c) => c.result === "우승").length;
      const lose = fin.filter((c) => c.result === "준우승").length;
      const ex = exSeason.get(h.season);

      const r = { season: h.season, division: h.division,

        divName: (COMP ? COMP.get(h.division) : DIV[h.division]) || ("디비전 " + h.division),
        standing: h.standing, why: h.why, stats: h.stats,
        cups: { finals: fin.length, win: win, lose: lose, unk: fin.length - win - lose,
          deepest: h.cups.length ? Math.min.apply(null, h.cups.map((c) => c.teams)) : null,
          rounds: h.cups.length },

        squadSize: ex ? ex.players.length : (C ? 0 : (h.squadSize || 0)), hasSquad: !!ex };
      if (h.team != null) { r.team = h.team; r.club = h.club || null; }
      return r;
    });

    if (SQ) {
      const nick = bridge((p) => p.localName || p.name);
      const full = bridge((p) => p.fullName || p.name);
      out.squad = SQ.squad.map((p) => {
        const k = p.name + "|" + p.joined;
        const v1 = nick.get(k), v2 = full.get(k);
        return { name: p.name, age: p.age, dob: p.dob, num: p.number, ca: p.ca, pa: p.pa,
          wage: p.wage, to: p.contractTo, joined: p.joined, grade: p.squad,
          lgApp: p.lgApp, lgGoal: p.lgGoal, acApp: p.acApp, acGoal: p.acGoal,
          pos: Object.keys(p.positions).filter((t) => p.positions[t] >= 15),
          local: (v1 && v1.size === 1) ? [...v1][0] : null,
          full: (v2 && v2.size === 1) ? [...v2][0] : null,

          person: p.person != null ? p.person : null,
          height: p.height != null ? p.height : null, weight: p.weight != null ? p.weight : null,
          contractFrom: p.contractFrom || null, firstSigned: p.firstSigned || null,
          attrs: Array.isArray(p.attrs) && p.attrs.length === 54 ? p.attrs : null,
          attrHist: p.attrHist || null,
          personality: p.personality || null };
      });
    } else if (C && C.seasons && C.seasons.length) {

      const last = C.seasons[C.seasons.length - 1];
      out.squad = (last.players || []).map((p) => ({
        name: p.name, age: null, dob: null, num: p.number, ca: p.ca, pa: p.pa,
        wage: p.wage, to: p.contractTo, joined: p.joined, grade: p.squad,
        lgApp: null, lgGoal: null, acApp: null, acGoal: null,
        pos: Object.keys(p.positions || {}).filter((t) => p.positions[t] >= 15),

        local: p.localName || p.fullName || null, full: p.fullName || null }));
    }

    if (!C) return "시즌 " + out.timeline.length + " (세이브에서 짠 연표 — 선수단·곡선은 내보내기가 있어야 한다)";
    const paBy = new Map(SQ ? SQ.squad.map((p) => [p.name + "|" + p.joined, p.pa]) : []);
    const by = new Map();
    for (const s of C.seasons) for (const p of s.players) {
      const k = p.fullName || p.name;
      if (!by.has(k)) by.set(k, { name: p.localName || p.name, full: k, pts: [], joined: p.joined });
      by.get(k).pts.push({ season: s.season, ca: p.ca });
    }
    out.curves = [...by.values()].filter((v) => v.pts.length >= 3).map((v) => {
      const sur = v.full.split(" ").slice(-1)[0];
      const pa = paBy.get(sur + "|" + v.joined);
      return { name: v.name, n: v.pts.length, pts: v.pts, pa: pa == null ? null : pa,
        gain: v.pts[v.pts.length - 1].ca - v.pts[0].ca };
    }).sort((a, b) => b.gain - a.gain);

    return "시즌 " + out.timeline.length + " · 선수 " + (out.squad ? out.squad.length : 0) +
      " · 곡선 " + out.curves.length;
  }, note);

  part("② 시즌별 명단", () => {
    if (!C) throw new Error("내보내기가 없다");
    out.rosters = C.seasons.map((s) => ({
      season: s.season, n: s.players.length,
      top: s.players.slice().sort((a, b) => (b.ca || 0) - (a.ca || 0)).slice(0, 5)
        .map((p) => ({ name: p.localName || p.name, full: p.fullName || p.name,
          ca: p.ca, pa: p.pa, num: p.number, pos: null })) }));
    return out.rosters.length + "시즌";
  }, note);

  part("③ 시즌 팀 기록", () => {
    const b = readSection(NEED(D.stats, "시즌 기록표(dumps.stats)"), SPEC.stats), SZ = 152, H = 8;
    const rec = new Map();
    for (let p = H; p + SZ <= b.length; p += SZ) {
      if (b.readUInt32LE(p + 1) !== ME || b[p + 31] !== 1) continue;
      const y = b.readUInt16LE(p + 11);
      if (y < 2020 || y > 2060) continue;
      let e = rec.get(y);
      if (!e) { e = { app: 0, goal: 0, assist: 0, motm: 0, rate: 0, rows: 0 }; rec.set(y, e); }
      e.rows++;
      const app = b[p + 24] + b[p + 25], rated = b[p + 26];
      if (app > e.app) e.app = app;
      if (b[p + 27] > e.goal) e.goal = b[p + 27];
      if (b[p + 28] > e.assist) e.assist = b[p + 28];
      if (b[p + 29] > e.motm) e.motm = b[p + 29];

      if (rated >= 10) { const r = b.readUInt16LE(p + 13) / 10 / rated; if (r > e.rate) e.rate = +r.toFixed(2); }
    }
    out.records = [...rec].sort((a, c) => a[0] - c[0])
      .map(([y, e]) => Object.assign({ season: seasonStr(y) }, e));
    return out.records.length + "시즌";
  }, note);

  part("④ 트로피 진열대", () => {
    const rounds = cupRounds(NEED(D.cup, "컵 이력(dumps.cup)"));

    let nameOf = () => null;
    try {
      const mp = MAPPER();
      if (mp && mp.clubOf) nameOf = (t) => { const r = mp.clubOf(t);
        return r && r.name ? { name: r.name, conf: r.tot ? +(r.n / r.tot).toFixed(2) : null } : null; };
    } catch (e) { say("  구단 이름 추정 실패: " + e.message); }

    const seen = new Set(), byYear = new Map();
    for (const e of rounds.values()) {
      const me = meAt(e.y);
      if (me == null || !e.flag.has(me)) continue;
      const key = e.y + "|" + e.teams.slice().sort((x, z) => x - z).join(",");
      if (seen.has(key)) continue; seen.add(key);
      const three = [...e.flag.values()].filter((x) => x === 3).length;
      let r;
      if (e.teams.length === 2 && three === 1) r = e.flag.get(me) === 3 ? "준우승" : "우승";
      else if (e.teams.length === 2) r = "결승";
      else r = e.teams.length + "강";
      const foe = e.teams.length === 2 ? e.teams.find((t) => t !== me) : null;
      if (!byYear.has(e.y)) byYear.set(e.y, []);
      byYear.get(e.y).push({ r: r, teams: e.teams.length, foe: foe, foeName: foe ? nameOf(foe) : null });
    }
    const ORD = { "우승": 0, "준우승": 1, "결승": 2 };
    out.trophies = [...byYear].sort((a, c) => a[0] - c[0]).map(([y, v]) => ({
      season: seasonStr(y),
      items: v.filter((x) => ORD[x.r] != null).sort((a, c) => ORD[a.r] - ORD[c.r]),
      deepest: Math.min.apply(null, v.map((x) => x.teams)) }));
    return out.trophies.length + "시즌 · 우승 " +
      out.trophies.reduce((a, s) => a + s.items.filter((x) => x.r === "우승").length, 0);
  }, note);

  part("⑤ 컵 여정", () => {
    const rounds = cupRounds(NEED(D.cup, "컵 이력(dumps.cup)"));
    const SAME = cfg.runSame == null ? 120 : cfg.runSame;
    const GAP = cfg.runGap == null ? 15 : cfg.runGap;
    const mine = new Map(), seen = new Map();
    for (const e of rounds.values()) {
      const me = meAt(e.y);
      if (me == null || !e.flag.has(me)) continue;
      const key = e.y + "|" + e.teams.slice().sort((x, z) => x - z).join(",");
      const prior = seen.get(key);
      if (prior && prior.some((r) => Math.abs(r - e.rid) <= SAME)) continue;
      if (prior) prior.push(e.rid); else seen.set(key, [e.rid]);
      const three = [...e.flag.values()].filter((x) => x === 3).length;
      let r = null;
      if (e.teams.length === 2) r = three === 1 ? (e.flag.get(me) === 3 ? "준우승" : "우승") : "결승";
      if (!mine.has(e.y)) mine.set(e.y, []);
      mine.get(e.y).push({ rid: e.rid, n: e.teams.length, r: r,
        foe: e.teams.length === 2 ? e.teams.find((t) => t !== me) : null });
    }
    let ok = 0, bad = 0;
    out.runs = [...mine].sort((a, c) => a[0] - c[0]).map(([y, list]) => {
      list.sort((a, c) => a.rid - c.rid);
      const groups = [];
      for (const it of list) {
        const g = groups[groups.length - 1];

        const near = g && it.rid - g[g.length - 1].rid <= GAP;
        const shrinking = g && it.n <= g[g.length - 1].n;
        if (near && shrinking) g.push(it); else groups.push([it]);
      }
      for (const g of groups) {
        const ns = g.map((x) => x.n);
        ns.every((v, i) => i === 0 || v <= ns[i - 1]) ? ok++ : bad++;
      }
      return { season: seasonStr(y), runs: groups.map((g) => ({
        from: Math.max.apply(null, g.map((x) => x.n)),
        to: Math.min.apply(null, g.map((x) => x.n)),
        rid: g[0].rid,
        result: (g.find((x) => x.r) || {}).r || (Math.min.apply(null, g.map((x) => x.n)) + "강"),
        foe: (g.find((x) => x.foe) || {}).foe || null })) };
    });
    return "단조 감소 " + ok + " · 어긋남 " + bad + " (" + (100 * ok / (ok + bad)).toFixed(1) + "%)";
  }, note);

  let TEAMS = (cfg.teams && cfg.teams.length) ? cfg.teams.slice() : [ME];
  part("⑥-0′ 유스팀 번호", () => {
    if (cfg.teams && cfg.teams.length) return "설정이 준 것을 쓴다 — " + cfg.teams.join(" · ");
    const mp = MAPPER();
    if (!mp) throw new Error("이름표가 없어 구단표 id 를 모른다");
    const me = mp.clubOf(ME);
    if (!me || me.tableId == null) throw new Error("1군(" + ME + ")의 구단표 id 를 모른다");
    const Y = require(path.join(AR, "save", "youth.js"));
    const r = Y.유스팀(Y.표만들기(null, mp.pts), me.tableId);
    if (!r) throw new Error("근거가 모자라다 (구단표 " + me.tableId + ")");
    TEAMS = [ME].concat(r.teams);
    out.teams = { first: ME, youth: r.teams, 근거: r.근거, 붙음: r.붙음, 구단표: me.tableId };
    return "구단표 " + me.tableId + " → " + r.teams.join(" · ") + "  (근거 " + r.근거.join("·") +
      "명" + (r.붙음 ? " · ±1 붙음" : " · ⚠ 안 붙음") + ")";
  }, note);

  part("⑥-0 명예의 전당(세이브)", () => {
    const f = NEED(D.compHistory, "대회 이력(dumps.compHistory)");
    const h = require("./save/honours.js").honours(f, TEAMS);
    let NAME = new Map();
    const nd = (D.news || []).map((p) => R(p)).filter((p) => p && fs.existsSync(p));
    if (nd.length) { try { NAME = require("./save/compnames.js").readAll(nd).map; } catch (e) {   } }
    const rows = [...h.entries()].filter(([, e]) => e.win.length || e.lose.length || e.third.length)
      .map(([comp, e]) => ({
        comp: comp,
        name: NAME.get(comp) ? NAME.get(comp).name : null,
        short: NAME.get(comp) ? NAME.get(comp).short : null,
        win: e.win, lose: e.lose, third: e.third,
        summer: e.summer,
        kind: e.kind,
        teams: [...new Set([...e.by.values()])],

        youth: ![...e.by.values()].includes(ME),
      }))
      .sort((a, c) => c.win.length - a.win.length || a.comp - c.comp);
    if (!rows.length) throw new Error("이 팀 번호로는 명예의 전당이 비어 있다");

    try {
      const BR = require(path.join(AR, "save", "bridge.js"));
      const uf = R(D.cup);
      if (uf && fs.existsSync(uf)) {
        const { 정답, 있는시즌 } = BR.읽기_대회(R(f));
        const 컵 = BR.읽기_컵(uf);
        const { 다리 } = BR.배우기(정답, 컵);
        const ck = BR.검산(정답, 컵, 다리);
        const byComp = new Map(rows.map((r) => [r.comp, r]));
        let 채움 = 0, 버림 = 0;
        for (const x of BR.채우기(컵, 다리, 있는시즌, TEAMS)) {
          const row = byComp.get(x.comp);
          if (!row) { 버림++; continue; }

          const y = row.summer ? x.season : x.season + 1;
          const 칸 = x.win ? row.win : row.lose;
          if (칸.indexOf(y) >= 0) continue;
          칸.push(y); 칸.sort((a, b) => a - b);
          (row.fromBridge = row.fromBridge || []).push(y);
          채움++;
        }
        out.bridge = { 다리: 다리.size, 맞: ck.맞, 틀: ck.틀, 채움: 채움, 버림: 버림 };
        say("  다리로 채운 트로피 " + 채움 + "건 (없던 대회라 버림 " + 버림 + ") · 다리 검산 " +
          ck.맞 + "/" + (ck.맞 + ck.틀) + " " + (100 * ck.맞 / (ck.맞 + ck.틀)).toFixed(1) + "%");
      }
    } catch (e) { say("  ⚠ 라운드→대회 다리 실패: " + e.message); }

    out.honours = rows;
    const named = rows.filter((r) => r.name).length;
    return "대회 " + rows.length + "종 · 우승 " + rows.reduce((n, r) => n + r.win.length, 0) +
      "회 · 이름 붙음 " + named + "/" + rows.length;
  }, note);

  part("⑥ 대회 이름(캡처)", () => {
    if (!CAPT.cups || !CAPT.cups.length) throw new Error("캡처 정답지가 없다");
    if (!out.runs) throw new Error("컵 여정이 없다");
    const want = new Map();
    const add = (y, comp, result) => {
      if (y < FROM || (cfg.until && y > cfg.until)) return;
      if (!want.has(y)) want.set(y, []);
      want.get(y).push({ comp: comp, result: result });
    };
    for (const c of CAPT.cups) {
      for (const y of (c.win || [])) add(c.summer ? y : y - 1, c, "우승");
      for (const y of (c.lose || [])) add(c.summer ? y : y - 1, c, "준우승");
    }
    const mine = new Map(out.runs.map((s) => [+s.season.slice(0, 4),
      s.runs.filter((r) => r.result === "우승" || r.result === "준우승" || r.result === "결승")]));
    let agree = 0, differ = 0;
    for (const y of [...new Set([...want.keys(), ...mine.keys()])].sort()) {
      ((want.get(y) || []).length === (mine.get(y) || []).length) ? agree++ : differ++;
    }
    let named = 0, unnamed = 0;
    const next = out.runs.map((s) => {
      const y = +s.season.slice(0, 4);
      const pool = (want.get(y) || []).slice();
      return { season: s.season, runs: s.runs.map((r) => {
        if (r.result !== "우승" && r.result !== "준우승" && r.result !== "결승") return r;

        const single = r.from === 2;
        let i = pool.findIndex((c) => c.result === r.result && !!c.comp.summer === single);
        if (i < 0) i = pool.findIndex((c) => !!c.comp.summer === single);
        if (i < 0) i = pool.findIndex((c) => c.result === r.result);
        if (i < 0) i = pool.length ? 0 : -1;
        if (i < 0) { unnamed++; return r; }
        const c = pool.splice(i, 1)[0];
        named++;

        return Object.assign({}, r, { comp: c.comp.name, short: c.comp.short,
          result: r.result === "결승" ? c.result : r.result, byCapture: r.result === "결승" });
      }) };
    });

    const rate = (agree + differ) ? agree / (agree + differ) : 0;
    if (rate < 0.7 || unnamed > named / 4)
      throw new Error("이 캡처 정답지는 이 세이브 것이 아니다 — 결승 수 일치 " +
        (100 * rate).toFixed(0) + "% · 이름 못 붙인 결승 " + unnamed + "개");
    capOK = true;
    out.runs = next;

    if (!out.honours) out.honours = CAPT.cups.map((c) => ({ name: c.name, short: c.short, win: c.win, lose: c.lose }));
    if (CAPT.leagues) out.leagues = CAPT.leagues;
    return "결승 수 일치 " + agree + "해 · 어긋남 " + differ + "해 · 이름 붙음 " + named + " · 못 붙임 " + unnamed;
  }, note);

  part("⑦ 월드컵", () => {
    const rid = (cfg.rounds || {}).worldcup;
    if (!rid) throw new Error("월드컵 라운드 번호가 설정에 없다");
    const rounds = cupRounds(NEED(D.cup, "컵 이력(dumps.cup)"));
    const byYear = new Map();
    for (const e of rounds.values()) {
      if (e.rid !== rid) continue;
      byYear.set(e.y, e.teams.map((t) => ({ t: t, f: e.flag.get(t) })));
    }
    out.worldcup = [...byYear].filter(([, v]) => v.length === 2).sort((a, c) => a[0] - c[0])
      .map(([y, v]) => {
        const w = v.find((x) => x.f !== 3), l = v.find((x) => x.f === 3);

        const mine = meAt(y) === (w ? w.t : null) || meAt(y) === (l ? l.t : null);
        return { year: y, mine: mine, win: w ? w.t : null, winName: w ? (NAT[w.t] || null) : null,
          lose: l ? l.t : null, loseName: l ? (NAT[l.t] || null) : null };
      });
    return out.worldcup.map((x) => x.year + ":" + (x.winName || x.win)).join(" ");
  }, note);

  part("⑦ 아시안 컵", () => {
    const rid = (cfg.rounds || {}).asiancup;
    if (!rid) throw new Error("아시안 컵 라운드 번호가 설정에 없다");
    const c = readSection(NEED(D.asiancup || D.cup, "컵 이력(dumps.asiancup)"), SPEC.cup), H = 8, SZ = 18;
    const N = Math.floor((c.length - H) / SZ);
    const by = new Map();
    for (let i = 0; i < N; i++) {
      const o = H + i * SZ;
      if (c.readUInt32LE(o) !== rid) continue;
      const s = c.readUInt16LE(o + 4), k = c[o + 8], t = c.readUInt32LE(o + 14);
      if (!by.has(s)) by.set(s, {});
      if (k === 2) by.get(s).win = t; else if (k === 3) by.get(s).lose = t;
    }

    out.asiancup = [...by].filter(([s, v]) => s >= (cfg.asiancupFrom || FROM) && v.win)
      .sort((a, b) => a[0] - b[0])

      .map(([s, v]) => ({ season: s, year: s, mine: meAt(s) === v.win || meAt(s) === v.lose,
        win: v.win, winName: NAT[v.win] || null,
        lose: v.lose, loseName: NAT[v.lose] || null }));
    return out.asiancup.map((x) => x.year + ":" + (x.winName || x.win)).join(" ");
  }, note);

  let MGRID = null, MGRU2 = null;
  part("⑧ 감독 재임", () => {
    const b = fs.readFileSync(NEED(D.manager, "감독 기록(dumps.manager)"));
    const SIG = Buffer.from("15ffffffffffff", "hex");
    const byTeam = new Map();
    const 사람수 = new Map();
    let a = -1;
    while ((a = b.indexOf(SIG, a + 1)) >= 0) {
      const id = b.readUInt32LE(a + 7);
      if (id < 1 || id > 400000) continue;
      사람수.set(id, (사람수.get(id) || 0) + 1);
      const team = b.readUInt32LE(a + 12);
      const day = b.readUInt16LE(a + 16) & 0x1ff, y = b.readUInt16LE(a + 18);
      if (y < 2000 || y > 2060 || day < 1 || day > 366) continue;
      if (!byTeam.has(team)) byTeam.set(team, new Set());
      byTeam.get(team).add(y);
    }

    if (!byTeam.size) throw new Error("감독 기록에서 레코드를 하나도 못 찾았다 — 이 구획이 아니거나 배치가 다르다");

    MGRID = [...사람수].sort((x, z) => z[1] - x[1])[0][0];
    out.spells = [...byTeam].map(([team, ys]) => {
      const a2 = [...ys].sort();
      return { team: team, name: NAT[team] || null, from: a2[0], to: a2[a2.length - 1], years: a2.length };
    }).sort((x, z) => x.from - z.from || z.years - x.years);

    if (Array.isArray(cfg.journey) && cfg.journey.length) {
      const Y = (v) => Number(String(v).slice(0, 4));
      const 겹침 = (j, a, b) => (j.seasons || []).filter((t) => { const y = Y(t); return y >= a && y <= b; }).length;

      const 칸 = (SPELLS && SPELLS.length)
        ? SPELLS.map((sp) => ({ sp: sp, a: Y(sp.from), b: sp.until ? Y(sp.until) - 1 : 9999, done: false }))
        : out.spells.map((sp) => ({ sp: sp, a: sp.from, b: sp.to, done: false }));
      const 쓴구단 = new Set(), 정답 = new Map(), 어긋남 = new Set();

      for (const pass of [1, 2]) {
        for (const k of 칸) {
          if (k.done) continue;
          const 후보 = cfg.journey.map((j) => ({ club: j.club, n: 겹침(j, k.a, k.b) }))
            .filter((x) => x.n > 0 && (pass === 1 || !쓴구단.has(x.club)));
          후보.sort((x, z) => z.n - x.n);
          const 위 = 후보.filter((x) => 후보.length && x.n === 후보[0].n);
          if (위.length !== 1) continue;
          k.done = true; 쓴구단.add(위[0].club);
          const 앞 = 정답.get(k.sp.team);
          if (앞 !== undefined && 앞 !== 위[0].club) 어긋남.add(k.sp.team);
          정답.set(k.sp.team, 위[0].club);
        }
      }
      for (const t of 어긋남) 정답.delete(t);
      let 붙음 = 0;
      for (const sp of out.spells) {
        if (sp.name) continue;
        const nm = 정답.get(sp.team);
        if (nm) { sp.name = nm; sp.nameFrom = '내보내기'; 붙음++; }
      }
      out.spellNames = { 붙음: 붙음, 전체: out.spells.length, 어긋남: [...어긋남] };
    }

    {

      const 구단만 = out.spells.filter((x) => !NAT[x.team]);
      const 끝 = (구단만.length ? 구단만 : out.spells).slice().sort((x, z) => (x.to - z.to) || (x.from - z.from)).pop();
      if (끝) out.now = { team: 끝.team, name: 끝.name || null, from: 끝.from, to: 끝.to };
    }
    return out.spells.length + '곳' + (out.spellNames ? ' · 이름 ' + out.spellNames.붙음 + '개' : '');
  }, note);

  if (CLUB == null && C && C.meta && C.meta.clubId) {
    CLUB = C.meta.clubId;
    note.ok.push("⑨-0 수상 구단 번호 — 내보내기에서 그대로 읽었다: " + CLUB);
  }
  if (cfg.club.uid == null && CLUB == null) {
    part("⑨-0 수상 구단 번호 유도", () => {
      const mp = MAPPER();
      if (!mp) throw new Error("이름표 폴더(dumps.clubmapDir)가 없다");
      const r = mp && mp.clubOf ? mp.clubOf(ME) : null;
      if (!r || !(r.full || r.name)) throw new Error("기록표 번호 " + ME + " 에 구단 이름을 못 붙였다");
      const nm = r.full || r.name;
      const clubs = new Map(JSON.parse(fs.readFileSync(
        NEED(D.clubsJson || (D.clubmapDir + "/clubs.json"), "이름표(dumps.clubsJson)"), "utf8")));
      let hit = null;
      for (const [id, v] of clubs) if (v.full === nm || v.short === nm) { hit = id; break; }
      if (hit == null) for (const [id, v] of clubs) if (v.full.indexOf(nm) >= 0) { hit = id; break; }
      if (hit == null) throw new Error("이름표에서 \"" + nm + "\" 을 못 찾았다");
      CLUB = hit + 1;

      if (!out.club || !out.club.name) out.club = Object.assign({}, out.club, { name: nm, nameGuess: true });
      const conf = r.tot ? Math.round(100 * r.n / r.tot) : null;
      if (conf != null && conf < 40)
        note.warn.push("구단 이름 추정이 얇다 (근거 " + conf + "%) — 수상이 남의 구단 것일 수 있다");
      return ME + " → " + nm + " → 이름표 " + hit + " → 수상표 " + CLUB + (conf != null ? " (근거 " + conf + "%)" : "");
    }, note);
  }

  let PEOPLE = null, NAMEOF = null, AWARD = null;

  const MGR = new Set(cfg.managerAwards || [97, 99, 101, 103]);
  part("⑨ 사람 표 · 상 이름", () => {
    AWARD = awardNames(AR);
    const gdbs = (D.gameDb || []).map(R);
    if (!gdbs.length) throw new Error("game_db 가 설정에 없다");
    const u = peopleUnion(gdbs);
    PEOPLE = u.by;

    let NAMES = new Map(), DICT = new Map(), LOCAL = new Map();
    const NM = require(path.join(AR, "save", "names.js"));
    const g0 = fs.readFileSync(gdbs[0]);

    let 탈 = [];

    if (cfg.club.name) {
      try { NAMES = NM.build(AR, { club: cfg.club.name }); } catch (e) { 탈.push("내보내기 다리:" + e.message); }
    } else { 탈.push("내보내기 다리: 구단 이름이 없어 안 놓음(커리어가 섞인다)"); }
    try { DICT = NM.dictionary(g0); } catch (e) { 탈.push("성 사전:" + e.message); }

    try { LOCAL = NM.localNames(g0); } catch (e) { 탈.push("표시 이름 사전:" + e.message); }

    let STUB = new Map(), 이름사전 = new Map();
    try { const PNM = require(path.join(AR, "save", "personname.js"));
          STUB = PNM.표만들기(gdbs[0]);
          이름사전 = (STUB.사전 && STUB.사전.이름) || new Map();
    } catch (e) { 탈.push("쪽지 표:" + e.message); }

    NAMEOF = (u2) => {
      const p = PEOPLE.get(u2);
      if (!p) return STUB.get(u2) || null;
      const n = p.id != null ? NAMES.get(p.id) : null;
      const 붙임 = (() => { const f = 이름사전.get(p.fn), s = DICT.get(p.sur);
                           return (f && s) ? f + " " + s : null; })();
      return (n && (n.localName || n.fullName || n.name)) || LOCAL.get(p.loc) || p.full ||
        붙임 || DICT.get(p.sur) || STUB.get(u2) || (p.id != null ? "사람" + p.id : null);
    };
    return "UID2→사람 " + PEOPLE.size + " (덤프 " + gdbs.length + "개 합집합 · 애매한 " + u.dropped +
      "개 버림) · 상 이름 " + Object.keys(AWARD).length + "종 · 이름 원천 [내보내기 " + NAMES.size +
      " · 표시이름 " + LOCAL.size + " · 성 " + DICT.size + "]" + (탈.length ? " ⚠ " + 탈.join(" / ") : "");
  }, note);

  part("⑨ 수상", () => {
    if (!PEOPLE) throw new Error("사람 표가 없다");

    if (CLUB == null) throw new Error("수상 표의 구단 번호를 모른다");

    const b = readSection(NEED(D.award, "수상 이력(dumps.award)"), SPEC.award), SZ = 82, H = 8;
    const N = (b.length - H) / SZ;
    const rows = [];
    for (let i = 0; i < N; i++) {
      const o = H + i * SZ, y = b.readUInt16LE(o);
      if (y < 1889 || y > 2100) continue;
      rows.push({ y: y, a: b.readUInt16LE(o + 2), who: b.readUInt32LE(o + 4),
        club: b.readUInt32LE(o + 8), age: b[o + 12] });
    }
    const mine = rows.filter((r) => r.club === CLUB && r.y >= FROM);
    const byWho = new Map();
    for (const r of mine) { if (!byWho.has(r.who)) byWho.set(r.who, []); byWho.get(r.who).push(r); }

    if (MGRID != null) {
      if (byWho.has(MGRID)) MGRU2 = MGRID;
      else if (PEOPLE) for (const [u2, p] of PEOPLE) if (p.id === MGRID) { MGRU2 = u2; break; }
    }
    const players = [...byWho].map(([u2, rs]) => {
      const 본인 = MGRU2 != null && u2 === MGRU2;
      const onlyMgr = 본인 || rs.every((r) => MGR.has(r.a));
      const yrs = [...new Set(rs.map((r) => r.y))].sort();
      const t = new Map(); for (const r of rs) t.set(r.a, (t.get(r.a) || 0) + 1);

      return { uid2: u2, name: (본인 && cfg.managerName) || NAMEOF(u2) || null, manager: onlyMgr,
        total: rs.length, kinds: t.size, from: yrs[0], to: yrs[yrs.length - 1],
        named: [...t].filter(([a]) => AWARD[a]).map(([a, c]) => ({ name: AWARD[a], n: c }))
          .sort((x, z) => z.n - x.n),
        perYear: yrs.map((y) => [y, rs.filter((r) => r.y === y).length]) };
    }).sort((a, c) => c.total - a.total);

    const golden = rows.filter((r) => r.a === 0 && r.y >= FROM).sort((a, c) => a.y - c.y)
      .map((r) => ({ year: r.y, name: NAMEOF(r.who) || ("UID2 " + r.who), age: r.age, mine: r.club === CLUB }));

    let lee = null;
    if (cfg.star) {
      const rs = rows.filter((r) => r.who === cfg.star && r.y >= FROM);
      lee = { name: NAMEOF(cfg.star), total: rs.length, years: [], kinds: new Set(rs.map((r) => r.a)).size };
      for (const y of [...new Set(rs.map((r) => r.y))].sort()) {
        const v = rs.filter((r) => r.y === y);
        lee.years.push({ year: y, n: v.length, age: v[0].age,
          named: [...new Set(v.map((r) => r.a))].filter((a) => AWARD[a]).map((a) => AWARD[a]) });
      }
    }
    out.awards = { players: players, golden: golden, lee: lee, total: mine.length,
      winners: byWho.size, kinds: new Set(mine.map((r) => r.a)).size,
      named: Object.keys(AWARD).length, dump: cfg.awardDumpLabel || null };

    const noName = players.filter((p) => !p.name).length;

    if (byWho.size && noName / byWho.size > 0.6)
      note.warn.push("우리 수상자 " + byWho.size + "명 중 " + noName + "명에 이름이 안 붙었다 — game_db 가 온전한지 볼 것");
    return mine.length + "회 · 수상자 " + byWho.size + " · 이름 못 붙은 수상자 " + noName + "명";
  }, note);

  part("⑨ 포디움", () => {
    if (!PEOPLE) throw new Error("사람 표가 없다");
    const b = readSection(NEED(D.award, "수상 이력(dumps.award)"), SPEC.award), SZ = 82, H = 8, SLOT = 26, BASE = 4;
    const N = (b.length - H) / SZ;
    const all = [];
    for (let i = 0; i < N; i++) {
      const o = H + i * SZ, y = b.readUInt16LE(o);
      if (y < FROM || y > 2100) continue;
      const award = b.readUInt16LE(o + 2);
      if (!AWARD[award]) continue;
      const place = [];
      for (let s = 0; s < 3; s++) {
        const p = o + BASE + SLOT * s, u = b.readUInt32LE(p);
        if (u === 0 || u === 0xffffffff) { place.push(null); continue; }
        place.push({ name: NAMEOF(u) || ("UID2 " + u), age: b[p + 8], mine: b.readUInt32LE(p + 4) === CLUB });

"use strict";

const REG = {};
const norm = (p) => p.replace(/^\.\//, "");

async function loadModule(file) {
  const m = window.__REG[norm(file)];
  if (!m) throw new Error("모듈을 못 찾음: " + file);
  REG[file] = m;
  return m;
}

let core = null, platform = null, render = null;

const SAVE_FILES = new Map();

const TROPHY_FILES = new Map();
let DATA = null;

async function boot() {
  await loadModule("tags.js");
  await loadModule("parse.js");
  const web = await loadModule("platform-web.js");
  core = await loadModule("core.js");
  render = await loadModule("render.js");

  try { await loadModule("spa.js"); } catch (e) { console.warn("spa.js 없음:", e.message); }

  try { await loadModule("career.js"); } catch (e) { console.warn("career.js 없음:", e.message); }
  if (!window.__VENDOR) {

    catch (e) { console.warn("Vue 소스 없음 — 옛 화면(spa.js)으로 간다:", e.message); }
  }
  platform = web.makePlatform(window.fzstd);
  core.configure(platform);
  return core;
}

const HEAD_BYTES = 300000;

const LOOKS_LIKE_EXPORT = /\d{4}-\d{2}/;

function classify(files) {
  const fmf = [], fm = [], loose = [], looseFm = [];
  for (const f of files) {

    const p = "/" + (f.webkitRelativePath || f.name).replace(/\\/g, "/").toLowerCase();
    if (p.endsWith(".fmf")) {
      if (p.indexOf("/exported teams/") >= 0) fmf.push(f);
      else if (LOOKS_LIKE_EXPORT.test(f.name)) loose.push(f);
    } else if (p.endsWith(".fm")) {
      if (p.indexOf("/games/") >= 0) fm.push(f);
      else looseFm.push(f);
    } else if (p.endsWith(".png") && p.indexOf("troph") >= 0 &&
               (p.indexOf("/default/") >= 0 || /^\d+\.png$/.test(p.split("/").pop()))) {

      TROPHY_FILES.set(p.split("/").pop().replace(/.png$/, ""), f);
    }
  }

  if (!fmf.length) fmf.push.apply(fmf, loose);
  if (!fm.length) fm.push.apply(fm, looseFm);
  return { fmf, fm };
}

async function run(files, onProgress) {
  const { fmf, fm } = classify(files);
  if (!fmf.length) {

    const sample = files.slice(0, 3)
      .map((f) => f.webkitRelativePath || f.name).join(" / ") || "(파일 없음)";
    throw new Error(
      "내보낸 팀 파일(.fmf)을 찾지 못했습니다. 파일 " + files.length + "개를 훑었습니다.\n" +
      "예: " + sample + "\n" +
      "Football Manager 20xx 폴더나 그 안의 'exported teams' 폴더를 골라 주세요.");
  }

  const entries = [], skipped = [], managers = new Set();
  const total = fmf.length + fm.length;
  let done = 0;

  for (const f of fmf) {
    const meta = core.splitExportName(f.name);
    if (meta.manager) managers.add(meta.manager);
  }

  const AHEAD = 8;
  const readAhead = (list, slice) => {
    const q = new Map();
    const prime = (i) => {
      if (i < list.length && !q.has(i)) {
        const f = list[i];
        q.set(i, (slice ? f.slice(0, slice) : f).arrayBuffer());
      }
    };
    for (let i = 0; i < AHEAD; i++) prime(i);
    return { take: async (i) => { prime(i + AHEAD); const p = q.get(i); q.delete(i); return p; } };
  };

  const fmfQueue = readAhead(fmf, 0);
  for (let i = 0; i < fmf.length; i++) {
    const f = fmf[i];
    onProgress(done, total, f.name);
    const meta = core.splitExportName(f.name);
    try {
      const bytes = platform.from(new Uint8Array(await fmfQueue.take(i)));
      entries.push({
        file: f.name, club: meta.club, manager: meta.manager, season: meta.season,
        mtime: new Date(f.lastModified),
        data: core.readSeason(bytes, f.name, f.lastModified),
      });
    } catch (e) {
      skipped.push({ file: f.name, reason: e.message });
    }
    done++;
  }

  const fmQueue = readAhead(fm, HEAD_BYTES);
  const saves = [];
  for (let i = 0; i < fm.length; i++) {
    const f = fm[i];
    onProgress(done, total, f.name);
    const info = {
      file: f.name,
      name: f.name.replace(/\.fm$/i, "").replace(/ \(v\d+\)$/, ""),
      sizeMB: Math.round(f.size / 1048576),
      modified: new Date(f.lastModified).toISOString().slice(0, 10),
      modifiedMs: f.lastModified,
      manager: null, club: null, nation: null, version: null,
    };
    try {
      const head = platform.from(new Uint8Array(await fmQueue.take(i)));
      Object.assign(info, core.saveHeaderInfo(head, [...managers], platform));
    } catch (e) { info.error = e.message; }
    saves.push(info);
    SAVE_FILES.set(info.file, f);
    done++;
  }

  return core.assemble({ entries, saves, backup: null, options: {}, folder: null, skipped });
}

function makeProgress(frame, title, lastMs) {
  let doc = null, queue = [];
  const apply = (fn) => { if (doc) fn(doc); else queue.push(fn); };
  frame.addEventListener("load", function once() {
    frame.removeEventListener("load", once);
    try { doc = frame.contentDocument; } catch (e) { return; }
    queue.forEach((fn) => { try { fn(doc); } catch (e) {   } });
    queue = [];
  });
  frame.srcdoc = waitDoc(title, null, lastMs);

  const P = function (msg) {
    apply((d) => { const e = d.getElementById("step"); if (e) e.textContent = msg; });
  };

  P.bytes = function (done, total) {
    apply((d) => {
      const t = d.getElementById("track"), b = d.getElementById("bar"), n = d.getElementById("pct");
      if (!t || !b) return;
      t.classList.remove("indet");
      b.style.width = (total ? Math.min(100, 100 * done / total) : 0).toFixed(1) + "%";
      if (n) n.textContent = (done / 1048576).toFixed(0) + " / " + (total / 1048576).toFixed(0) + "MB";
    });
  };

  P.indet = function () {
    apply((d) => {
      const t = d.getElementById("track"), n = d.getElementById("pct"), b = d.getElementById("bar");
      if (t) t.classList.add("indet");

      if (b) b.style.width = "100%";
      if (n) n.textContent = "얼마나 남았는지는 못 잽니다";
    });
  };
  return P;
}

  if (!REG["career.js"] && !REG["spa.js"]) throw new Error("화면 만드는 부분(career.js / spa.js)이 안 실려 있다");
  const Bytes = REG["platform-web.js"].Bytes;

  NodeRun.setBytes(Bytes);

  const journey = (pt && pt.journey) || [];
  let club = null, best = -1;
  for (const j of journey) {
    const n = (j.seasons || []).length;
    if (n > best) { best = n; club = j.club; }
  }
  if (!club) throw new Error("이 카드에 구단이 없다");

  NodeRun.put("/ar/data.json", JSON.stringify(DATA));
  if (window.__AWARDS_SRC) NodeRun.put("/ar/save/awards.js", window.__AWARDS_SRC);

  const file = pt && pt.saveFile ? SAVE_FILES.get(pt.saveFile) : null;

    squad: "/없음.json",

    trophyIds: [...TROPHY_FILES.keys()].filter((k) => /^\d+$/.test(k)).map(Number),
    rounds: { worldcup: 473, asiancup: 3221 },
  };

  const CAP = window.__CAPTURE;

    if (CAP.leagues) cfg.capture.leagues = CAP.leagues;
    if (CAP.shapes) cfg.capture.shapes = CAP.shapes;
    if (CAP.nations) cfg.nations = CAP.nations;
    if (CAP.rounds) cfg.rounds = CAP.rounds;
    if (CAP.cupPix) { NodeRun.put("/cap/cups.json", JSON.stringify(CAP.cupPix)); cfg.capture.cupPix = "/cap/cups.json"; }
    if (CAP.bestxi) { NodeRun.put("/cap/bestxi.json", JSON.stringify(CAP.bestxi)); cfg.capture.bestxi = "/cap/bestxi.json"; }
  }

  if (file) {
    const at = await grabSections(file, say, journey);
    cfg.club.team = at.team;

    await nameBridge(at, club, journey, say);

    if (at.spells) cfg.spells = at.spells;

    if (journey && journey.length) cfg.journey = journey.map((j) => ({ club: j.club, seasons: j.seasons }));
    cfg.clubmapYear = at.year;
    cfg.history = at.history;
    cfg.dumps = {
      cup: at["tc_cup_history_dt"], asiancup: at["tc_cup_history_dt"],
      stats: at["player_stats_hist_dt"], manager: at["person_record_manager"],
      award: at["award_year_hist_dt"],

      news: [at["news"], at["play_fixture_manager"]].concat(at.matchFiles || []).filter(Boolean),
      gameDb: at.gameDb ? [at.gameDb] : [],
      clubmapDir: at.gameDb ? "/save" : null,
      clubsJson: at.gameDb ? "/save/clubs.json" : null,
    };
  } else {
    say("세이브가 없어 내보내기만으로 만듭니다");
  }

  say("자료 만드는 중");
  NodeRun.put("/cfg.json", JSON.stringify(cfg));
  const r = NodeRun.run("payload.js", ["/cfg.json", "--out", "/payload.json"]);
  if (r.error) throw r.error;
  const v = r.files.get("/payload.json");
  const json = typeof v === "string" ? v : new TextDecoder().decode(v);
  NodeRun.clear();
  say("화면 만드는 중");

  const pix = await trophyPix();
  let o = null;

    if (TROPHY_NOTE) say(TROPHY_NOTE);
    if (pix || o.cupPix || o.cupPixByComp) return careerHtml(o);
  }
  return careerHtml(json);
}

async function attachTrophies(o) {
  const pack = TROPHY_FILES.size;
  if (!o || !o.honours) return "";
  if (!pack) return "트로피 팩 없음 — graphics 안에 이름에 troph 가 든 폴더가 없습니다";
  const uids = o.compUid ? Object.keys(o.compUid).length : 0;
  if (!uids) return "트로피 팩 " + pack + "장 · 대회 번호 다리를 못 놓았습니다";
  o.cupPix = o.cupPix || {};
  o.cupPixByComp = o.cupPixByComp || {};
  let got = 0, miss = 0;
  for (const h of o.honours) {
    const uid = o.compUid[h.comp];

    if (!uid || h.comp == null || o.cupPixByComp[h.comp]) continue;
    if (h.name && o.cupPix[h.name]) continue;
    const file = TROPHY_FILES.get(String(uid));
    if (!file) { miss++; continue; }
    try { o.cupPixByComp[h.comp] = await shrink(file, 96); got++; }
    catch (e) { miss++; }
  }
  if (!got) return "트로피 팩 " + pack + "장 · 다리 " + uids + "개 · 맞는 그림이 없습니다";
  return "트로피 " + got + "개 붙임" + (miss ? " (" + miss + "개는 그림 없음)" : "");
}

function shrink(file, h) {
  return new Promise(function (ok, no) {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = function () {
      const w = Math.max(1, Math.round(im.width * h / im.height));
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      c.getContext("2d").drawImage(im, 0, 0, w, h);
      URL.revokeObjectURL(url);
      try { ok(c.toDataURL("image/webp", 0.85)); } catch (e) { ok(c.toDataURL("image/png")); }
    };
    im.onerror = function () { URL.revokeObjectURL(url); no(new Error("그림을 못 읽었다")); };
    im.src = url;
  });
}

async function trophyPix() {
  if (!TROPHY_FILES.size) return null;

    const f = TROPHY_FILES.get(k);
    if (!f) continue;

  }
  return Object.keys(out).length ? out : null;
}

async function nameBridge(at, club, journey, say) {
  if (!at.gameDb || at.team == null) { say("이름 다리 건너뜀 — 이름표가 없습니다"); return null; }
  say("세이브 명단 뽑는 중");
  const r = NodeRun.run("squad.js", ["/save", "--팀", String(at.team), "/sq.json"]);
  if (r.error) { say("이름 다리 건너뜀 — 명단을 못 뽑았습니다: " + r.error.message); return null; }
  const v = r.files.get("/sq.json");
  let sq;
  try { sq = JSON.parse(typeof v === "string" ? v : new TextDecoder().decode(v)); }
  catch (e) { say("이름 다리 건너뜀 — 명단을 못 읽었습니다"); return null; }
  if (!sq || !sq.squad || !sq.squad.length) { say("이름 다리 건너뜀 — 명단이 비었습니다"); return null; }

  const d = String(sq.date || "");
  const y = +d.slice(0, 4), mo = +d.slice(5, 7);
  if (!y) { say("이름 다리 건너뜀 — 세이브 날짜를 못 읽었습니다: " + d); return null; }
  const a0 = mo >= 7 ? y : y - 1;
  const season = a0 + "-" + String(a0 + 1).slice(2);

  const mine2 = (journey || []).filter((j) => j.club === club);
  const all = [];
  for (const j of mine2) for (const t of (j.seasons || [])) all.push(t);
  const use = all.filter((t) => t <= season).sort().pop() || all.sort().pop();
  if (!use) {
    say("이름 다리 건너뜀 — 이 구단 내보내기가 없습니다");
    return null;
  }
  NodeRun.put("/ar/save-squads/bridge.json", JSON.stringify({
    archiveClub: club, season: use, savedAt: sq.date, uid: sq.uid, squad: sq.squad }));
  say("이름 다리 놓음 — 세이브 " + season + " ↔ 내보내기 " + use + " · " + sq.squad.length + "명");
  return use;
}

async function grabSections(file, say, journey) {
  const parse = REG["parse.js"];
  say("목록 읽는 중 — 파일 꼬리 4MB");
  const TAIL = 4 * 1024 * 1024;
  const tail = platform.from(new Uint8Array(await file.slice(Math.max(0, file.size - TAIL)).arrayBuffer()));
  const idx = parse.readIndexFromTail(tail, file.name);

  const at = {};

  const WANT = ["person_record_manager", "player_stats_hist_dt", "tc_league_history_dt",
                "tc_cup_history_dt", "award_year_hist_dt", "comp_history_dt", "news",
                "play_fixture_manager", "game_db"];
  let total = TAIL, done = TAIL;
  for (const n of WANT) {
    const e = idx.entries.find((x) => x.name === n);
    if (e) total += e.stored;
  }

  for (const e of idx.entries.filter((x) => /^\d+_\d+/.test(x.name)).slice(0, 120)) total += e.stored;
  if (say.bytes) say.bytes(done, total);

  const grab = async (name) => {
    const e = idx.entries.find((x) => x.name === name);
    if (!e) return null;
    say("읽는 중 " + name + " — " + (e.stored / 1048576).toFixed(0) + "MB");
    const off = idx.dataStart + e.offset;

    const CH = 8 * 1024 * 1024;
    const raw8 = new Uint8Array(e.stored);
    for (let a = 0; a < e.stored; a += CH) {
      const b = Math.min(e.stored, a + CH);
      raw8.set(new Uint8Array(await file.slice(off + a, off + b).arrayBuffer()), a);
      done += b - a;
      if (say.bytes) say.bytes(done, total);
    }
    say("압축 푸는 중 " + name);
    if (say.indet) say.indet();
    const raw = platform.from(raw8);
    const out = platform.zstdDecompress(raw);
    if (say.bytes) say.bytes(done, total);
    const vp = "/save/" + name + "." + e.ext.replace(/^\./, "");
    NodeRun.put(vp, out);
    return vp;
  };
  for (const n of ["person_record_manager", "player_stats_hist_dt", "tc_league_history_dt",
                   "tc_cup_history_dt", "award_year_hist_dt"]) {
    const v = await grab(n);
    if (!v) throw new Error("세이브에 " + n + " 구획이 없다");
    at[n] = v;
  }

  for (const n of ["comp_history_dt", "news", "play_fixture_manager"]) { const v = await grab(n); if (v) at[n] = v; }

  at.matchFiles = [];
  const matches = idx.entries.filter((e) => /^\d+_\d+/.test(e.name)).slice(0, 120);
  if (matches.length) {
    say("대회 이름 모으는 중 — 경기 파일 " + matches.length + "개");
    for (const e of matches) { const v = await grab(e.name); if (v) at.matchFiles.push(v); }
  }
  at.gameDb = await grab("game_db");
  if (at.gameDb) {
    say("이름표 만드는 중");
    const c = NodeRun.run("clubs.js", [at.gameDb, "/save/clubs.json"]);
    if (c.error) { say("이름표 실패 — 이름 없이 갑니다"); at.gameDb = null; }
  }

  if (say.indet) say.indet();
  say("감독 기록 읽는 중");
  const mgr = NodeRun.run("manager.js", [at["person_record_manager"]]);
  if (mgr.error) throw mgr.error;
  const teams = (mgr.exports && mgr.exports.teams) || [];
  if (!teams.length) throw new Error("감독 기록에서 구단 번호를 못 찾았다");
  at.team = teams[0].team;
  const yr = (mgr.exports && mgr.exports.byYear) || [];
  at.year = yr.length ? yr[yr.length - 1].year : 2038;

  const spells = (mgr.exports && mgr.exports.spells) || [];
  const mine = [];
  for (const sp of spells) if (mine.indexOf(sp.team) < 0) mine.push(sp.team);

  if (mine.length <= 1) {
    say("시즌 순위 짜는 중");
    const s = NodeRun.run("season.js", ["/save", String(at.team), "/hist.json"]);
    at.history = s.error ? null : "/hist.json";
    return at;
  }

  const hist = new Map();
  for (let i = 0; i < mine.length; i++) {
    say("시즌 순위 짜는 중 — 구단 " + (i + 1) + "/" + mine.length);
    const vp = "/h-" + mine[i] + ".json";
    const r = NodeRun.run("season.js", ["/save", String(mine[i]), vp]);
    if (r.error) continue;
    const v = r.files.get(vp);
    try {
      hist.set(mine[i], JSON.parse(typeof v === "string" ? v : new TextDecoder().decode(v)));
    } catch (e) {   }
    NodeRun.drop(vp);
  }
  if (!hist.size) throw new Error("재임한 구단의 사다리를 하나도 못 짰다");

  const nameOf = new Map();
  for (const j of (journey || [])) for (const sn of (j.seasons || [])) nameOf.set(sn, j.club);

  const teamAt = (season) => {
    const mark = season.slice(0, 4) + "-08-01";
    for (const sp of spells) if (sp.from <= mark && (!sp.until || mark < sp.until)) return sp.team;
    return null;
  };

  const all = new Set();
  for (const j of hist.values()) for (const s of j.seasons) all.add(s.season);
  const rows = [];
  for (const sn of [...all].sort()) {
    const t = teamAt(sn);
    if (t == null) continue;
    const j = hist.get(t);
    const row = j && j.seasons.filter((x) => x.season === sn)[0];
    if (!row) continue;
    row.team = t;
    row.club = nameOf.get(sn) || null;
    rows.push(row);
  }
  const any = hist.values().next().value;
  NodeRun.put("/hist.json", JSON.stringify({ savedAt: any ? any.savedAt : null, seasons: rows }));
  at.history = "/hist.json";
  at.spells = spells;
  say("연표 " + rows.length + "시즌 — 구단 " + mine.length + "곳을 이었다");
  return at;
}

const WANT_DIR = /^(exported teams|games)$/i;
const MAYBE_PARENT = /^(sports interactive|football manager.*|documents|내 문서)$/i;
const WANT_FILE = /\.(fmf|fm)$/i;

const TROPHY_DIR = /troph/i;
const TROPHY_FILE = /\.png$/i;
const PROBE_DEPTH = 3;
const PROBE_CAP = 3000;

function decideDir(name, depth, probeLeft) {
  if (TROPHY_DIR.test(name)) return "trophy";
  if (WANT_DIR.test(name)) return "take";
  if (depth === 0) return "scan";
  if (MAYBE_PARENT.test(name)) return "scan";
  if (probeLeft > 0) return "probe";
  return "skip";
}

function wantFile(name, mode) {
  if (mode === "probe") return false;
  return mode === "trophy" ? TROPHY_FILE.test(name) : WANT_FILE.test(name);
}

const setPath = (f, p) => {

  try { Object.defineProperty(f, "webkitRelativePath", { value: p }); }
  catch (e) {   }
  return f;
};

async function walkEntry(entry, out, prefix, depth, inherit, onScan, probeLeft) {
  if (entry.isFile) {
    if (!wantFile(entry.name, inherit)) return;
    const f = await new Promise((res, rej) => entry.file(res, rej));
    out.push(setPath(f, prefix + entry.name));
    onScan(out.length);
    return;
  }
  if (!entry.isDirectory) return;

  const mode = (inherit === "take" || inherit === "trophy")
    ? inherit : decideDir(entry.name, depth, probeLeft);
  if (mode === "skip") return;
  const next = mode === "probe" ? probeLeft - 1 : PROBE_DEPTH;

  const reader = entry.createReader();
  let batch, seen = 0;
  do {
    batch = await new Promise((res, rej) => reader.readEntries(res, rej));
    for (const e of batch) {
      if (mode === "probe" && ++seen > PROBE_CAP) return;
      await walkEntry(e, out, prefix + entry.name + "/", depth + 1, mode, onScan, next);
    }
  } while (batch.length);
}

async function walkHandle(dir, out, prefix, depth, inherit, onScan, probeLeft) {
  const mode = (inherit === "take" || inherit === "trophy")
    ? inherit : decideDir(dir.name, depth, probeLeft);
  if (mode === "skip") return;
  const next = mode === "probe" ? probeLeft - 1 : PROBE_DEPTH;
  let seen = 0;
  for await (const [name, h] of dir.entries()) {
    if (mode === "probe" && ++seen > PROBE_CAP) return;
    if (h.kind === "file") {
      if (!wantFile(name, mode)) continue;
      out.push(setPath(await h.getFile(), prefix + name));
      onScan(out.length);
    } else {
      await walkHandle(h, out, prefix + name + "/", depth + 1, mode, onScan, next);
    }
  }
}

    window.__fm = { run: run, handle: handle, core: function () { return core; },
                    platform: function () { return platform; },
                    walkHandle: walkHandle, walkEntry: walkEntry, decideDir: decideDir,

                    classify: classify, attachTrophies: attachTrophies, trophyFiles: TROPHY_FILES };
  } catch (e) {
    $("boot").textContent = "불러오기 실패: " + e.message;
    console.error(e);
    return;
  }

  const scanning = (n) => {
    $("pick").hidden = true;
    $("progress").hidden = false;
    $("bar").style.width = "0%";
    $("ptext").textContent = "폴더를 훑는 중… 찾은 파일 " + n + "개";
  };

  async function collect(fn) {
    const out = [];
    scanning(0);
    try {
      await fn(out, scanning);
    } catch (e) {
      $("progress").hidden = true; $("pick").hidden = false;
      $("error").hidden = false; $("error").textContent = e.message;
      console.error(e); return;
    }
    handle(out);
  }

  const canPick = typeof window.showDirectoryPicker === "function";
  $("pickBtn").addEventListener("click", async () => {
    if (!canPick) { $("folder").click(); return; }
    let dir;
    try { dir = await window.showDirectoryPicker({ mode: "read" }); }
    catch (e) { return; }
    collect((out, onScan) => walkHandle(dir, out, "", 0, "scan", onScan, PROBE_DEPTH));
  });
  $("folder").addEventListener("change", (e) => handle([].slice.call(e.target.files)));
  $("backBtn").addEventListener("click", closeArchive);

  window.addEventListener("popstate", function () {
    if ($("archive").hidden) return;

    if (history.state && history.state.archive) return;
    showList();
  });
  window.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !$("archive").hidden) closeArchive();
  });
  if (!canPick) $("slowNote").hidden = false;

  const zone = $("drop");
  zone.addEventListener("dragover", (e) => { e.preventDefault(); zone.classList.add("over"); });
  zone.addEventListener("dragleave", () => zone.classList.remove("over"));
  zone.addEventListener("drop", (e) => {
    e.preventDefault();
    zone.classList.remove("over");
    const items = [].slice.call(e.dataTransfer.items)
      .map((i) => (i.webkitGetAsEntry ? i.webkitGetAsEntry() : null)).filter(Boolean);
    collect(async (out, onScan) => {
      for (const it of items) await walkEntry(it, out, "", 0, "scan", onScan, PROBE_DEPTH);
    });
  });
});

const DEEP_NEED = ["person_record_manager", "player_stats_hist_dt", "tc_league_history_dt", "tc_cup_history_dt"];

async function deepRead(file, say) {
  const parse = REG["parse.js"], Bytes = REG["platform-web.js"].Bytes;
  if (!window.NodeRun) throw new Error("깊이 읽기 부분이 안 실려 있다 (한 장으로 묶은 판에서만 된다)");
  NodeRun.clear();
  NodeRun.setBytes(Bytes);

  say("목록 읽는 중 — 파일 꼬리 4MB");
  const TAIL = 4 * 1024 * 1024;
  const tail = platform.from(new Uint8Array(await file.slice(Math.max(0, file.size - TAIL)).arrayBuffer()));
  const idx = parse.readIndexFromTail(tail, file.name);

  let got = 0, mb = 0;
  for (const name of DEEP_NEED) {
    const e = idx.entries.find((x) => x.name === name);
    if (!e) continue;
    say("읽는 중 " + name + " — " + (e.stored / 1048576).toFixed(0) + "MB");
    const at = idx.dataStart + e.offset;
    const raw = platform.from(new Uint8Array(await file.slice(at, at + e.stored).arrayBuffer()));
    const out = platform.zstdDecompress(raw);
    NodeRun.put("/save/" + name + "." + e.ext.replace(/^\./, ""), out);
    got++; mb += out.length / 1048576;
  }
  if (got < DEEP_NEED.length) throw new Error("세이브에 필요한 구획이 없다 (" + got + "/" + DEEP_NEED.length + ")");

  const gdb = idx.entries.find((x) => x.name === "game_db");
  if (gdb) {
    const at = idx.dataStart + gdb.offset;
    const head = platform.from(new Uint8Array(await file.slice(at, at + Math.min(gdb.stored, 1 << 20)).arrayBuffer()));
    try { NodeRun.put("/save/game_db.dat", platform.zstdDecompress(head).slice(0, 64)); } catch (e) {}
  }

  say("감독 기록 읽는 중");
  const mgr = NodeRun.run("manager.js", ["/save/person_record_manager.dat"]);
  if (mgr.error) throw mgr.error;
  const teams = (mgr.exports && mgr.exports.teams) || [];
  if (!teams.length) throw new Error("감독 기록에서 구단 번호를 못 찾았다");

  const out = [];
  for (const t of teams.slice(0, 5)) {
    if (t.n < 3) continue;
    say("시즌 짜는 중 — 구단 " + t.team);
    const r = NodeRun.run("season.js", ["/save", String(t.team), "/out.json"]);
    if (r.error) { out.push({ team: t.team, error: r.error.message }); continue; }
    const v = r.files.get("/out.json");
    out.push(Object.assign({ team: t.team, records: t.n },
      JSON.parse(typeof v === "string" ? v : new TextDecoder().decode(v))));
  }
  NodeRun.clear();
  return { teams: teams, clubs: out, mb: Math.round(mb), byYear: (mgr.exports && mgr.exports.byYear) || [] };
}

function deepRender(res) {
  const DIV = { 7: "1부", 8: "2부", 9: "3부", 10: "4부", 150: "내셔널" };
  const parts = res.clubs.map((c) => {
    if (c.error) return '<p class="note">구단 ' + c.team + " — " + esc(c.error) + "</p>";
    const rows = (c.seasons || []).slice().reverse().map((s) => {
      const st = s.standing;
      const cups = (s.cups || []).filter((x) => x.teams === 2 && x.result === "우승").length;
      return "<tr><td>" + esc(s.season) + "</td><td>" + (DIV[s.division] || "디비전 " + s.division) + "</td>" +
        (st ? "<td><b>" + st.pos + "위</b> / " + st.teams + "</td><td>" + st.w + "-" + st.d + "-" + st.l +
              "</td><td>" + st.gf + ":" + st.ga + "</td><td>" + st.pts + "점</td>"
            : '<td colspan="4" class="dim">' + esc(s.why || "순위 없음") + "</td>") +
        "<td>" + (cups ? "🏆 " + cups : "") + "</td></tr>";
    }).join("");
    return "<h4>구단 번호 " + c.team + " <small>시즌 " + (c.seasons || []).length +
      " · 세이브 시점 " + (c.savedAt || "모름") + "</small></h4>" +
      '<div class="tblwrap"><table class="deept"><thead><tr><th>시즌</th><th>리그</th><th>순위</th><th>승-무-패</th><th>득:실</th><th>승점</th><th>컵</th></tr></thead><tbody>' +
      rows + "</tbody></table></div>";
  }).join("");
  return '<div class="deepbox"><h3>세이브에서 읽은 것 <small>' + res.mb + "MB 만 떠왔습니다</small></h3>" +
    parts + '<p class="note">구단 이름과 선수 이름은 아직 안 붙었습니다 — 그건 game_db(232MB) 가 필요합니다.</p></div>';
}

const SPA_NEED = ["person_record_manager", "player_stats_hist_dt", "tc_league_history_dt",
  "tc_cup_history_dt", "award_year_hist_dt"];

const SPA_WANT = ["comp_history_dt", "news", "play_fixture_manager"];

async function spaBuild(file, wantNames, say) {
  const parse = REG["parse.js"], Bytes = REG["platform-web.js"].Bytes;
  if (!window.NodeRun) throw new Error("깊이 읽기 부분이 안 실려 있다 (한 장으로 묶은 판에서만 된다)");
  NodeRun.clear();
  NodeRun.setBytes(Bytes);

  say("목록 읽는 중 — 파일 꼬리 4MB");
  const TAIL = 4 * 1024 * 1024;
  const tail = platform.from(new Uint8Array(await file.slice(Math.max(0, file.size - TAIL)).arrayBuffer()));
  const idx = parse.readIndexFromTail(tail, file.name);

  const grab = async (name) => {
    const e = idx.entries.find((x) => x.name === name);
    if (!e) return null;
    say("읽는 중 " + name + " — " + (e.stored / 1048576).toFixed(0) + "MB");
    const at = idx.dataStart + e.offset;
    const raw = platform.from(new Uint8Array(await file.slice(at, at + e.stored).arrayBuffer()));
    const out = platform.zstdDecompress(raw);
    const vp = "/save/" + name + "." + e.ext.replace(/^\./, "");
    NodeRun.put(vp, out);
    return { path: vp, mb: out.length / 1048576 };
  };

  const at = {};
  let mb = 0;
  for (const name of SPA_NEED) {
    const g = await grab(name);
    if (!g) throw new Error("세이브에 " + name + " 구획이 없다");
    at[name] = g.path; mb += g.mb;
  }
  for (const name of SPA_WANT) { const g = await grab(name); if (g) { at[name] = g.path; mb += g.mb; } }
  at.matchFiles = [];
  for (const e of idx.entries.filter((x) => /^\d+_\d+/.test(x.name)).slice(0, 120)) {
    const g = await grab(e.name); if (g) { at.matchFiles.push(g.path); mb += g.mb; }
  }

  let gdb = null;
  if (wantNames) {
    const g = await grab("game_db");
    if (g) { gdb = g.path; mb += g.mb;
      say("이름표 만드는 중");
      const r = NodeRun.run("clubs.js", [gdb, "/save/clubs.json"]);
      if (r.error) say("이름표 실패: " + r.error.message);
    }
  } else {
    const e = idx.entries.find((x) => x.name === "game_db");
    if (e) {
      const at0 = idx.dataStart + e.offset;
      const head = platform.from(new Uint8Array(await file.slice(at0, at0 + Math.min(e.stored, 1 << 20)).arrayBuffer()));
      try { NodeRun.put("/save/game_db.dat", platform.zstdDecompress(head).slice(0, 64)); } catch (e2) {}
    }
  }

  say("감독 기록 읽는 중");
  const mgr = NodeRun.run("manager.js", [at["person_record_manager"]]);
  if (mgr.error) throw mgr.error;
  const teams = (mgr.exports && mgr.exports.teams) || [];
  if (!teams.length) throw new Error("감독 기록에서 구단 번호를 못 찾았다");

  const me = teams[0].team;

  say("시즌 순위 짜는 중");
  let histPath = null;
  {
    const r2 = NodeRun.run("season.js", ["/save", String(me), "/hist.json"]);
    if (r2.error) say("연표 실패: " + r2.error.message);
    else histPath = "/hist.json";
  }

  const yr = (mgr.exports && mgr.exports.byYear) || [];
  const now = yr.length ? yr[yr.length - 1].year : 2038;

  const cfg = {
    __base: "/",
    club: { name: "", team: me },
    from: 2023,
    archive: "/ar",
    data: "/없음.json", squad: "/없음.json",
    history: histPath,
    dumps: {
      cup: at["tc_cup_history_dt"],
      asiancup: at["tc_cup_history_dt"],
      stats: at["player_stats_hist_dt"],
      manager: at["person_record_manager"],
      award: at["award_year_hist_dt"],
      compHistory: at["comp_history_dt"] || null,

      news: [at["news"], at["play_fixture_manager"]].concat(at.matchFiles || []).filter(Boolean),
      gameDb: gdb ? [gdb] : [],
      clubmapDir: gdb ? "/save" : null,
      clubsJson: gdb ? "/save/clubs.json" : null,
    },
    clubmapYear: now,
    rounds: { worldcup: 473, asiancup: 3221 },
    capture: {},
  };

  if (window.__AWARDS_SRC) NodeRun.put("/ar/save/awards.js", window.__AWARDS_SRC);
  NodeRun.put("/cfg.json", JSON.stringify(cfg));

  say("자료 만드는 중 — 열 갈래");
  const r = NodeRun.run("payload.js", ["/cfg.json", "--out", "/payload.json"]);
  if (r.error) throw r.error;
  const v = r.files.get("/payload.json");
  const payload = JSON.parse(typeof v === "string" ? v : new TextDecoder().decode(v));
  const log = r.log.slice();
  NodeRun.clear();
  return { payload: payload, log: log, mb: Math.round(mb), team: me };
}

  const names = [...SAVE_FILES.keys()];
  box.innerHTML = '<div class="deepbox"><h3>세이브 깊이 읽기</h3>' +
    '<p class="note">내보내기가 없어도 세이브만으로 시즌·순위·컵을 읽습니다. 필요한 부분만 떠오므로 파일 전체를 열지 않습니다.</p>' +
    names.map((n, i) =>
      '<button type="button" class="deepbtn" data-i="' + i + '">' + esc(n) + " 읽기</button>").join(" ") +

    '<h4 style="margin-top:18px">커리어 한 장 만들기</h4>' +
    '<p class="note">감독 · 구단 · 선수 탭 셋으로 된 화면을 만듭니다. 수상과 포디움까지 읽습니다.<br>' +
    '<b>이름까지</b> 붙이려면 <code>game_db</code>(235MB) 를 더 읽어야 해서 느리고 메모리를 많이 씁니다. ' +
    '이름 없이 만들면 사람과 구단이 번호로 남습니다.</p>' +
    names.map((n, i) =>
      '<button type="button" class="spabtn" data-i="' + i + '" data-names="1">' + esc(n) + " — 이름까지</button> " +
      '<button type="button" class="spabtn" data-i="' + i + '" data-names="0">이름 없이 (빠름)</button>').join("<br>") +
    '<div id="deeplog" class="note"></div><div id="deepout"></div></div>';
  box.querySelectorAll(".deepbtn").forEach(function (b) {
    b.addEventListener("click", async function () {
      const f = SAVE_FILES.get(names[Number(b.getAttribute("data-i"))]);
      const log = $("deeplog"), outEl = $("deepout");
      outEl.innerHTML = "";
      box.querySelectorAll(".deepbtn").forEach((x) => { x.disabled = true; });
      const t0 = Date.now();
      try {
        const res = await deepRead(f, (m) => { log.textContent = m; });
        log.textContent = ((Date.now() - t0) / 1000).toFixed(1) + "초 걸렸습니다";
        outEl.innerHTML = deepRender(res);
      } catch (e) {
        log.textContent = "읽지 못했습니다: " + e.message;
        console.error(e);
      }
      box.querySelectorAll(".deepbtn").forEach((x) => { x.disabled = false; });
    });
  });

  box.querySelectorAll(".spabtn").forEach(function (b) {
    b.addEventListener("click", async function () {
      const f = SAVE_FILES.get(names[Number(b.getAttribute("data-i"))]);
      const wantNames = b.getAttribute("data-names") === "1";
      const log = $("deeplog"), outEl = $("deepout");
      outEl.innerHTML = "";
      const all = box.querySelectorAll(".deepbtn, .spabtn");
      all.forEach((x) => { x.disabled = true; });
      const t0 = Date.now();
      try {
        const r = await spaBuild(f, wantNames, (m) => { log.textContent = m; });
        document.getElementById("aframe").srcdoc = careerHtml(JSON.stringify(r.payload));
        document.getElementById("aname").textContent =
          f.name + " · 구단 번호 " + r.team + " · " + r.mb + "MB 읽음" + (wantNames ? "" : " · 이름 없음");
        $("result").hidden = true;
        $("archive").hidden = false;
        history.pushState({ archive: "spa" }, "", "#커리어");
        log.textContent = ((Date.now() - t0) / 1000).toFixed(1) + "초 걸렸습니다";

        const skip = r.log.filter((x) => x.indexOf("건너뜀") >= 0);
        const warn = r.log.filter((x) => x.indexOf("⚠") >= 0 && x.indexOf("건너뜀") < 0);
        if (skip.length || warn.length)
          outEl.innerHTML = '<p class="note">' +
            (warn.length ? warn.map(esc).join("<br>") + "<br>" : "") +
            (skip.length ? "못 만든 칸 " + skip.length + "개 — " + esc(skip.join(" / ")) : "") + "</p>";
      } catch (e) {
        log.textContent = "만들지 못했습니다: " + e.message;
        console.error(e);
      }
      all.forEach((x) => { x.disabled = false; });
    });
  });
}
